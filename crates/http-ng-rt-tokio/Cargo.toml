[package]
name = "http-ng-rt-tokio"
version = "0.1.0"
description = "http-ng runtime capabilities implemented on top of tokio"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
http-ng-rt = { path = "../http-ng-rt", version = "0.1.0" }
hyper      = { version = "1.11", default-features = false }
socket2    = { version = "0.6", features = ["all"] }
tokio      = { version = "1", features = ["net", "rt", "time", "sync"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
# `TokioHandle`'s tests drive tokio futures on an executor that is not
# tokio: the claim is that a `Sleep` built through a carried handle is
# afterwards pollable by anyone, and `#[tokio::test]` cannot check that
# because it is itself the runtime.
futures-executor = "0.3"

[lints]
workspace = true
