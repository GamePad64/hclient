[package]
name = "http-ng-dns-system"
version = "0.1.0"
description = "System resolver (getaddrinfo + res_query) for http-ng via the Blocking capability"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
bytes        = { workspace = true }
# The DNS wire decoder. Chosen over hand-rolled parsing after reading its
# source: no `unsafe` anywhere in its `src`, `DecodeResult` on every path
# rather than panics, and name decompression that terminates by tracking
# visited offsets in a `HashSet` instead of trusting a "pointers must point
# backwards" rule. It moves the riskiest code in this crate — bounds checks
# over attacker-chosen bytes — out of this repository entirely.
dns-message-parser = "0.9"
futures-core = { workspace = true }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
http-ng-core = { workspace = true }
# `codec`: the `ServiceBinding` -> `RawBinding` conversion and the RFC 9460
# client semantics over it, which used to live in this crate's `svcb.rs` and
# moved when `http-ng-dns-doh` became a third backend applying the same
# rules. The feature is what keeps the decoder out of a build that only
# wants `Resolve` — see that crate's `[features]` table.
http-ng-dns  = { path = "../http-ng-dns", version = "0.1.0", features = ["codec"] }
http-ng-rt   = { path = "../http-ng-rt",  version = "0.1.0" }
thiserror      = { workspace = true }

[dev-dependencies]
assert_matches   = { workspace = true }
futures-executor = { version = "0.3", default-features = false, features = ["std"] }
rstest           = { workspace = true }

# NOT `[lints] workspace = true`, for the same reason `http-ng-fetch` isn't
# (see amendment C7): the workspace table sets `unsafe_code = "forbid"`,
# and `forbid` cannot be relaxed from inside a crate (`E0453`). This crate
# carries the project's second and third `unsafe` files — the `res_query(3)`
# declaration and call in `src/sys/res_query.rs`, and the `DnsQuery_UTF8`
# record walk in `src/sys/windows.rs` — which need `deny`,
# overridable by a scoped `#[allow]`, not `forbid`. See
# `docs/superpowers/specs/2026-08-05-http-ng-design.md` amendment C8.
#
# `missing_debug_implementations` and `unexpected_cfgs` are restated here
# because opting out of the workspace table drops them along with
# `unsafe_code`, and losing them silently is exactly the drift this project
# spends review effort on elsewhere.
# Windows only. Supplies `DnsQuery_UTF8` and the `DNS_SVCB_DATA` family —
# the record the OS has already parsed, which is why no DNS wire parsing
# exists on the Windows path. Statically linked: `DnsQuery_UTF8` has been
# present since Windows 2000, and its SVCB support since Windows 10. See
# `src/sys/windows.rs` for which half of that is verified here and which is
# taken on the project owner's word.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_NetworkManagement_Dns",
] }

[lints.rust]
unsafe_code                   = "deny"
missing_debug_implementations = "warn"
unexpected_cfgs               = { level = "warn", check-cfg = [] }
