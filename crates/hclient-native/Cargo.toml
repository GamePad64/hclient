[package]
name = "hclient-native"
version.workspace = true
description = "Native transport for hclient: TCP + TLS + HTTP/1.1 on hyper"
keywords     = ["hclient", "transport", "http", "tls", "hyper"]
categories   = ["web-programming::http-client", "network-programming"]
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

# HTTP/2 (v0.2 W3) sits behind a feature rather than in `default`, like
# every other feature in this vertical: h2 is a second framing layer and a
# second dependency stack, and a build that will only ever speak HTTP/1.1
# should carry neither.
#
# **Not `hyper/http2`, which is what the v0.2 design document proposed** —
# see `crate::http2`'s module doc for the measurement that changed the
# answer. In one line: hyper's h2 client hands the connection driver to a
# `hyper::rt::Executor`, this transport deliberately has no executor to
# hand it to, and the only shape that fits (a queue of `Box<dyn Future>`
# polled by hand) costs either `NativeBody: Send` or a `Send` bound on the
# IO — and under Cargo's feature unification both are paid by builds that
# never asked for h2. The `h2` crate's `Connection` is a concrete future
# this crate polls itself, exactly as it already polls hyper's HTTP/1 one.
#
# `tokio` is here for its `AsyncRead`/`AsyncWrite` traits alone — with NO
# features, so no runtime, no reactor and no timer come with it: `h2` is
# written against those two traits and this crate's IO is
# `hyper::rt::{Read, Write}`, so `http2::TokioIo` bridges them.
#
# **There is no `websocket` feature, and that is a decision rather than an
# omission.** WebSocket over this transport is
# `hclient-tungstenite`, a crate that depends on this one; what stays
# here is the h1 upgrade (`src/upgrade.rs`), which is hyper and nothing
# else. It was a feature here once, and the
# reason it stopped being one is the reason the WebSocket framing is not a
# feature
# of this crate either: Cargo's features are additive, so one crate
# anywhere in a graph switching it on put `tungstenite` — measured at +17
# crates for this crate alone, +14 for a full client build — into every
# other crate's build of this transport. A dependency in the other
# direction cannot be turned on from outside.
# See the root Cargo.toml: `default` is near-empty here by design.
[package.metadata.docs.rs]
all-features = true

[features]
default = []
http2 = ["dep:h2", "dep:tokio"]
# The QUIC arm. It brings `mod h3` and `mod quinn` — and through them
# quinn itself — and nothing
# else: what `H3<R, T, D>` needs OF the runtime and the TLS backend
# (`UdpBind`, `QuicTlsConnect`) are the caller's own features on their own
# crates, and `Native::http3` is where those bounds are checked.
#
# The arm is stored erased, so this feature adds a field and a constructor
# rather than bounds: `Native<Embassy, NoTls, IpLiteralOnly>` compiles with
# it on, it simply never calls `http3()`. What a neighbour switching this
# on costs such a build is dead code in the graph, not a broken one.
http3 = ["dep:h3", "dep:h3-quinn", "dep:hclient-tls-quic", "dep:quinn"]
# No `dep:` entries, and that is the point: both protocols behind this
# flag are written here, so the feature buys code size back for a
# constrained target and costs nobody a dependency. See `src/proxy.rs`.
proxy = []

[dependencies]
bytes          = { workspace = true }
futures-util   = { version = "0.3", default-features = false, features = ["std"] }
h2             = { version = "0.4", optional = true }
http           = { workspace = true }
http-body      = { workspace = true }
http-body-util = { workspace = true }
hclient-core   = { workspace = true }
hclient-dns    = { path = "../hclient-dns",   version = "0.1.0-alpha.1" }
# No default features, from `[workspace.dependencies]`: this crate uses
# `happy_eyeballs` only, and a default-on `idn` here would union back into
# every build that also contains `hclient`, turning the facade's `idn`
# switch into a no-op for exactly the native builds that have
# `default-transport`.
hclient-proto  = { workspace = true }
hclient-rt     = { path = "../hclient-rt",    version = "0.1.0-alpha.1" }
hclient-tls    = { path = "../hclient-tls",   version = "0.1.0-alpha.1" }
# The HTTP/3 stack, folded in as `mod h3` and `mod quinn` — these are the
# dependencies those two modules bring, all of them optional and all
# reached only through the `http3` feature.
#
# `quinn` with `ring` **and** `futures-io`: the first because binding an
# endpoint needs an HMAC key for stateless resets and an AEAD for retry
# tokens independently of any TLS session (`EndpointConfig` has no
# `Default` without one), the second because `h3-quinn` requires it. No
# `runtime-*` — the runtime is `mod quinn`. No `rustls-*` — the crypto
# arrives already built, as an `Arc<dyn quinn_proto::crypto::ClientConfig>`
# from `hclient-tls-quic`, so nothing here picks a TLS provider.
h3               = { version = "0.0.8",  optional = true }
pin-project-lite = "0.2"
h3-quinn         = { version = "0.0.10", optional = true }
hclient-tls-quic = { path = "../hclient-tls-quic", version = "0.1.0-alpha.1", optional = true }
quinn            = { version = "0.11", default-features = false, features = ["ring", "futures-io"], optional = true }
hyper          = { version = "1.11", default-features = false, features = ["client", "http1"] }
futures-core   = { workspace = true }
futures-sink   = { workspace = true }
thiserror      = { workspace = true }
tokio          = { version = "1", default-features = false, optional = true }

[dev-dependencies]
# `mod h3`'s own unit tests build a stub `QuicTlsConnect`, whose one method
# returns quinn's client-config trait object — the type that seam names.
quinn-proto        = { version = "0.11", default-features = false }
# The QUIC/TCP pair the routing tests stand up: two real servers behind one
# authority, so a request reaching one is a choice and not the only
# possibility.
futures-util       = { version = "0.3", default-features = false, features = ["std"] }
h3                 = "0.0.8"
h3-quinn           = "0.0.10"
http-body-util     = { workspace = true }
quinn              = { version = "0.11", default-features = false, features = ["futures-io", "runtime-tokio", "rustls-ring"] }

futures-executor    = { version = "0.3", default-features = false, features = ["std"] }
# Path only, deliberately, where every other workspace dependency here is
# `{ workspace = true }`. This one is a **cycle**: `hclient` depends on this
# crate, and this crate's tests depend on `hclient`. Cargo allows that inside
# a workspace and refuses it at `cargo package`, because a dev-dependency
# carrying a version requirement has to be resolvable from the registry —
# and `hclient` cannot be there until this crate is. Dropping the version
# makes cargo strip the dev-dependency from the published manifest, which is
# the documented way through and changes nothing about how the tests build
# here. Caught by `just package-build` rather than by reading.
hclient = { path = "../hclient" }
hclient-dns-system  = { path = "../hclient-dns-system",  version = "0.1.0-alpha.1" }
hclient-rt-tokio    = { path = "../hclient-rt-tokio",    version = "0.1.0-alpha.1", features = ["udp"] }
hclient-rt-smol     = { path = "../hclient-rt-smol",     version = "0.1.0-alpha.1" }
hclient-tls-rustls  = { path = "../hclient-tls-rustls",  version = "0.1.0-alpha.1", features = ["webpki-roots", "quic"] }
# `tests/tls_server_name.rs` alone: a REAL TLS server on loopback, whose
# certificate carries an IP SAN. The claim there is "the handshake
# completes", and a handshake needs a second implementation to complete
# against — a mock `TlsConnect` (this crate already has `FakeTls`) can only
# report the name it was handed, which is the argument rather than the
# outcome. Same versions as `hclient-tls-rustls`'s own dev-dependencies, so
# no second copy of rustls enters the graph; dev-only, so none of it
# reaches a consumer.
rcgen               = "0.14"
rustls              = { version = "0.23", default-features = false, features = ["ring", "std"] }
tokio-rustls        = { version = "0.26", default-features = false, features = ["ring"] }
# `sync` is for `tests/cancel.rs` alone: its mock server runs on an OS
# thread and has to hand two verdicts back into an async test that is at
# the same time polling the future under test, which a `std::sync::mpsc`
# receiver cannot be awaited alongside. Listed explicitly rather than left
# to feature unification with `hyper`'s own `tokio/sync` — that union is a
# fact about today's graph, not a dependency this crate declared.
# `io-util` is `tests/tls_server_name.rs`'s: its server reads the request
# head and writes a response through `tokio_rustls::TlsStream`, which is
# `AsyncRead`/`AsyncWrite` and nothing else without the extension traits.
tokio               = { version = "1", features = ["io-util", "macros", "rt-multi-thread", "net", "sync", "time"] }

[lints]
workspace = true
