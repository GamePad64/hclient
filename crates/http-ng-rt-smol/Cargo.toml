[package]
name = "http-ng-rt-smol"
version = "0.1.0"
description = "http-ng runtime capabilities implemented on top of smol"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
async-net      = "2"
async-io       = "2"
async-executor = "1"
blocking       = "1"
futures-lite   = "2"
http-ng-rt     = { path = "../http-ng-rt", version = "0.1.0" }
socket2        = { version = "0.6", features = ["all"] }

# `EINPROGRESS` can't be observed through `std::io::ErrorKind`: the
# corresponding variant (`ErrorKind::InProgress`) is still `#[unstable(feature
# = "io_error_inprogress")]` in the standard library — unavailable on stable.
# `socket2` hits the same problem in its own `Socket::connect_timeout` and
# solves it the same way: reads `raw_os_error()` and compares it against
# `libc::EINPROGRESS` under `cfg(unix)`. The version pin is the same lower
# bound `socket2` uses for this same dependency.
[target.'cfg(unix)'.dependencies]
libc = "0.2.172"

[dev-dependencies]
futures-executor = { version = "0.3", default-features = false, features = ["std"] }
# Only for `tests/adversarial_smol_io.rs`: `hyper` is a normal (non-dev)
# dependency of `http-ng-rt`, not of this crate, so it's not visible to an
# integration test here without its own dev-dependency.
hyper            = { version = "1.11", default-features = false }

[lints]
workspace = true
