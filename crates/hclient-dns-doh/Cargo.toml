[package]
name = "hclient-dns-doh"
version = "0.1.0-alpha.15"
description = "DNS-over-HTTPS (RFC 8484) resolver for hclient, over any Transport"
keywords     = ["hclient", "dns", "doh", "resolver"]
categories   = ["network-programming"]
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

# The mutation scripts beside `src/` are development instruments — they
# rewrite this crate's own source to check that a test can fail — and a
# reader who downloads the crate has no use for one. Nothing else here is
# excluded: the tests ship, because a downloaded `.crate` running its own
# suite is what distribution packagers do.
exclude = ["*.py"]

# See the root Cargo.toml: `default` is near-empty here by design.
[package.metadata.docs.rs]
all-features = true

[dependencies]
bytes          = { workspace = true }
# The DNS codec, and the reason it is this one is that it does **both**
# granularities. This module decodes whole messages —
# `Message::from_octets`, a header and sections — where `hclient-dns-system`
# decodes one record's RDATA, and `dns-message-parser` offers only the
# first. That is what had this workspace carrying two decoders; `domain`
# covers both, so the second one lost its subject.
#
# **Not a saving: measured here, 26 -> 31 crates**, three out and eight
# in. Out: `base64`, `dns-message-parser`, `hex`. In: `domain`,
# `domain-macros`, `octseq`, `jiff`, `jiff-core`, `hashbrown`, `foldhash`,
# `syn 2.0`. `jiff` and `jiff-core` are already in `hclient`'s graph for
# the cookie and cache date parsers, so a build with `hclient` and
# `cookies` or `cache` pays six rather than eight.
#
# **`syn 2.0` is a second copy rather than a replacement**, and counting it
# as a swap was the easy mistake: `syn 3.0` stays, because `thiserror-impl`
# pulls it and `thiserror` is in every crate here. `domain-macros` wants
# 2.0, so a `domain` build has both — which `cargo deny`'s
# `multiple-versions = "warn"` reports, and which is the cheap kind by this
# workspace's own rule, since the two never exchange a type. It is the
# straight trade for the `base64` duplicate this change removed: that one
# was ours to fix and this one is upstream's to fix.
#
# `default-features = false` deliberately, as in `hclient-dns-system`:
# `std` there would also bring `rand`, for a query id this crate never
# mints — RFC 8484 §4.1 fixes the DoH query's ID at zero.
#
# **`alloc` is not free, and it is not optional either.** It is what
# `Name::vec_from_str` and `MessageBuilder::new_vec` need (both want
# `FromBuilder`, which `alloc` supplies), and in `domain` 0.12.2 that
# feature maps to `dep:hashbrown` — so `hashbrown` and `foldhash` are the
# price of building a query at all, not of a map this path never uses.
# Dropping the feature was tried and does not compile: three `E0599`s on
# the two constructors above. Written down because the sibling crate's
# comment says `std` costs those two, which reads as though
# `default-features = false` avoided them and here it does not.
#
# `hickory-proto` is refused and stays refused, re-measured: even with
# `default-features = false` it pulls `idna`, `icu_normalizer(_data)`,
# `icu_properties(_data)`, `icu_collections`, `icu_provider`,
# `icu_locale_core` and `form_urlencoded` — about 60 crates, and exactly
# the Unicode tables `hclient-idn` exists to keep off Windows and Android.
domain         = { version = "0.12", default-features = false, features = ["alloc"] }
futures-core   = { workspace = true }
futures-util   = { version = "0.3", default-features = false, features = ["std"] }
http           = { workspace = true }
http-body      = { workspace = true }
http-body-util = { workspace = true }
hclient-core   = { workspace = true }
# The RFC 9460 client semantics and the vocabulary they read — `RawBinding`,
# `RawParam`, `endpoint_from_binding` — shared with `hclient-dns-system`
# rather than copied, for the reason `hclient_dns::svcb`'s module doc gives:
# §2.4/§2.5/§8 are the part most likely to be got subtly wrong and are
# identical on every platform.
#
# **No `features = ["codec"]` any more, because there is no such feature.**
# It gated one function, `binding_from_decoded`, whose signature named
# `domain` in four places while `hclient-dns` re-exported none of it — so
# the seam crate's promise carried this decoder's major version for a
# function only this crate ever called. It is `wire.rs`'s now, beside the
# `Message::from_slice` that produces its input, and `domain` is named in
# this manifest, which is where the decision was actually being made.
hclient-dns    = { path = "../hclient-dns", version = "0.1.1" }
thiserror      = { workspace = true }
# Unconditional, for the reason `hclient-tls-rustls` states: with no
# subscriber installed a `trace!` is a load and a branch, and a feature
# would guard a cost that is not there. A resolver whose transport is an
# HTTP client is the one place in this family where a DNS failure and a
# request failure look alike from outside, which is what these lines
# separate.
#
# Measured, 23 -> 26: `tracing`, `tracing-core` and `once_cell`. Still no
# `tokio`, `hyper` or `h2` — this crate makes its request through a
# `Transport` a caller supplies, and that is unchanged.
tracing        = { version = "0.1", default-features = false, features = ["std"] }

[dev-dependencies]
rstest           = { workspace = true }
# The tests drive this resolver through a REAL transport against a real
# loopback server, rather than through a mock: the claims being made are
# about what goes over the wire (`tests/query_bytes.rs`) and about what a
# caller gets back, and a mock transport would let both be true of a
# `Transport` impl that exists only in this crate's tests.
#
# `NoTls` + `IpLiteralOnly` is not a shortcut either — it is the shape
# `Doh::pinned` is for, and it means these tests link no TLS stack and no
# system resolver. dev-dependencies are outside `-e normal`, so none of
# this reaches a consumer's graph.
#
# Not a dependency cycle: `hclient-native` depends on `hclient-dns`, never
# on this crate.
hclient-native   = { path = "../hclient-native", version = "0.1.0-alpha.15" }
hclient-rt-tokio = { path = "../hclient-rt-tokio", version = "0.1.0-alpha.13" }
hclient-tls      = { path = "../hclient-tls", version = "0.1.0" }
# `tests/live.rs` alone, and `platform-verifier` is the whole point of it
# rather than a convenience. The unverified row that suite exists to settle
# is whether a certificate presented for an IP ADDRESS validates through the
# PLATFORM's own verifier — `Doh::pinned` takes an IP literal, so that is the
# handshake every pinned deployment makes. `webpki-roots` would answer a
# different question (rustls's bundled roots, its own webpki path) and leave
# the one asked exactly where it was.
hclient-tls-rustls = { path = "../hclient-tls-rustls", version = "0.1.0-alpha.13", features = ["platform-verifier"] }
tokio            = { version = "1", features = ["macros", "rt-multi-thread", "time"] }

[lints]
workspace = true
