[package]
name = "hclient-tower"
version.workspace = true
description = "hclient's Transport as a tower::Service, so the tower-http middleware stack applies"
keywords     = ["hclient", "transport", "tower", "middleware"]
categories   = ["web-programming::http-client", "asynchronous"]
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

# See the root Cargo.toml: `default` is near-empty here by design.
[package.metadata.docs.rs]
all-features = true

[dependencies]
thiserror = { workspace = true }
bytes         = { workspace = true }
http          = { workspace = true }
http-body     = { workspace = true }
hclient-core  = { workspace = true }
tower-service = "0.3"

[dev-dependencies]
futures-executor = { version = "0.3", default-features = false, features = ["std"] }
hclient          = { workspace = true, features = ["test-util", "cookies"] }
hclient-mock     = { workspace = true }
http-body-util   = { workspace = true }
tower-service    = "0.3"
# "limit" alongside "util": `tests/concurrency.rs` drives
# `tower::limit::ConcurrencyLimit` through both adapters. A DEV-dependency
# deliberately — the limit is tower's, not this crate's, and taking it as a
# normal dependency would put `tokio` (`sync`) and `tokio-util` into the
# graph of every consumer of this crate for a layer they may never use.
tower            = { version = "0.5", default-features = false, features = ["util", "limit"] }
# The app-transport tests drive a real `Client`, and its default clock is
# tokio's; no reactor is needed for an in-process service, but the runtime is.
tokio            = { version = "1", features = ["rt", "macros"] }
# The proof that `AppTransport` really does drive an `axum::Router`, which
# is the whole headline. A dev-dependency, so no consumer pays for it —
# and 22 crates with `default-features = false`, carrying neither tokio
# nor hyper, which is what makes proving it affordable rather than a claim.
axum             = { version = "0.8", default-features = false }

[lints]
workspace = true
