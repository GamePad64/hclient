[package]
name = "http-ng"
version = "0.1.0"
description = "Кроссплатформенный асинхронный HTTP-клиент: один код под native, browser и WASI"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = []
# Мок-транспорт для тестов потребителей.
test-util = ["dep:http-body-util"]

[dependencies]
bytes         = { workspace = true }
futures-core  = { workspace = true }
http          = { workspace = true }
http-body     = { workspace = true }
http-ng-core  = { workspace = true }
http-ng-proto = { workspace = true }
# `pub mod mock` не под `cfg(test)`, а под фичей `test-util` — он часть
# обычной (не dev) сборки крейта, когда фича включена, и линкуется во
# внешние интеграционные тесты (`tests/shape.rs`). Поэтому исполнитель мока
# — обычная опциональная зависимость, а не dev-dependency: dev-зависимости
# не видны при сборке крейта как зависимости другого таргета.
http-body-util = { workspace = true, optional = true }

[dev-dependencies]
futures-executor = { version = "0.3", default-features = false, features = ["std"] }

[lints]
workspace = true
