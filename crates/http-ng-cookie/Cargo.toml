[package]
name = "http-ng-cookie"
version = "0.1.0"
description = "A sans-io cookie jar for http-ng: RFC 6265bis parsing, storage, domain/path matching and expiry"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = ["public-suffix"]
# The compiled-in Public Suffix List, which is what makes `Domain=co.uk` a
# refusal rather than a cookie shared across every registrant under `.uk`.
#
# ON by default, and measured before it was chosen rather than after —
# `+77,296 bytes` in a release binary (LTO, one codegen unit, stripped) and
# exactly **one** crate in the graph, with no transitive dependency at all.
# The numbers for the alternatives, and the gap this one leaves, are in
# `suffix.rs`'s module documentation; they are the reason the choice is a
# feature and not a silent `[dependencies]` line.
#
# Turning it off removes `public-suffix` from the build entirely and makes
# the jar **host-only**: every `Domain` attribute is refused with
# `Rejected::NoPublicSuffixList`, so a cookie is only ever returned to the
# exact host that set it. That is strictly *narrower* than the list build,
# never wider — a no-list build cannot be talked into sending a cookie
# somewhere the list build would not.
public-suffix = ["dep:public-suffix"]

[dependencies]
http = { workspace = true }
thiserror = { workspace = true }
# `1Password/passkey-rs`' transliteration of Go's
# `golang.org/x/net/publicsuffix`: a compressed trie over the Mozilla list,
# no dependencies of its own, MIT OR Apache-2.0. `default-features` is left
# on deliberately — its `default_provider` feature is the list itself, and
# without it the crate is an empty seam.
public-suffix = { version = "0.1.3", optional = true }

[dev-dependencies]
rstest = { workspace = true }
assert_matches = { workspace = true }
proptest = { workspace = true }
# Two independent oracles for `date.rs`, both dev-only. `httpdate` is the
# incumbent HTTP-date parser and answers the *format* question — which
# strings are accepted at all — where `time` answers the *arithmetic* one,
# over the whole 1601..=9999 range that `Expires` can name and `httpdate`
# (whose result is a `SystemTime` built from `UNIX_EPOCH`) cannot reach.
httpdate = "1.0"
time = "0.3"

[lints]
workspace = true
