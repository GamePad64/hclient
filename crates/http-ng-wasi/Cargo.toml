[package]
name = "http-ng-wasi"
version = "0.1.0"
description = "Транспорт http-ng поверх wasi:http 0.3"
edition.workspace = true
# Выше workspace-минимума (1.85): требование `wasip3` — 1.87. MSRV job в CI
# проверяет только три ядровых крейта, так что расхождение намеренное.
rust-version = "1.90"
license.workspace = true
repository.workspace = true

[dependencies]
bytes        = { workspace = true }
# Нужен для `join!` в `Transport::execute` (Task 16): тело пишется в
# `BodyWriter` параллельно с `client::send`, а не до или после него — это и
# есть честный `full_duplex`. Только `async-await` (даёт `join!` через
# `futures-util/async-await` + `async-await-macro`) — `default-features =
# false` без `std`/`executor`: свой executor этому крейту не нужен, вызовы
# `wasip3` уже управляются рантаймом хоста.
futures      = { version = "0.3", default-features = false, features = ["async-await"] }
http         = { workspace = true }
http-body    = { workspace = true }
http-ng-core = { workspace = true }
# `http-compat`: даёт `IncomingBody`/`IncomingResponseBody` и типы
# `wasi:http` (`ErrorCode` и т.д.) вместо голых WIT-байндингов. Фичи по
# умолчанию (`std`, `bitflags`) не отключаем: этот крейт нужен только на
# `wasm32-wasip2`, `no_std`-сборка тут не сценарий.
wasip3       = { version = "0.7.0", features = ["http-compat"] }

# Гость для интеграционного прогона `tests/live_roundtrip.rs` (Task 16) —
# см. doc-комментарий в самом файле про то, почему это `cdylib`-пример через
# `wasip3::cli::command::export!`, а не обычный `fn main()`.
[[example]]
name = "live_roundtrip_guest"
path = "examples/live_roundtrip_guest.rs"
crate-type = ["cdylib"]

# Сквозной пример (Task 17): та же форма `wasip3::cli::command::export!`, что
# у `live_roundtrip_guest` выше и по той же причине — см. doc-комментарий
# `examples/fetch.rs` про то, почему не `fn main()`.
[[example]]
name = "fetch"
path = "examples/fetch.rs"
crate-type = ["cdylib"]

[dev-dependencies]
# Только для `tests/live_roundtrip.rs`: разобрать
# `cargo build --message-format=json`, чтобы взять настоящий путь
# собранного гостя у cargo, а не гадать его по относительному пути (тот
# гадает неверно при нестандартном `CARGO_TARGET_DIR`). Дев-зависимость не
# входит в граф зависимостей публикуемого крейта.
serde_json = "1"
# Только для `examples/fetch.rs`: сквозной пример собирает прикладной код
# через пользовательский `http_ng::Client`, а не напрямую через
# `Transport::execute` (как `live_roundtrip_guest`) — именно это и есть код,
# который вертикали 2 и 3 переиспользуют без изменений. Нет обратного цикла:
# `http-ng` не зависит от `http-ng-wasi`, а dev-dependency в цикл графа сборки
# библиотеки не входит в любом случае.
http-ng = { workspace = true }

[lints]
workspace = true
