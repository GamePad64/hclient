[package]
name = "hclient-dns"
version = "0.1.0"
description = "Pluggable resolver trait for hclient"
keywords     = ["hclient", "dns", "resolver", "seam"]
categories   = ["network-programming"]
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

# See the root Cargo.toml: `default` is near-empty here by design.
[package.metadata.docs.rs]
all-features = true

[features]
default = []
# **There is no `codec` feature any more, and it is the `domain`
# dependency that went rather than the guarantee.** That flag gated one
# function — `binding_from_decoded`, the `Https` -> `RawBinding`
# conversion — and existed so that a build resolving through
# `IpLiteralOnly`, `getaddrinfo` or `wasi:http` never linked a DNS codec
# to get at `Resolve`. It succeeded at that and cost something nobody had
# priced: the function it gated named `domain` in four places — the
# parameter, the error type and two bounds — and this crate re-exports no
# `domain`, so the promise of the `Resolve` seam included a foreign
# crate's major version, for a function whose only caller was ever
# `hclient-dns-doh`. The function is that crate's now, where it names a
# decoder that crate already depends on directly.
#
# What the flag protected is now unconditional rather than opt-out:
# **there is no `--features` line that puts a DNS codec in this crate's
# graph**, because it has no optional dependency left. Measured
# `cargo tree -e normal`, unique crates: 14 before without `codec`, 22
# with, and **14 with every feature there is** after.
#
# The flag itself was not the defect and is not being blamed for one; a
# gate with nothing left to gate is simply this workspace's *distinction
# with one reachable side* under another name, and the prose in
# `hclient-dns-system`'s and `hclient-dns-doh`'s manifests that pointed at
# it was corrected with it rather than left to rot.

[dependencies]
bytes        = { workspace = true }
# **No `domain` here, and no optional dependency at all.** The one
# function that needed a DNS decoder — `binding_from_decoded` — moved to
# `hclient-dns-doh`, its only caller, because its signature named `domain`
# in four places while this crate re-exported none of it: see the
# `[features]` note above. So the decoder question is settled per backend,
# in the manifest of the crate that decodes, which is where it was always
# answered in fact.
#
# What that leaves recorded for whoever revisits it: `hickory-proto` is
# refused and stays refused as a decoder for this family, re-measured —
# even with `default-features = false` it pulls `idna`,
# `icu_normalizer(_data)`, `icu_properties(_data)`, `icu_collections`,
# `icu_provider`, `icu_locale_core` and `form_urlencoded`, about 60
# crates, and exactly the Unicode tables `hclient-idn` exists to keep off
# Windows and Android. That argument belongs to the two crates that
# actually choose a decoder, and both state it themselves.
futures-core = { workspace = true }
hclient-core = { workspace = true }
# Not a new crate in anyone's graph: `hclient-core` already depends on it,
# so this line adds a name, not a node. `svcb::SvcbRecordError` is the one
# error this crate owns.
thiserror    = { workspace = true }

[dev-dependencies]
# Tests only (`tests/`): `stream::iter`/`stream::empty`/`StreamExt`, not in
# the library itself — the one library-side consumer of `stream::empty`
# (`Resolve::lookup_svcb`'s default body) is hand-implemented in `lib.rs`
# (`EmptyStream`), so as not to drag `futures-util` (and with it
# `futures-task`, `pin-project-lite`, `slab`) into the library's
# dependencies for the sake of one function. See the `EmptyStream` doc
# comment in `lib.rs`.
futures-executor = { version = "0.3", default-features = false, features = ["std"] }
futures-util     = { version = "0.3", default-features = false, features = ["std"] }
rstest           = { workspace = true }
thiserror        = { workspace = true }

[lints]
workspace = true
