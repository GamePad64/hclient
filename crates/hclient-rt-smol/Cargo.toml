[package]
name = "hclient-rt-smol"
version.workspace = true
description = "hclient runtime capabilities implemented on top of smol"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

# UDP is behind a feature, off by default, mirroring
# `crates/hclient-rt-tokio/Cargo.toml` line for line and for the same
# measurement rather than preference: the GSO/GRO/ECN work is `cmsg` on a
# descriptor, `quinn-udp` already does it correctly for six platforms, and
# reimplementing it here would be a second copy of the hardest part of a
# UDP stack in a crate whose job is to adapt a runtime. So the feature
# pulls `quinn-udp` — and a build that only ever speaks HTTP/1 or HTTP/2
# does not pay for it.
#
# It costs **no other new dependency**: `async-io` is already a direct
# dependency below, and it is the only thing this backend needs from smol.
# See the root Cargo.toml: `default` is near-empty here by design.
[package.metadata.docs.rs]
all-features = true

[features]
default = []
udp = ["dep:quinn-udp"]

[dependencies]
async-net      = "2"
async-io       = "2"
async-executor = "1"
blocking       = "1"
futures-lite   = "2"
hclient-rt     = { path = "../hclient-rt", version = "0.1.0" }
quinn-udp      = { version = "0.6", default-features = false, optional = true }
socket2        = { version = "0.6", features = ["all"] }

# `EINPROGRESS` can't be observed through `std::io::ErrorKind`: the
# corresponding variant (`ErrorKind::InProgress`) is still `#[unstable(feature
# = "io_error_inprogress")]` in the standard library — unavailable on stable.
# `socket2` hits the same problem in its own `Socket::connect_timeout` and
# solves it the same way: reads `raw_os_error()` and compares it against
# `libc::EINPROGRESS` under `cfg(unix)`. The version pin is the same lower
# bound `socket2` uses for this same dependency.
[target.'cfg(unix)'.dependencies]
libc = "0.2.172"

[dev-dependencies]
futures-executor = { version = "0.3", default-features = false, features = ["std"] }
# Only for `tests/adversarial_smol_io.rs`: `hyper` is a normal (non-dev)
# dependency of `hclient-rt`, not of this crate, so it's not visible to an
# integration test here without its own dev-dependency.
hyper            = { version = "1.11", default-features = false }

[lints]
workspace = true
