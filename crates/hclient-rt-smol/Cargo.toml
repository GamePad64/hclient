[package]
name = "hclient-rt-smol"
version = "0.1.0-alpha.13"
description = "hclient runtime capabilities implemented on top of smol"
keywords     = ["hclient", "runtime", "smol", "async"]
categories   = ["asynchronous", "network-programming"]
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

# UDP is unconditional, as in `hclient-rt-tokio`. The GSO/GRO/ECN work is `cmsg` on a descriptor,
# and `quinn-udp` already does it correctly for six platforms, so it is a
# dependency rather than a second copy of the hardest part of a UDP stack.
#
# It was behind a `udp` feature, off by default, and the feature went on a
# measurement: it held exactly one crate, `quinn-udp` (plus `libc` on
# Windows); everything else it needs was already in the graph. None of its
# types reach this crate's API: `hclient_rt::EcnCodepoint` is what crosses
# the seam, so its version is not part of this crate's promise either. What
# the feature cost was a line every consumer had to remember, and
# `hclient-native` once failed to build on its own for want of it. The UDP
# seam itself, `hclient_rt::UdpBind`, was never behind a feature.
#
# See the root Cargo.toml: `default` is near-empty here by design.
[package.metadata.docs.rs]
all-features = true

[dependencies]
futures-core = { workspace = true }
async-net      = "2"
async-io       = "2"
async-executor = "1"
blocking       = "1"
futures-lite   = "2"
hclient-rt     = { path = "../hclient-rt", version = "0.1.0" }
quinn-udp      = { version = "0.6", default-features = false }
socket2        = { version = "0.6", features = ["all"] }

# `EINPROGRESS` can't be observed through `std::io::ErrorKind`: the
# corresponding variant (`ErrorKind::InProgress`) is still `#[unstable(feature
# = "io_error_inprogress")]` in the standard library — unavailable on stable.
# `socket2` hits the same problem in its own `Socket::connect_timeout` and
# solves it the same way: reads `raw_os_error()` and compares it against
# `libc::EINPROGRESS` under `cfg(unix)`. The version pin is the same lower
# bound `socket2` uses for this same dependency.
[target.'cfg(unix)'.dependencies]
libc = "0.2.172"

[dev-dependencies]
futures-executor = { version = "0.3", default-features = false, features = ["std"] }

[lints]
workspace = true
