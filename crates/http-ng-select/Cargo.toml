[package]
name = "http-ng-select"
version = "0.1.0"
description = "One http-ng transport over both protocol stacks, choosing HTTP/3 where an origin's HTTPS record offers it"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

# Its own crate rather than a feature of either member, for the reason
# `http-ng-h3` is not a feature of `http-ng-native`: Cargo's features are
# additive, so a `select` feature on either would put the whole QUIC stack —
# and the `UdpBind + Spawn` bounds it needs from the runtime — into every
# build in any graph that switched it on, including the ones that will only
# ever speak HTTP/1.1. A crate is opt-in by being named.
[dependencies]
bytes          = { workspace = true }
futures-util   = { version = "0.3", default-features = false, features = ["std"] }
http           = { workspace = true }
http-body      = { workspace = true }
http-ng-core   = { workspace = true }
http-ng-dns    = { path = "../http-ng-dns",    version = "0.1.0" }
http-ng-h3     = { path = "../http-ng-h3",     version = "0.1.0" }
http-ng-native = { path = "../http-ng-native", version = "0.1.0" }
# Not for anything this crate calls: `Native<R, T, D>` carries `R:
# TcpConnect + Timer` and `T: TlsConnect` on the STRUCT, so a field of
# that type cannot be declared without naming the two traits.
http-ng-rt     = { path = "../http-ng-rt",     version = "0.1.0" }
http-ng-tls    = { path = "../http-ng-tls",    version = "0.1.0" }
thiserror      = { workspace = true }

# The two servers `tests/choice.rs` puts on one port number — a real QUIC
# endpoint speaking HTTP/3 on UDP and a real rustls listener speaking
# HTTP/1.1 on TCP — plus the runtime and TLS backend that satisfy both
# members' bounds at once. `http-ng-rt-tokio`'s `udp` feature is
# `docs/v04-design.md` P2: without it `TokioHandle` does not implement
# `UdpAdoptStd` and `Selecting<TokioHandle, ..>` cannot be named.
[dev-dependencies]
futures-util       = { version = "0.3", default-features = false, features = ["std"] }
h3                 = "0.0.8"
h3-quinn           = "0.0.10"
http-body-util     = { workspace = true }
http-ng            = { workspace = true }
http-ng-rt-tokio   = { path = "../http-ng-rt-tokio",   version = "0.1.0", features = ["udp"] }
http-ng-tls-rustls = { path = "../http-ng-tls-rustls", version = "0.1.0", features = ["quic"] }
quinn              = { version = "0.11", default-features = false, features = ["futures-io", "runtime-tokio", "rustls-ring"] }
rcgen              = "0.14"
rustls             = { version = "0.23", default-features = false, features = ["ring", "std"] }
tokio              = { version = "1", features = ["io-util", "macros", "rt-multi-thread", "net", "sync", "time"] }
tokio-rustls       = { version = "0.26", default-features = false, features = ["ring"] }

[lints]
workspace = true
