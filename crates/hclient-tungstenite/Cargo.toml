[package]
name = "hclient-tungstenite"
version.workspace = true
description = "WebSocket framing for hclient: RFC 6455 over an upgraded byte stream, on tungstenite"
keywords     = ["hclient", "websocket", "tungstenite", "rfc6455"]
categories   = ["web-programming::websocket"]
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

# No features at all, and that is the whole reason this crate exists.
# `tungstenite` used to be a `websocket` feature of `hclient-native`, and
# Cargo's features are additive: one crate anywhere in a graph switching it
# on put the framing into every other crate's build of the transport. The
# same argument put the QUIC TLS seam behind a feature rather than in
# every `hclient-tls` build.
# A build that wants WebSocket names this crate; one that does not cannot
# be given it by a neighbour.

# See the root Cargo.toml: `default` is near-empty here by design.
[package.metadata.docs.rs]
all-features = true

[dependencies]
bytes        = { workspace = true }
futures-core = { workspace = true }
futures-sink = { workspace = true }
http         = { workspace = true }
hclient-core = { workspace = true }
hclient-dns  = { path = "../hclient-dns",    version = "0.1.0-alpha.2" }
hclient-native = { path = "../hclient-native", version = "0.1.0-alpha.2" }
hclient-rt   = { path = "../hclient-rt",     version = "0.1.0-alpha.2" }
hclient-tls  = { path = "../hclient-tls",    version = "0.1.0-alpha.2" }
# For `hyper::rt::{Read, Write, ReadBuf}` and nothing else — no client, no
# http1, no server: `default-features = false` with no features added, the
# same dependency and the same reason `hclient-rt` has one. This
# workspace's `TcpConnect::Stream` is bounded by those two traits, so a
# framing layer over "whatever the runtime connected with" has to name
# them. The h1 upgrade itself — `poll_without_shutdown`, `into_parts` —
# stays in `hclient-native`, which is the half that genuinely needs
# hyper's client.
hyper        = { version = "1.11", default-features = false }
thiserror    = { workspace = true }
# `handshake` on top of `default-features = false`, and it is the only
# default feature taken back: it carries `generate_key` and
# `derive_accept_key`, which are RFC 6455 §4.1 and not optional for a
# client. It is also where `sha1` and `data-encoding` come from
# (tungstenite's own `handshake = ["data-encoding", "http", "httparse",
# "sha1"]`); `http` and `httparse` are already here through `hyper`.
# Everything else tungstenite's default would bring — its own TLS
# connectors, its blocking `connect()` — is glue this workspace has better
# versions of, which is the whole argument for driving it ourselves.
tungstenite  = { version = "0.30", default-features = false, features = ["handshake"] }

[dev-dependencies]
static_assertions = { workspace = true }
# For the module doc's example alone, and it is the reason the borrow
# exists: `Tungstenite` borrows a `Native` a `Client` already owns, so the
# example that shows why cannot be written without naming `Client`. The
# same dev-dependency `hclient-native` carries for the same reason. No cycle —
# `hclient` does not depend on this crate, and cannot: the framing is a
# choice a caller makes.
hclient            = { workspace = true }
futures-executor   = { version = "0.3", default-features = false, features = ["std"] }
# `sink` on top of the library's own feature set: `SinkExt::send`/`close`
# live there, and `tests/websocket.rs` drives the seam the way a caller
# would. Dev-only, so the shipped graph is unchanged.
futures-util       = { version = "0.3", default-features = false, features = ["std", "sink"] }
http-body-util     = { workspace = true }
hclient-dns-system = { path = "../hclient-dns-system", version = "0.1.0-alpha.2" }
hclient-rt-tokio   = { path = "../hclient-rt-tokio",   version = "0.1.0-alpha.2" }
hclient-tls-rustls = { path = "../hclient-tls-rustls", version = "0.1.0-alpha.2", features = ["webpki-roots"] }
tokio              = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
# One test needs a socket whose receive buffer is small enough that a
# message cannot fit in it — see `serve_with_bounded_recv_buffer`. `std`
# exposes no `SO_RCVBUF` setter, and this is a dev-dependency only.
socket2            = { version = "0.6", features = ["all"] }

[lints]
workspace = true

# The Autobahn TestSuite driver. It moved here with the framing it drives:
# the 517 external cases are about frames, masking and close codes, which
# is this crate's subject, and it needs a connector only to reach them.
[[example]]
name = "autobahn"
