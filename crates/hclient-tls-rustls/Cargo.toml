[package]
name = "hclient-tls-rustls"
version = "0.1.0-alpha.13"
description = "hclient's rustls TLS backend, over `futures-io` plus this workspace's half-close"
keywords     = ["hclient", "tls", "rustls"]
categories   = ["cryptography"]
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

# See the root Cargo.toml: `default` is near-empty here by design.
[package.metadata.docs.rs]
all-features = true

[features]
# Certificate verification, switchable off — `Rustls::danger_accept_invalid_certs`.
#
# **A feature rather than always-present, and the argument is not the
# floor one.** Cargo unifies features, so this being on somewhere makes
# the constructor *available* everywhere in that graph — but a constructor
# is not a behaviour: nothing calls it by accident, and a build that never
# names it is unchanged. What the feature buys is the other direction:
# a deployment that must be able to say "this binary contains no path that
# skips verification" can say it, and `cargo tree -e features` is the
# evidence. That is worth a flag; being hard to reach by accident is not.
dangerous-insecure = []
default = []
platform-verifier = ["dep:rustls-platform-verifier"]
# HTTP/3's TLS, behind a feature and off by default: it pulls
# `quinn-proto` (and the QUIC key-schedule machinery inside rustls), which
# a build that only ever speaks TLS over TCP has no use for. Same shape as
# every other optional dependency in this workspace.
quic              = ["dep:quinn-proto"]
webpki-roots      = ["dep:webpki-roots"]

[dependencies]
thiserror = { workspace = true }
hclient-core     = { workspace = true }
hclient-tls      = { path = "../hclient-tls", version = "0.1.0" }
futures-io       = { version = "0.3", default-features = false, features = ["std"] }
hclient-rt       = { path = "../hclient-rt", version = "0.1.0" }
# The 0.23 series is this crate's 0.1 series: `rustls` is re-exported, so
# its major is this crate's major. 0.24 means a breaking release here, and
# its API needs changes, not just a version bump. `.45` is the floor
# this has been built and tested against.
rustls           = { version = "0.23.45", default-features = false, features = ["std", "ring", "tls12"] }
rustls-pki-types = "1.15"
# `rustls-ring` and nothing else: this crate already picks `ring` for
# rustls itself, and the two must agree or the QUIC config would be built
# from a provider the TLS config does not use.
quinn-proto      = { version = "0.11", default-features = false, features = ["rustls-ring"], optional = true }
rustls-platform-verifier = { version = "0.7", optional = true }
webpki-roots     = { version = "1.0", optional = true }
# Unconditional, and cheap: with no subscriber installed every `trace!`
# is a load and a branch, and `tracing`'s own `max_level_*` features let
# a release build compile the level out entirely. Gating it behind a
# feature would buy nothing and cost the thing diagnostics exist for —
# being there when the defect is in front of you.
tracing          = { version = "0.1", default-features = false, features = ["std"] }

[dev-dependencies]
hclient-rt-smol  = { path = "../hclient-rt-smol", version = "0.1.0-alpha.13" }
hclient-rt-tokio = { path = "../hclient-rt-tokio", version = "0.1.0-alpha.13" }
futures-executor = { version = "0.3", default-features = false, features = ["std"] }
# `client` + `http1`: only this task (fix round 2) actually speaks HTTP
# over `TlsStream` — the claim "hyper decides framing, not this stream"
# can only be checked with a real hyper client, not a homegrown
# substitute. It is a dev-dependency and nothing else: the library is on
# `futures-io` plus this workspace's `Shutdown`, so hyper appears here
# only as the third-party client these tests are checked against.
hyper            = { version = "1.11", default-features = false, features = ["client", "http1"] }
http-body-util   = { workspace = true }
rcgen            = "0.14"
socket2          = { version = "0.6", features = ["all"] }
tokio            = { version = "1", features = ["macros", "rt-multi-thread", "net", "io-util"] }
tokio-rustls     = { version = "0.26", default-features = false, features = ["ring"] }

[lints]
workspace = true
