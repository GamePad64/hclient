[package]
name = "system-resolver"
# **Its own version, and the reason is that a shared one cannot leave
# pre-release.** Every crate here rides `[workspace.package].version`,
# which is `0.1.0-alpha.N` because six public surfaces moved in a week —
# and inside a pre-release every step is a major one, so `cargo
# semver-checks` skips all 254 of its lints and reports success. Measured:
# `0.1.0-alpha.2 -> 0.1.0-alpha.2` and `0.1.0-alpha.2 -> 0.1.0` both run
# **0 checks**; `0.1.0 -> 0.1.1` runs 196. So the guarantee this crate can
# offer is not bought by versioning separately — it is bought by leaving
# pre-release, and versioning separately is what makes that possible
# without promising the same of a family that is still moving.
#
# This crate is the one that can afford it: five public names, and a use
# outside HTTP entirely.
version = "0.1.0"
description = "Ask the operating system's own DNS resolver for any record type, not just A and AAAA. Linux, macOS, iOS, Android, FreeBSD, Windows."
keywords     = ["dns", "resolver", "getaddrinfo", "res_query", "svcb"]
categories   = ["network-programming", "os"]
edition.workspace = true
# **Its own floor, for the reason it carries its own version**: this crate
# left the shared version because it can promise things the family cannot,
# and the workspace's "MSRV is the latest stable" is the second promise it
# no longer belongs to. That policy buys the family no shim code and no
# compatibility matrix, and it costs a crate meant to be used from outside
# thirteen releases of reach.
#
# Measured rather than picked, and the number has moved twice. It was
# 1.85, edition 2024's floor; then 1.95, when `sys/mod.rs` traded `cfg-if`
# for `core::cfg_select!`; and now 1.96, where `std::assert_matches!`
# became stable. Both were checked in both directions rather than looked
# up: 1.94 rejects `cfg_select!` and 1.95 rejects `assert_matches!`, each
# as an unstable library feature. Every dependency's own floor is far
# below (`thiserror` 1.71, `windows-sys` 1.71, `windows-strings` 1.82).
#
# Two things about this number are worth knowing before it moves again.
#
# It is one release stricter than a consumer needs. `assert_matches!` is
# used only inside `#[cfg(test)]`, which cargo does not build for a
# dependency, so the crate itself still compiles on 1.95 for anyone
# depending on it. Declaring the higher number is the under-claiming
# direction, which is the rule this workspace applies everywhere, and it
# keeps `just msrv` able to run the tests rather than only check them.
#
# And the trade has now gone the wrong way twice on this crate's own
# argument, which is that it left the family's shared MSRV to keep reach.
# `cfg-if` and `assert_matches` are each one small crate with a low floor;
# dropping them buys two lines out of the lockfile and has cost eleven
# releases of compiler reach.
#
# `just msrv` is what keeps this from being a claim with nothing behind
# it, and the workspace's argument against an MSRV job does not reach
# here: that argument is that a pinned job restates a *moving* promise
# more staleley than the manifest does. This promise does not move, so the
# job is its only statement rather than a second one.
rust-version = "1.96.0"
license.workspace = true
repository.workspace = true
readme = "README.md"

# `default` is empty by design, as everywhere in this workspace — but this
# crate has no features at all, so docs.rs would build the whole surface
# regardless. The key is here for the same reason as its neighbours': a
# feature added later must not silently drop out of the rendered docs.
[package.metadata.docs.rs]
all-features = true

# The other half of the literal version above: `cargo-release` groups
# crates by this name, so this one bumps and publishes on its own cadence
# while everything named `hclient` moves together. Both lines are needed —
# a literal version with no group would still be dragged to the family's
# number on the next `cargo release`.
[package.metadata.release]
shared-version = "system-resolver"

[dependencies]
thiserror = { workspace = true }

# Windows only. `DnsQuery_UTF8` and the `DNS_RECORD` list it fills in,
# plus the `DnsQueryRaw` request and result *types* — the functions
# themselves are deliberately never named as linked symbols, because
# `windows-sys` emits them as `raw-dylib` imports and the loader resolves
# imports at process start, so naming one stops the binary from running on
# Windows 10. `Win32_System_LibraryLoader` is how they are reached instead.
# `Win32_Foundation` is for the status codes the query returns; nothing
# here uses a handle.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_NetworkManagement_Dns",
    "Win32_System_LibraryLoader",
] }
# The strings on both sides of the boundary: the wide query name
# `DnsQueryRaw` takes, and the narrow names `DnsQuery_UTF8` fills in. One
# crate, depending on `windows-link` alone, and the reason is a defect
# class rather than tidiness — see `sys/windows/raw.rs` on where the
# terminating null lives.
windows-strings = { version = "0.5", default-features = false }

[dev-dependencies]
const-hex      = { workspace = true }
rstest         = { workspace = true }

# NOT `[lints] workspace = true`, for `hclient-dns-system`'s reason (spec
# amendment C8): the workspace table sets `unsafe_code = "forbid"`, and
# `forbid` cannot be relaxed from inside a crate (`E0453`). Every foreign
# function this workspace calls for DNS now lives here, so this crate needs
# `deny` — overridable by a scoped `#[allow]` with a marker on each site.
#
# `missing_debug_implementations` and `unexpected_cfgs` are restated
# because opting out of the workspace table drops them along with
# `unsafe_code`, and losing them silently is exactly the drift this
# project spends review effort on elsewhere.
[lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"
unexpected_cfgs = { level = "warn", check-cfg = [] }
