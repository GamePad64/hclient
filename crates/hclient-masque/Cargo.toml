[package]
name = "hclient-masque"
version = "0.0.0"
description = "An unpublished experiment: MASQUE (RFC 9298 CONNECT-UDP, and CONNECT over h2/h3) as an hclient egress filter, proving the proxy seams"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
hclient-proxy = { path = "../hclient-proxy", version = "0.1.0" }
hclient-core  = { workspace = true }
hclient-rt    = { path = "../hclient-rt", version = "0.1.2" }
bytes         = { workspace = true }
http          = { workspace = true }
thiserror     = { workspace = true }
futures-io    = { version = "0.3", default-features = false, features = ["std"] }

[dev-dependencies]
# The end-to-end tests drive a real `hclient::Client` over a real `Native`
# through MASQUE proxies and origins that are real servers on loopback.
# Path only for the crates of this workspace, like every other
# dev-dependency here: this crate is never packaged, so nothing needs a
# version to resolve from the registry.
hclient            = { path = "../hclient" }
hclient-proxy      = { path = "../hclient-proxy", features = ["test-util"] }
hclient-native     = { path = "../hclient-native", features = ["http2", "http3"] }
hclient-rt-tokio   = { path = "../hclient-rt-tokio" }
hclient-tls-rustls = { path = "../hclient-tls-rustls", features = ["quic"] }
hclient-dns-system = { path = "../hclient-dns-system" }
tokio              = { version = "1", features = ["io-util", "macros", "rt-multi-thread", "net", "sync", "time"] }
quinn              = { version = "0.11", default-features = false, features = ["futures-io", "runtime-tokio", "rustls-ring"] }
h3                 = "0.0.8"
h3-quinn           = "0.0.10"
h2                 = "0.4"
tokio-rustls       = { version = "0.26", default-features = false, features = ["ring"] }
rustls             = { version = "0.23.45", default-features = false, features = ["ring", "std"] }
rcgen              = "0.14"

[lints]
workspace = true
