[package]
name = "hclient-wasi"
version.workspace = true
description = "hclient transport over wasi:http 0.3"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

# See the root Cargo.toml: `default` is near-empty here by design.
[package.metadata.docs.rs]
all-features = true

[dependencies]
bytes        = { workspace = true }
# Needed for `futures::future::select` in `convert::race_send_with_body`:
# writing the body to `BodyWriter` races against `client::send`, so an
# early host rejection doesn't wait for the write to finish (finding B-5).
#
# An earlier version of this comment talked about `join!` and called what
# was happening "honest `full_duplex`" — wrong on both counts (M1 of the
# branch's final review): `join!` was replaced with `select` back in the
# Task 16 fix round and survived only in the prose, and `WasiHttp::new()`
# three files down declares `full_duplex = false` and explains at length
# why. Racing the write is not duplex: `execute` still doesn't return
# until the write finishes.
#
# `async-await` only — `default-features = false` without `std`/`executor`:
# this crate doesn't need its own executor, `wasip3` calls are already
# driven by the host runtime.
futures      = { version = "0.3", default-features = false, features = ["async-await"] }
http         = { workspace = true }
http-body    = { workspace = true }
hclient-core = { workspace = true }
# `http-compat`: gives us `IncomingBody`/`IncomingResponseBody` and
# `wasi:http` types (`ErrorCode` etc.) instead of raw WIT bindings. We don't
# disable the default features (`std`, `bitflags`): this crate only ever
# targets `wasm32-wasip2`, a `no_std` build isn't a scenario here.
wasip3       = { version = "0.7.0", features = ["http-compat"] }
# Not a new crate in the wasm32-wasip2 graph: both `hclient-core` and
# `wasip3` (its own `http_compat::Error` is a `thiserror` derive) already
# pull it in — checked with
# `cargo tree -p hclient-wasi -e normal --target wasm32-wasip2 -i thiserror`,
# which lists all three as dependents. This line makes an existing edge
# direct, it does not add one.
thiserror    = { workspace = true }

# Guest for the `tests/live_roundtrip.rs` integration run (Task 16) — see
# the doc comment in the file itself for why this is a `cdylib` example via
# `wasip3::cli::command::export!` rather than an ordinary `fn main()`.
[[example]]
name = "live_roundtrip_guest"
path = "examples/live_roundtrip_guest.rs"
crate-type = ["cdylib"]

# End-to-end example (Task 17): the same `wasip3::cli::command::export!`
# shape as `live_roundtrip_guest` above and for the same reason — see the
# doc comment in `examples/fetch.rs` for why not `fn main()`.
[[example]]
name = "fetch"
path = "examples/fetch.rs"
crate-type = ["cdylib"]

[dev-dependencies]
# Only for `tests/live_roundtrip.rs`: parses
# `cargo build --message-format=json` to get the built guest's real path
# from cargo instead of guessing it from a relative path (that guess is
# wrong under a non-standard `CARGO_TARGET_DIR`). A dev-dependency doesn't
# enter the published crate's dependency graph.
serde_json = "1"
# Only for `examples/fetch.rs`: the end-to-end example builds application
# code through a user-facing `hclient::Client`, rather than directly through
# `Transport::execute` (as `live_roundtrip_guest` does) — that's exactly the
# code verticals 2 and 3 reuse unchanged. No cycle back: `hclient` doesn't
# depend on `hclient-wasi`, and a dev-dependency doesn't enter the library
# build graph's cycle anyway.
hclient = { workspace = true }

[lints]
workspace = true
