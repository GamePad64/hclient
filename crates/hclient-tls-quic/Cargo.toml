[package]
name = "hclient-tls-quic"
version.workspace = true
description = "The TLS seam for QUIC: key schedules rather than a wrapped byte stream"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

# `quinn-proto` with `default-features = false`: this crate names its
# `crypto::ClientConfig` trait object and nothing else, and in particular
# picks no crypto provider — that is the implementing backend's decision,
# and `hclient-tls-rustls` makes it behind its own `quic` feature.
# See the root Cargo.toml: `default` is near-empty here by design.
[package.metadata.docs.rs]
all-features = true

[dependencies]
hclient-core = { workspace = true }
hclient-tls  = { path = "../hclient-tls", version = "0.1.0" }
quinn-proto  = { version = "0.11", default-features = false }

[lints]
workspace = true
