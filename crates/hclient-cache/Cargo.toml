[package]
name = "hclient-cache"
version.workspace = true
description = "A sans-io HTTP response cache for hclient: RFC 9111 freshness, validation and Vary, with no clock and no I/O"
keywords     = ["hclient", "http", "cache", "rfc9111"]
categories   = ["web-programming::http-client"]
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

# See the root Cargo.toml: `default` is near-empty here by design.
[package.metadata.docs.rs]
all-features = true

[dependencies]
# The stored body. Already in `hclient`'s graph and in every transport's, so
# a cache costs no crate for it; `Bytes::clone` is a refcount, which is what
# makes handing a stored body to a caller cheap enough that the store can
# hand out owned copies instead of lending them under a lock.
bytes = { workspace = true }
# **winnow parses the grammar, chrono answers the calendar**, and the split
# is the point rather than a convenience. The two date parsers in this
# workspace read *different* grammars — `HTTP-date`'s three fixed forms
# here, RFC 6265 §5.1.1's position-free algorithm in `hclient-cookie` — so
# nothing about the scanning was ever shared. What *was* duplicated, byte
# for byte, is the civil-date arithmetic, and that is chrono's half.
#
# jiff is `default-features = false` in the workspace manifest, which keeps
# `tz-system` and its platform timezone lookup out; that is what lets a
# deliberately clockless crate depend on a date library at all. Note it is
# **not** asked to parse: its `strtime` validates a weekday against its
# date, which RFC 9110 §5.6.7 does not require and this parser must not do
# (see `day_name`), and a literal space there matches any run of
# whitespace including none.
jiff = { workspace = true }
http = { workspace = true }
thiserror = { workspace = true }
winnow = { workspace = true }

[dev-dependencies]
rstest = { workspace = true }
assert_matches = { workspace = true }
# The oracle for `date.rs`, dev-only and for the reason `hclient-cookie`
# keeps its own date oracles there: `HTTP-date` has three accepted forms,
# and a hand-written parser that quietly accepted a fourth — or refused one
# of the three — would be invisible in every test that only ever feeds it
# `IMF-fixdate`. `tests/dates.rs` runs both over one corpus.
httpdate = "1.0"

[lints]
workspace = true
