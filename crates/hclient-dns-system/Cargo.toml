[package]
name = "hclient-dns-system"
version = "0.1.0-alpha.14"
description = "System resolver (getaddrinfo + res_query) for hclient via the Blocking capability"
keywords     = ["hclient", "dns", "resolver", "getaddrinfo"]
categories   = ["network-programming"]
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

# See the root Cargo.toml: `default` is near-empty here by design.
[package.metadata.docs.rs]
all-features = true

[dependencies]
# **No `bytes` here any more.** It was a direct dependency for one call —
# `Bytes::copy_from_slice`, handing the synthetic message to a decoder that
# took an owned buffer. `domain` parses from a borrowed slice, so the
# allocation and the dependency both went with the envelope.
# The RDATA decoder, and the reason it is this one is that it decodes
# **RDATA** — `Https::parse` takes a parser over one record's octets, where
# `dns-message-parser` exposes decoding at the message level only. That
# difference is worth 90 lines here: this crate used to build a synthetic
# DNS response around every record it wanted read, because
# `system-resolver` hands over the only shape all five platforms have and
# the decoder wanted the shape none of them has.
#
# `default-features = false` deliberately: `std` costs `hashbrown` and
# `foldhash` for a map nothing on this path builds, and `rand` is for a
# query id this crate never mints. Nothing here needs either.
#
# The cost was measured against the alternative rather than argued.
# `hickory-proto` 0.26 also decodes RDATA directly and depends on `url`
# **unconditionally** — for `caa.rs` and one error variant, a record type
# nothing here asks about — so it arrives with `idna` and the zerovec
# family: 28 crates to 68 here, and `hclient` with `default-transport` on
# Windows 69 to 105, putting back the Unicode machinery `hclient-idn`
# exists to keep off that platform. `domain` costs three crates, brings no
# `url` and no ICU, and is `no_std`-capable.
domain = { version = "0.12", default-features = false }
futures-core = { workspace = true }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
hclient-core = { workspace = true }
# **With no features, and there are none left to ask for.** This crate
# stopped asking for `codec` when it moved to RDATA-level decoding and
# began building its own `RawBinding`; `hclient-dns-doh` then took the one
# function that feature gated — `binding_from_decoded`, whose signature
# named `domain` in four places that `hclient-dns` re-exported nowhere —
# and the feature went with it. What stays shared is the half that names
# no decoder: `RawBinding`, `RawParam` and RFC 9460's §2.4/§2.5/§8 client
# rules over them, which is the whole of what this dependency is for.
#
# The consequence for this crate is that its own `raw_param` and the copy
# in `hclient-dns-doh`'s `wire.rs` are the two places one decoded
# `SvcParam` becomes a `RawParam`. Both are over the same `domain` type
# and neither can move into `hclient-dns` without putting this crate back
# on a feature it deliberately stopped asking for and re-leaking `domain`
# through the seam; that is the owner's call and it is recorded at both
# sites rather than acted on here.
hclient-dns  = { path = "../hclient-dns", version = "0.1.1" }
hclient-rt   = { path = "../hclient-rt", version = "0.1.0" }
# Every platform call this crate used to make. It owns `res_query`,
# `android_res_nquery`, `DnsQueryRaw` and `DnsQuery_UTF8`, and hands back
# records with their RDATA; what is left here is RFC 9460's client rules
# over one of those records. Not optional and not target-gated: it compiles
# on every target and answers `Support::None` where it has no backend,
# which is what keeps `supports_svcb` a single statement rather than a
# second copy of a `#[cfg]` list.
system-resolver = { path = "../system-resolver", version = "0.2.4" }
thiserror      = { workspace = true }
# Unconditional, for the reason `hclient-tls-rustls` states: with no
# subscriber installed a `trace!` is a load and a branch, and a feature
# would guard a cost that is not there. What it buys here is the one thing
# a platform resolver cannot otherwise be asked — which name and type went
# to `getaddrinfo` or `DnsQueryRaw`, and what came back — since the call
# itself is somebody else's and leaves no trace of its own.
#
# Measured, 29 -> 32: `tracing`, `tracing-core` and `once_cell`. No `url`
# and no ICU, which is the property this crate's decoder choice exists to
# keep.
tracing        = { version = "0.1", default-features = false, features = ["std"] }

[dev-dependencies]
const-hex      = { workspace = true }
futures-executor = { version = "0.3", default-features = false, features = ["std"] }
rstest           = { workspace = true }

[lints]
workspace = true
