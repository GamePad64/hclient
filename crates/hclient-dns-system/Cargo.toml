[package]
name = "hclient-dns-system"
version.workspace = true
description = "System resolver (getaddrinfo + res_query) for hclient via the Blocking capability"
keywords     = ["hclient", "dns", "resolver", "getaddrinfo"]
categories   = ["network-programming"]
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

# See the root Cargo.toml: `default` is near-empty here by design.
[package.metadata.docs.rs]
all-features = true

[dependencies]
bytes        = { workspace = true }
# The DNS wire decoder. Chosen over hand-rolled parsing after reading its
# source: no `unsafe` anywhere in its `src`, `DecodeResult` on every path
# rather than panics, and name decompression that terminates by tracking
# visited offsets in a `HashSet` instead of trusting a "pointers must point
# backwards" rule. It moves the riskiest code in this crate — bounds checks
# over attacker-chosen bytes — out of this repository entirely.
dns-message-parser = "0.9"
futures-core = { workspace = true }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
hclient-core = { workspace = true }
# `codec`: the `ServiceBinding` -> `RawBinding` conversion and the RFC 9460
# client semantics over it, which used to live in this crate's `svcb.rs` and
# moved when `hclient-dns-doh` became a third backend applying the same
# rules. The feature is what keeps the decoder out of a build that only
# wants `Resolve` — see that crate's `[features]` table.
hclient-dns  = { path = "../hclient-dns", version = "0.1.0-alpha.2", features = ["codec"] }
hclient-rt   = { path = "../hclient-rt",  version = "0.1.0-alpha.2" }
# Every platform call this crate used to make. It owns `res_query`,
# `android_res_nquery`, `DnsQueryRaw` and `DnsQuery_UTF8`, and hands back
# records with their RDATA; what is left here is RFC 9460's client rules
# over one of those records. Not optional and not target-gated: it compiles
# on every target and answers `Support::None` where it has no backend,
# which is what keeps `supports_svcb` a single statement rather than a
# second copy of a `#[cfg]` list.
system-resolver = { path = "../system-resolver", version = "0.1.0-alpha.2" }
thiserror      = { workspace = true }

[dev-dependencies]
assert_matches   = { workspace = true }
futures-executor = { version = "0.3", default-features = false, features = ["std"] }
rstest           = { workspace = true }

[lints]
workspace = true
