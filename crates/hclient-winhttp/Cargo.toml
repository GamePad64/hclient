[package]
name         = "hclient-winhttp"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true
description  = "Windows WinHTTP transport for hclient"
keywords     = ["hclient", "transport", "winhttp", "windows", "proxy"]
categories   = ["web-programming::http-client", "os::windows-apis"]

# See the root Cargo.toml: `default` is near-empty here by design.
[package.metadata.docs.rs]
all-features = true
default-target = "x86_64-pc-windows-msvc"

[dependencies]
hclient-core  = { workspace = true }
hclient-proto = { workspace = true }
http          = { workspace = true }
http-body     = { workspace = true }
bytes         = { workspace = true }
thiserror     = { workspace = true }
# The exchange's event queue. Ungated, unlike `windows-sys` below, because
# the type is named in `sys.rs`'s own structures rather than only in the
# calls — and `futures-core`/`futures-sink` are already in every graph here
# through `hclient-core`, which names both on the WebSocket seam, so the
# addition is `futures-channel` alone.
futures-channel = { version = "0.3", default-features = false, features = ["std"] }
futures-core    = { version = "0.3", default-features = false }
# The `Sink` half of the WebSocket seam, which `hclient-core` already
# names — so this costs no crate in any graph that has a client.
futures-sink    = { workspace = true }
# `Protocols` is WinHTTP's own bitmask, so it is written as one. Already
# in this workspace's lockfile at 2.13 through other trees; here it is one
# crate with no dependencies of its own, and what it buys is that adding a
# protocol later is a new constant rather than a new field — additive,
# where a `pub` field in a struct callers write as a literal is not.
bitflags        = { workspace = true }

# `windows-sys` and nothing else, target-gated so a Linux or wasm build of
# the workspace resolves none of it — `hclient-dns-system` and
# `hclient-idn` already depend on this exact version, so a Windows build of
# the workspace gains no crate by adding this one.
#
# Raw FFI rather than the safe `windows` crate, for the reason
# `hclient-idn` gives about the same choice: `windows-sys` emits a
# `raw-dylib` import through `windows-link`, so there is no build script
# and no import library to find. The safe wrappers this crate would want
# from `windows` do not exist for WinHTTP anyway — its async model is a
# status callback and a `dwContext`, which no binding generator makes
# safe.
[target.'cfg(windows)'.dependencies]
# The wide strings every WinHTTP call takes. `HSTRING` owns its buffer and
# **reserves the terminating null inside the allocation**, so `as_ptr()`
# is an `LPCWSTR` by construction rather than by this crate remembering to
# chain a zero — which is what it did, in a two-line helper that nothing
# would have caught losing.
#
# One crate: `windows-strings` depends on `windows-link` alone, which is
# already here under `windows-sys`.
windows-strings = { version = "0.5", default-features = false }

windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Networking_WinHttp",
] }

# The tests here assert the shape of the seam rather than a round trip —
# see `tests/shape.rs` — so they need the traits and nothing to drive a
# future with.
[dev-dependencies]
static_assertions = { workspace = true }
hclient-core = { workspace = true }
bytes = { workspace = true }
http-body = { workspace = true }

# NOT `[lints] workspace = true`, for the reason `hclient-urlsession`'s
# manifest gives: the workspace sets `unsafe_code = "forbid"`, and `forbid`
# cannot be relaxed from inside a crate (E0453). This crate is an **FFI
# boundary** — every `unsafe` in `src/sys.rs` is a WinHTTP call with the
# signature `windows-sys` declares, or an obligation WinHTTP's async
# contract states. The compiler lint is not the control here;
# `scripts/unsafe-code-policy.sh` is, and it is stricter: a marker on every
# such line, naming the amendment, in a file listed by name. Amendment C18.
#
# Opting out of the workspace table also drops
# `missing_debug_implementations` and `unexpected_cfgs`, restated below
# rather than lost silently.
[lints.rust]
unsafe_code                   = "allow"
missing_debug_implementations = "warn"
unexpected_cfgs               = { level = "warn", check-cfg = [] }
