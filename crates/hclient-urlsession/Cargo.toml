[package]
name         = "hclient-urlsession"
version.workspace = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true
description  = "Apple `URLSession` transport for hclient"
keywords     = ["hclient", "transport", "urlsession", "macos", "ios"]
categories   = ["web-programming::http-client", "os::macos-apis"]

# See the root Cargo.toml: `default` is near-empty here by design.
[package.metadata.docs.rs]
all-features = true

[dependencies]
hclient-core = { workspace = true }
http         = { workspace = true }
http-body    = { workspace = true }
bytes        = { workspace = true }
thiserror    = { workspace = true }

# Everything Objective-C is target-gated, so a Linux or wasm build of the
# workspace resolves none of it. The crate's own `lib.rs` is gated the same
# way and compiles to nothing there — `cargo check --workspace` on a Linux
# host stays honest rather than silently skipping a member.
[target.'cfg(target_vendor = "apple")'.dependencies]
# `futures-channel` for the delegate's queue, `futures-core` for the
# `Stream` it is polled through. Target-gated with the rest because a
# Linux build of this crate compiles to nothing and should resolve
# nothing — measured: `cargo tree -p hclient-urlsession -e normal` on this
# host is unchanged by these two lines.
futures-channel = { version = "0.3", default-features = false, features = ["std"] }
futures-core    = { version = "0.3", default-features = false }
objc2 = "0.6"
block2 = "0.6"

# For **one bool**: `Capabilities::proxy`. `URLSession` applies the
# machine's proxy configuration itself, so this transport has to be able
# to say whether one is in force — and the only alternative to reading it
# here was a second reader of the same dynamic-store dictionary, which is
# the *two statements of one contract and the newer one rots* shape this
# workspace refuses elsewhere. Not optional and not behind a feature: a
# capability that is honest only when a flag is set is a capability that
# lies in the default build, which is the defect being closed.
#
# Measured on `aarch64-apple-darwin`, `cargo tree -e normal`, unique
# crates: **19 -> 30**. Four of the eleven are the platform bindings that
# do the reading (`core-foundation`, `core-foundation-sys`,
# `system-configuration`, `system-configuration-sys`); the rest are that
# crate's own sans-io HTTP-proxy half, which this never calls. No `url`
# and no ICU tables on either side, which is what `just graph-proxy-cost`
# asserts.
hclient-proxy = { path = "../hclient-proxy", version = "0.1.0-alpha.2", features = ["system"] }

[target.'cfg(target_vendor = "apple")'.dependencies.objc2-foundation]
version = "0.3"
default-features = false
features = [
  "std",
  "NSURLSession",
  "NSURL",
  "NSURLRequest",
  "NSURLResponse",
  "NSURLError",
  "NSData",
  "NSError",
  "NSString",
  "NSDictionary",
  "NSHTTPCookieStorage",
  "NSURLCache",
  "NSOperation",
  "NSHTTPCookie",
  "NSArray",
  "NSObject",
  "NSValue",
  "block2",
]

[dev-dependencies]
futures-executor = "0.3"
http-body-util = { workspace = true }
# For the `Client`-level test: this backend refuses the OS's cookies,
# cache and redirects precisely so `hclient`'s own are the ones in force,
# and that claim is only testable through `Client`.
hclient = { workspace = true }

# NOT `[lints] workspace = true`, for the reason `hclient-fetch`'s manifest
# gives at length: the workspace sets `unsafe_code = "forbid"`, and `forbid`
# cannot be relaxed from inside a crate (E0453). Unlike that crate, which
# carries one `unsafe impl`, this one is an **FFI boundary** — every
# `unsafe` here is an Objective-C message send with the signature
# `objc2-foundation` declares, or an obligation `define_class!` states. So
# the compiler lint is not the control here; `scripts/unsafe-code-policy.sh`
# is, and it is stricter: it requires a marker on EVERY such line, naming
# the amendment that excuses it, in a file listed by name. Amendment C11.
[lints.rust]
unsafe_code = "allow"
