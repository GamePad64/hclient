[package]
name = "hclient-rt-tokio"
version = "0.1.0-alpha.14"
description = "hclient runtime capabilities implemented on top of tokio"
keywords     = ["hclient", "runtime", "tokio", "async"]
categories   = ["asynchronous", "network-programming"]
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

# UDP is unconditional. The GSO/GRO/ECN work is `cmsg` on a descriptor,
# and `quinn-udp` already does it correctly for six platforms, so it is a
# dependency rather than a second copy of the hardest part of a UDP stack.
#
# It was behind a `udp` feature, off by default, and the feature went on a
# measurement: it held exactly one crate, `quinn-udp` (plus `libc` on
# Windows); everything else it needs was already in the graph. None of its
# types reach this crate's API: `hclient_rt::EcnCodepoint` is what crosses
# the seam, so its version is not part of this crate's promise either. What
# the feature cost was a line every consumer had to remember, and
# `hclient-native` once failed to build on its own for want of it. The UDP
# seam itself, `hclient_rt::UdpBind`, was never behind a feature.
# See the root Cargo.toml: `default` is near-empty here by design.
[package.metadata.docs.rs]
all-features = true

[dependencies]
futures-core = { workspace = true }
hclient-rt = { path = "../hclient-rt", version = "0.1.1" }
quinn-udp  = { version = "0.6", default-features = false }
futures-io = { version = "0.3", default-features = false, features = ["std"] }
socket2    = { version = "0.6", features = ["all"] }
tokio      = { version = "1", features = ["net", "rt", "time", "sync"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
# `TokioHandle`'s tests drive tokio futures on an executor that is not
# tokio: the claim is that a `Sleep` built through a carried handle is
# afterwards pollable by anyone, and `#[tokio::test]` cannot check that
# because it is itself the runtime.
futures-executor = "0.3"

[lints]
workspace = true
