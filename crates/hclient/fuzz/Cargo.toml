[package]
name = "hclient-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
# `hclient` for the SSE decoder, reached through its hidden `testing`
# door; `hclient-proto` for the Happy Eyeballs scheduler. The crate lived
# under `hclient-proto` until the SSE decoder moved into `hclient`.
hclient = { path = "..", default-features = false }
hclient-proto = { path = "../../hclient-proto" }

[[bin]]
name = "sse"
path = "fuzz_targets/sse.rs"
test = false
doc  = false
bench = false

[[bin]]
name = "sse_accounting"
path = "fuzz_targets/sse_accounting.rs"
test = false
doc  = false
bench = false

[[bin]]
name = "happy_eyeballs"
path = "fuzz_targets/happy_eyeballs.rs"
test = false
doc  = false
bench = false

[workspace]
