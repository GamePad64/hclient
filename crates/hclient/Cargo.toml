[package]
name = "hclient"
version.workspace = true
description = "Cross-platform async HTTP client: one codebase for native, browser, and WASI"
keywords     = ["hclient", "http", "http-client", "async", "wasm"]
categories   = ["web-programming::http-client", "asynchronous", "wasm"]
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

# See the root Cargo.toml: `default` is near-empty here by design.
[package.metadata.docs.rs]
all-features = true

[features]
# **`default-transport` was in this list for one commit, and the reason it
# is not is the rule this workspace applies everywhere else.** Cargo
# unifies features across a graph, so a default here is not a default — it
# is a *floor*. Measured on a scratch workspace rather than argued: with
# `lean` depending on `hclient` with `default-features = false` and `fat`
# depending on it with defaults, cargo builds **one** `hclient`, with
# `default,default-transport,idn`, and `lean` links that one. The party who
# wanted the small graph is not the party who decides.
#
# That is the same argument that keeps the WebSocket framing in a crate of
# its own. Applying it there and not to this list would have been the
# inconsistency, not the caution.
#
# What it costs is real and is paid in text instead: `Client::new()` needs
# `features = ["default-transport"]`, and the first line of both READMEs and
# of this crate's docs says so. A flag someone reads before compiling is
# cheaper than a graph they cannot get out of afterwards.
#
# The audience this protects is narrower than "every constrained build" —
# `hclient-native/examples/minimal.rs` shows that a 512 KB target uses
# `Transport` directly and never names this crate. It is the caller who
# wants `Client` over a transport of their own choosing: `Native<Smol,
# NativeTls, Hickory>` should not carry tokio, rustls and the system
# resolver because something else in the graph was careless.
default = ["idn", "public-suffix"]
# Internationalised domain names, forwarded to `hclient-proto`, where the
# conversion lives (`uri::parse`) so that every backend gets the same
# behaviour without going through this facade. ON by default: it is what
# the client did before the `url` dependency was removed, and turning it
# off is what removes `idna` + the ICU data crates from the build
# entirely. With it off, `client.get("https://münchen.de/x")` is a typed
# `UriError::NonAsciiHost` telling the caller to pass
# `https://xn--mnchen-3ya.de/x` instead — not `http`'s bare "invalid uri
# character".
idn = ["hclient-proto/idn"]
# Mock transport for consumer tests. Re-exports `hclient-mock`, which
# depends on `hclient-core` alone — a transport author should take that
# crate directly rather than pulling this facade in to reach it.
test-util = ["dep:hclient-mock"]
# `DefaultTransport`/`Client<T = DefaultTransport>`/`Client::new()` — see the
# `DefaultTransport` doc comment in `src/lib.rs` for what actually resolves
# per target and why this is a `dep:` list below rather than the crate names
# themselves: it hides the implicit features cargo would otherwise create for
# each optional target-dependency, leaving exactly one feature switch.
# Every entry is a TARGET-specific optional dependency, and listing all of
# them here unconditionally is correct, not sloppy: a `dep:` that names an
# optional dependency declared only under a `[target.'cfg(...)']` table is a
# no-op on any target that table doesn't match. That is what keeps this a
# single feature switch instead of one per platform — the four native crates
# are already relied on to behave this way when building for wasm, and
# `hclient-fetch` is the same arrangement pointing the other way.
default-transport = [
    "dep:hclient-native",
    "dep:hclient-rt-tokio",
    "dep:hclient-tls-rustls",
    "dep:hclient-dns-system",
    "dep:hclient-fetch",
]
# HTTP/2 and HTTP/3 for `Client::new()`, and the pair is deliberately two
# features per protocol rather than one.
#
# `http2`/`http3` COMPILE the protocol in; `default-http2`/`default-http3`
# additionally make it the default of the transport `Client::new()` builds,
# and imply the first. Without the split, a caller who wants the code
# present but the protocol off at runtime has no way to say so, and one who
# writes `http3(true)` in a build that never compiled it gets a refusal for
# a reason that is not in their manifest.
#
# Cargo unifies features, so `default-http3` switched on anywhere in a
# graph makes `Client::new()` speak HTTP/3 for everyone in it. That is a
# BEHAVIOURAL floor, not a broken build — the four crates it adds all
# compile for every target this list is reachable from — and it is the same
# trade `default-transport` itself makes. What it costs a neighbour is
# `quinn` on disk and a QUIC connect to origins whose HTTPS record
# advertises `h3`; what it costs on a network that blocks UDP/443 is
# bounded by `H3Failures` at one attempt per origin per TTL, and by
# `Timeouts::connect` if the caller sets one.
http2 = ["default-transport", "hclient-native/http2"]
http3 = [
    "default-transport",
    "hclient-native/http3",
    "hclient-rt-tokio/udp",
    "hclient-tls-rustls/quic",
]
default-http2 = ["http2"]
default-http3 = ["http3"]
# `Collected::json`. Off by default: measured on a real wasm32-unknown-unknown
# build (opt-level=z, lto=true, strip=true) — 74 bytes when `.json()` is never
# called (LTO strips the method entirely), 46,877 bytes and +5 crates in the
# graph (41 → 46) the moment it's called even once. For a crate whose target
# platforms include the browser, and whose own examples — SSE and byte
# scenarios — never touch this method, that's a real cost no consumer should
# pay by default. CI's `test` job already runs `--all-features`, so the path
# stays under test, just not in the default build. Same trick reqwest uses,
# for the same reason.
json = ["dep:serde", "dep:serde_json"]
# `Collected::text_with_charset`, and NOT a change to `Collected::text`.
# Off by default on the `json` precedent above, and the weight is the
# argument: `encoding_rs` is a megabyte and more of conversion tables for
# every legacy encoding the WHATWG Encoding Standard names, which a build
# that only ever meets UTF-8 — the overwhelming majority — has no use for.
#
# **What this feature must never do is change what `text()` means.** Cargo
# unifies features across a graph, so a library calling `text()` would get
# a different answer depending on what some unrelated crate switched on,
# and the difference is silent: `windows-1251` bytes come back as text
# instead of as an error. That is the same hazard `Capabilities`' floor
# rule exists for. So the charset-aware path is a SEPARATE METHOD, and a
# caller who wants it says so at the call site rather than in a manifest.
charset = ["dep:encoding_rs", "dep:winnow"]
# `RequestBuilder::digest_auth` — RFC 7616 Digest Access Authentication.
# OFF by default, on the same measurement as `zstd` above and for a bigger
# number: MD5 and SHA-2 cost **nine** crates (`md-5`, `sha2`, `digest`,
# `block-buffer`, `crypto-common`, `hybrid-array`, `typenum`, `cfg-if`,
# `cpufeatures` — measured, not estimated), which a caller who never meets
# a `401 Digest` should not link.
#
# Taken rather than hand-written, which is a departure from the rule that
# removed `url` and hand-wrote base64 — and the line between them is
# whether a wrong answer is *visible*. Base64 is twenty lines and a wrong
# one fails immediately and everywhere. A hash is two hundred lines whose
# defects are silent and whose test vectors nobody re-derives; RustCrypto's
# are audited, `no_std`, build-script-free and build for both wasm targets,
# which is the same shortlist `ruzstd` was chosen from.
digest-auth = ["dep:md-5", "dep:sha2", "dep:winnow"]
# Response decompression, per coding — v0.2 W5. OFF by default, on the
# `json` precedent above and for the same kind of reason: the browser
# transport decodes for us already (`Capabilities::response_decompression`
# reports `Internal`, and `Client` then never constructs a decoder), so a
# wasm build with these on would be paying for `miniz_oxide`'s tables or
# brotli's static dictionary to reach code that cannot run there. A build
# that needs decoding says so.
#
# One feature per coding rather than a single `decompression` switch: the
# two have very different weights, and a caller who only ever talks to a
# gzip server should not be linking brotli's dictionary. Which of them is on
# decides BOTH what `Accept-Encoding` advertises and what a
# `Content-Encoding` is matched against — one value, `decompress::Decoders`,
# read by both, so the two cannot drift apart into a client that asks for
# bytes it cannot read.
#
# CI's `test` job runs `--all-features`, so all four codings stay under
# test — and `--all-features` is now two of SIXTEEN combinations rather
# than two of four, which is why `just features` (`cargo hack
# --each-feature`) is no longer enough on its own for this corner: the
# powerset over these four is checked with
# `cargo hack -p hclient --feature-powerset --include-features
# gzip,brotli,deflate,zstd --no-dev-deps check`, and the `#[cfg]` shape in
# `decompress.rs` is written so that it has to be.
gzip = ["dep:flate2"]
brotli = ["dep:brotli-decompressor"]
# `deflate`, and it is the one coding here that costs NO new crate: RFC
# 9110 §8.4.1.2 makes it zlib (RFC 1950) wrapping the same DEFLATE stream
# (RFC 1951) gzip carries, so `flate2` — already pulled in by `gzip`
# above — decodes it with a different type and no new dependency. It is a
# separate feature all the same, because what a feature buys back here is
# CODE rather than a crate, and because the two are not the same claim: a
# build that asks for `deflate` is taking on that coding's wire ambiguity
# (see `decompress.rs`'s module doc, "The `deflate` wrapper question"),
# and one that asks for `gzip` is not.
deflate = ["dep:flate2"]
# `zstd`, through `ruzstd` — a DECODER-first crate the way
# `brotli-decompressor` is, and pure Rust for the reason the `flate2` line
# below gives for `rust_backend`: the `zstd` crate binds libzstd through
# `zstd-sys`, which is C with a build script, in a crate that also builds
# for `wasm32-unknown-unknown` and `wasm32-wasip2`.
#
# It is the heaviest of the four to switch on and the one most worth
# leaving off: two crates (`ruzstd` + `twox-hash`, both MIT, both already
# permitted by `deny.toml` without widening it) against `deflate`'s zero.
# `twox-hash` arrives with `ruzstd`'s default `hash` feature and is what
# checks a frame's XXH64 content checksum — kept ON deliberately, because
# `ruzstd` READS that checksum and never compares it, so this crate does
# (`ZstdStream::verify_checksum`).
zstd = ["dep:ruzstd"]
# A cookie jar owned by the `Client` — `ClientBuilder::cookie_jar`, and the
# `hclient::cookie` re-export that names its type. OFF by default, the same
# call as `json`/`gzip`/`brotli` above and made on the same measurement
# rather than by analogy: `hclient-cookie`'s compiled-in public suffix list
# is +77,296 bytes in a stripped release binary (the numbers for the four
# candidates are in that crate's commit message and in `suffix.rs`), and
# `wasm32-unknown-unknown` is the one target where paying it is certainly
# wrong — the browser keeps the jar itself, `Capabilities::owns_cookie_jar`
# says so, and `check_cookies_supported` refuses a client-side jar against
# `hclient-fetch` at `build()`. A build that needs cookies says so.
#
# The graph cost, measured here rather than inherited from that crate's
# own report: `cargo tree -p hclient -e normal --no-default-features` is
# **Two crates** — `hclient-cookie` and `public-suffix`, and nothing
# else, because both are leaves. Stated as a delta rather than as a pair
# of totals: a total is a fact about a resolution and drifts under
# `cargo update` (AGENTS.md's dependency table records six such drifts),
# where the delta is what this feature actually costs and is the
# argument.
#
# One switch, not one per piece: unlike `gzip`/`brotli`, whose weights
# differ by an order of magnitude and which a caller genuinely picks
# between, there is nothing here to pick — the parse, the storage model and
# the retrieval order are one RFC and one crate.
#
# CI's `test` job runs `--all-features`, so this path stays under test.
cookies = ["dep:jiff", "dep:winnow", "dep:public-suffix"]
# Whether `BuiltinList` consults the compiled-in Mozilla list — what
# makes `Domain=co.uk` a refusal rather than a cookie shared across
# every registrant under `.uk`.
#
# **A flag, not a `dep:` — and that shape is the whole reason the merge
# of `hclient-cookie` did not cost a check.** That crate carried
# `default = ["public-suffix"]`, and `tests/without_the_list.rs` — the
# only thing asserting a no-list build is *narrower* than a list build
# rather than quietly wider — ran only under
# `-p hclient-cookie --no-default-features`. Folding the crate in, the
# obvious spelling was `cookies = [..., "public-suffix"]`, and it makes
# that combination unreachable: features are additive, so "the module
# without the list" stops being expressible and the test never runs
# again. `justfile` records that deleting that line "would have been the
# other direction", so it was not an option.
#
# So `cookies` pulls the *crate* and this flag gates the *code path*,
# with the flag in `default`. A plain `--features cookies` behaves
# exactly as it did; `--no-default-features --features cookies` is the
# no-list build the test needs. The one thing that changed is that the
# no-list build still links `public-suffix` as dead code — the test
# asserts behaviour, not graph size, and `graph-no-cookie-jar` still
# pins the crate out of a default build, where `cookies` is off.
public-suffix = []
# An RFC 9111 response cache owned by the `Client` —
# `ClientBuilder::cache`, and the `hclient::cache` re-export that names its
# types. OFF by default, the same call as `cookies` above and made on the
# same two measurements rather than by analogy.
#
# The graph cost: `cargo tree -p hclient -e normal --no-default-features` is
# **One crate** — `hclient-cache` and nothing else, because `bytes`,
# `http` and `thiserror` are already there. That is one fewer than
# `cookies` costs, and it is the smaller half of the argument. A delta
# rather than a total, for the reason the `cookies` line above gives.
#
# The larger half is what the feature turns on rather than what it links.
# A cache is memory a client fills without being asked: an in-memory store
# of up to 512 responses of up to a megabyte each, held for as long as the
# `Client` lives. On `wasm32-unknown-unknown` paying that is certainly
# wrong twice over — the browser keeps its own cache, `Capabilities::
# owns_cache` says so, and `check_cache_supported` refuses a client-side
# cache against `hclient-fetch` at `build()`. A build that needs caching
# says so.
#
# One switch, not one per RFC section: unlike `gzip`/`brotli`, whose
# weights differ by an order of magnitude and which a caller genuinely
# picks between, freshness without validation or validation without `Vary`
# are not caches anyone wants — they are one RFC and one crate.
#
# CI's `test` job runs `--all-features`, so this path stays under test.
cache = ["dep:jiff", "dep:winnow"]

[dependencies]
bytes         = { workspace = true }
futures-core  = { workspace = true }
http          = { workspace = true }
http-body     = { workspace = true }
hclient-core  = { workspace = true }
hclient-mock  = { workspace = true, optional = true }
# Calendar arithmetic for `src/cookie/date.rs` and `src/cache/date.rs`.
# Both modules live here, not behind a new module-level seam: a feature
# that turns them off leaves `jiff` out of the graph, and the
# modules cannot start without it.
jiff          = { workspace = true, optional = true }
# Mozilla Public Suffix list, for `CookieJar::with_public_suffix_list` to
# turn a `Domain=co.uk` into a host-only cookie — see `src/cookie/suffix.rs`.
public-suffix  = { version = "0.1.3", optional = true }
# No default features (that is set in `[workspace.dependencies]`): the
# `idn` feature above is what turns IDN back on, and it is in this crate's
# `default`, so a plain `hclient` dependency behaves as it always did while
# a consumer with `default-features = false` gets neither `idna` nor the
# ICU data crates.
hclient-proto = { workspace = true }
# Only for `Collected::json`, behind the `json` feature (see `[features]`
# above). Not in `[workspace.dependencies]`: nothing else in the vertical
# needs it (same as `futures-executor` below, a single-crate local
# dependency).
serde         = { version = "1", default-features = false, features = ["std"], optional = true }
serde_json    = { version = "1", default-features = false, features = ["std"], optional = true }
# The `gzip` AND `deflate` features — one crate, two codings, because RFC
# 9110 §8.4.1.2's `deflate` is RFC 1951 inside an RFC 1950 wrapper and
# `gzip` is the same RFC 1951 inside an RFC 1952 one. `flate2::write::`
# has a push-shaped decoder for each (`GzDecoder`, `ZlibDecoder`,
# `DeflateDecoder`), which is what lets `Decompressed::poll_frame` drive
# all three a frame at a time.
#
# The `gzip` feature. Default features (`rust_backend` = `miniz_oxide`), NOT
# `zlib`/`zlib-ng`: those are C, which would put a build script and a linked
# native library into the graph of a crate that also builds for
# `wasm32-unknown-unknown` and `wasm32-wasip2`.
# `flate2::write::GzDecoder` is push-shaped (`std::io::Write`), which is what
# lets `Decompressed::poll_frame` drive it a frame at a time with no IO
# traits and no executor anywhere near it. Licences, checked with
# `cargo deny --all-features check` before committing: `MIT OR Apache-2.0`
# (flate2, crc32fast), `MIT OR Zlib OR Apache-2.0` (miniz_oxide) — every one
# already in `deny.toml`'s measured allow-list, nothing widened for this.
flate2        = { version = "1.1", optional = true }
# The `brotli` feature. `brotli-decompressor`, not `brotli`: W5 is response
# decompression only, and the compressor is the larger half of that crate.
# `DecompressorWriter` is push-shaped for the same reason flate2's decoder
# is chosen above, and its `into_inner` is what turns a truncated stream
# into an error rather than a short read. Licence `BSD-3-Clause OR MIT`, its
# two `alloc-*-stdlib` dependencies `BSD-3-Clause` — again already allowed.
brotli-decompressor = { version = "5.0", optional = true }
# The `zstd` feature. `ruzstd`, not `zstd`: the latter is libzstd through
# `zstd-sys`, which is C with a build script — the same objection the
# `flate2` line above records against `zlib`/`zlib-ng`, and it bites
# harder here because there is no pure-Rust fallback inside that crate to
# fall back to.
#
# `default-features` are kept (`std` + `hash`) and both are load-bearing:
# `std` is what makes `ruzstd::io::Read` `std::io::Read`, so the same
# `write_all`/`Read` vocabulary the other two decoders use applies, and
# `hash` is `twox-hash`, without which a frame's XXH64 content checksum
# cannot be recomputed at all — see `ZstdStream::verify_checksum`, which
# exists because `ruzstd` reads that checksum off the wire and never
# compares it to anything.
#
# `ruzstd` also carries an ENCODER this crate never touches, unlike
# `brotli-decompressor`, which was chosen over `brotli` precisely to avoid
# one. There is no feature to remove it in 0.9 — checked, the crate's
# whole feature list is `std`, `hash`, `dict_builder`, `fuzz_exports`,
# `rustc-dep-of-std` — so the cost is dead code that LTO drops rather than
# a choice this manifest can make. Licences, checked with `cargo deny
# --all-features check` before committing: `MIT` (ruzstd, twox-hash),
# already in `deny.toml`'s allow-list, nothing widened.
ruzstd        = { version = "0.9", optional = true }
# The `charset` feature. `encoding_rs` is the WHATWG Encoding Standard as
# Firefox implements it, and there is no lighter honest option: the tables
# ARE the feature, and a hand-written subset would be this crate deciding
# which of the world's encodings are worth supporting. Nothing here
# encodes — `Encoding::decode` only — but the crate has no feature to drop
# the encoder side, so the cost is dead code LTO removes rather than a
# choice this manifest can make. `encoding_rs` is what reqwest and ureq
# both reach for, under a feature both independently named `charset`.
encoding_rs   = { version = "0.8", optional = true }
# The `digest-auth` feature. `default-features = false` on both: the
# `std` feature buys `std::io::Write` impls this crate never uses, and
# dropping it keeps the pair `no_std` — which is not idle, since
# `hclient-proto` is one `http` release away from being buildable there.
md-5          = { version = "0.11", optional = true, default-features = false }
# RFC 9110 §11.6.1's challenge grammar, which is the one place in this
# crate that genuinely needs backtracking: the same comma separates two
# challenges and two of one challenge's parameters, and only what follows
# tells them apart. Optional and switched on by `digest-auth` alone, since
# nothing else here parses a header grammar.
winnow = { workspace = true, optional = true }
sha2          = { version = "0.11", optional = true, default-features = false }
# Hex printing, for the digest response and the multipart boundary — both
# of which had hand-rolled it. Unconditional rather than behind the two
# features that reach it: `const-hex` is `alloc`-only with no build script
# and both wasm targets, and a `dep:` entry on each would be two places to
# keep in step for one crate. It is deliberately *not* used for
# percent-encoding, which is hex interleaved with literal bytes rather
# than a hex string — `hclient-proto`'s `encode` keeps its own table.
const-hex     = { workspace = true }

# SSE reconnect's jitter source (`src/sse.rs`'s `jitter` fn). Randomness
# isn't a seam anyone has defined in this project (unlike `Timer`, which
# reconnect takes as an explicit `SseBuilder::with_timer` input precisely
# because it IS one — see that method's doc comment), so `hclient` sources
# it itself, the same way `hclient-proto`'s `Backoff::delay` already takes
# `jitter` as a parameter expecting SOME caller to supply it. Plain "0.4",
# unconditional: on native and on `wasm32-wasip2` its default backend
# already covers the target (WASI is a first-class `getrandom` backend);
# the browser needs the extra `wasm_js` feature, added only under that
# target below — Cargo unions the feature set for a dependency across
# `[dependencies]` and any matching `[target.'cfg(...)'.dependencies]`
# entry for the target actually being built, so this one line still
# applies everywhere, and the browser-only line below is additive, not a
# duplicate declaration of the crate.
getrandom     = "0.4"

# Target-dependent optional dependencies for `DefaultTransport` (see
# `default-transport` in `[features]` above and the `DefaultTransport` doc
# comment in `src/lib.rs`). `not(target_family = "wasm")` is the same
# boundary as the type alias itself: the native branch is one for every
# non-wasm target (linux/macos/windows); the browser (`wasm32-unknown-
# unknown`, vertical 3) and WASI (`wasm32-wasip2`, already wired up
# separately in `hclient-wasi` — see its doc comment for why) don't fall
# into this block at all, so building for them leaves `default-transport`
# pulling in nothing — compilation fails on the missing `DefaultTransport`
# rather than silently assembling an empty transport.
#
# `hclient-tls-rustls` carries the `platform-verifier` feature not as
# optional but as mandatory: `Client::new()` (`src/client.rs`) calls
# `Rustls::with_platform_verifier()`, which is itself `#[cfg(feature =
# "platform-verifier")]` in `hclient-tls-rustls` — without this line
# `default-transport` would build for the transport (`Native`) but not for
# `Client::new()`, which would simply fail to find the method. Found by
# checking `hclient-tls-rustls`'s sources, not assumed: this task's brief
# didn't name this line explicitly.
thiserror      = { workspace = true }

[target.'cfg(not(target_family = "wasm"))'.dependencies]
hclient-native     = { path = "../hclient-native",     version = "0.1.0-alpha.1", optional = true }
hclient-rt-tokio   = { path = "../hclient-rt-tokio",   version = "0.1.0-alpha.1", optional = true }
hclient-tls-rustls = { path = "../hclient-tls-rustls", version = "0.1.0-alpha.1", optional = true, features = ["platform-verifier"] }
hclient-dns-system = { path = "../hclient-dns-system", version = "0.1.0-alpha.1", optional = true }

# The browser-only extra feature `jitter`'s `getrandom` call needs: on
# `wasm32-unknown-unknown` `getrandom` has no default backend and must be
# told which one to use. `all(target_family = "wasm", not(target_os =
# "wasi"))`, NOT bare `target_family = "wasm"`: WASI is also `wasm32-*` and
# already gets a working backend from the plain `getrandom = "0.4"` line
# above, with no extra feature needed. No `wasm-bindgen`/`js-sys` of our
# own here — `hclient` does NOT implement `Timer` for any target (a prior
# version of this file did; see the `SseBuilder::with_timer` doc comment
# in `src/sse.rs` for why that was wrong for the facade crate to own, and
# `hclient-rt-pair-check`'s own doc comment on why the project's guard
# against a target-only `#[cfg]` doesn't even reach this crate) — the
# `wasm_js` feature pulls its own `js-sys`/`wasm-bindgen` transitively
# inside `getrandom` itself, nothing further to add here.
[target.'cfg(all(target_family = "wasm", not(target_os = "wasi")))'.dependencies]
getrandom = { version = "0.4", features = ["wasm_js"] }

# The browser half of `DefaultTransport` (Task 8 of vertical 3) — the
# counterpart of the `cfg(not(target_family = "wasm"))` block above, and the
# reason the paragraph there saying "building for wasm leaves
# `default-transport` pulling in nothing" no longer holds for the browser.
#
# `cfg(all(target_family = "wasm", target_os = "unknown"))`, matching the
# type alias's own gate in `src/lib.rs` exactly: `wasm32-wasip2` is also
# `target_family = "wasm"` and deliberately still has no `DefaultTransport`
# branch, so a bare `target_family = "wasm"` here would pull a browser-only
# crate into every WASI build to satisfy a type that isn't declared there.
# Note this is a NARROWER cfg than the `getrandom` block just above, which
# is `not(target_os = "wasi")` rather than `target_os = "unknown"` — the two
# happen to select the same targets among those this workspace builds for,
# and they are written differently on purpose: `getrandom`'s condition is
# "any wasm that isn't WASI needs a backend named", this one is "exactly the
# browser".
#
# `optional = true` + `dep:hclient-fetch` in `[features]` above, not a plain
# dependency: without the `default-transport` feature this crate must not
# pull in a transport at all, on any target — the same contract the four
# native entries keep.
[target.'cfg(all(target_family = "wasm", target_os = "unknown"))'.dependencies]
hclient-fetch = { path = "../hclient-fetch", version = "0.1.0-alpha.1", optional = true }

[dev-dependencies]
# The cookie and cache suites, moved in with their modules.
rstest         = { workspace = true }
assert_matches = { workspace = true }
proptest       = { workspace = true }
# Two independent oracles for both `date.rs` files, dev-only. `httpdate`
# is the incumbent HTTP-date parser and answers the *format* question —
# which strings are accepted at all — where the corpus answers the
# arithmetic one over the whole 1601..=9999 range `Expires` can name.
httpdate       = "1.0"
time           = "0.3"
futures-executor = { version = "0.3", default-features = false, features = ["std"] }
# `BodyExt::collect`, for draining a `RequestBody` in `multipart.rs`'s unit
# tests and in `tests/multipart.rs`. A dev-dependency only: the crate itself
# polls `http_body::Body` by hand everywhere (`deadline.rs`, `decompress.rs`,
# `multipart.rs`), which is what keeps the combinators out of a consumer's
# graph.
http-body-util   = { workspace = true }
# The derive lives only here: the test behind the `json` feature needs
# `#[derive(Deserialize)]`, the crate itself doesn't (`Collected::json`
# takes an already-serializable T from the caller). dev-dependencies aren't
# part of `-e normal`, so this doesn't count against the consumer's graph
# even though it's available to tests.
serde             = { version = "1", features = ["derive"] }
# For `examples/no_tls_no_resolver.rs`: the stub TLS and stub resolver, plus
# a runtime and the native transport to hang them on. dev-dependencies are
# outside `-e normal`, so the example's imports do not appear in a
# consumer's graph — which matters here, since the example's whole point is
# how small that graph can be.
hclient-dns        = { path = "../hclient-dns",        version = "0.1.0-alpha.1" }
hclient-tls        = { path = "../hclient-tls",        version = "0.1.0-alpha.1" }

# `tests/two_runtimes.rs`'s dependencies — an end-to-end run of one generic
# body on both tokio and smol without a single `#[cfg]` (Task 14).
# `webpki-roots`, not `platform-verifier`: the test never performs a real
# TLS handshake (the server answers over plain HTTP), but the `Native::new`
# constructor still needs a concrete `T: TlsConnect` type —
# `with_webpki_roots()` doesn't need access to the system certificate store
# and doesn't pull in `rustls-platform-verifier`, which isn't needed in a
# dev context anyway.
#
# TARGET-GATED as of Task 8 of vertical 3, having been unconditional
# before. Not tidiness — without the gate, `hclient` cannot be built for
# `wasm32-unknown-unknown` with `--all-targets` AT ALL, and that is the
# build both the new browser test and CI's new per-target check need:
# `tokio`'s `rt-multi-thread` drags in `mio` and `socket2`, neither of which
# compiles for that target (measured: 48 and 9 errors respectively, from
# inside those crates, before a line of this workspace is even reached).
# Dev-dependencies are resolved per target like any other, so a test file
# that is itself `#[cfg]`-ed out still forces its dependencies to build
# unless they are gated here too — `two_runtimes.rs` carries the matching
# `#![cfg(not(target_family = "wasm"))]`, and the pair only works together.
[target.'cfg(not(target_family = "wasm"))'.dev-dependencies]
hclient-native     = { path = "../hclient-native" }
hclient-rt         = { path = "../hclient-rt" }
hclient-rt-tokio   = { path = "../hclient-rt-tokio" }
hclient-rt-smol    = { path = "../hclient-rt-smol" }
hclient-tls-rustls = { path = "../hclient-tls-rustls", features = ["webpki-roots"] }
hclient-dns-system = { path = "../hclient-dns-system" }
tokio              = { version = "1", features = ["rt-multi-thread"] }
# `tests/compression.rs`'s loopback server needs to COMPRESS, and the crate
# itself only ever decompresses (`brotli-decompressor`, not `brotli`, in
# `[dependencies]` above — W5 is response decompression only). These two are
# the encoders, on the server's side of the wire, where a test server
# belongs. Dev-dependencies are outside `-e normal`, so no consumer links
# them and `deny.toml`'s `exclude-dev` keeps them out of the shipped graph.
#
# Same target gate, and the same pairing with a `#![cfg]` on the test file,
# as the `tokio` line above: on wasm neither the encoder nor `TcpListener`
# is any use, and an ungated dev-dependency still has to BUILD for a target
# whose test file is cfg'd out.
flate2             = { version = "1.1" }
brotli             = { version = "8.0", default-features = false, features = ["std"] }
# The zstd ENCODER for the same server, and it is an oracle rather than a
# convenience — the role `multer` plays for `multipart.rs` and `url` for
# `uri.rs` one crate over. This is `zstd` 0.13, i.e. **libzstd itself**
# through `zstd-sys`, which is the reference implementation and shares not
# one line with the `ruzstd` decoder in `[dependencies]` above: a decoder
# checked only against its own encoder is green for any self-consistent
# mistake about what zstd is. The C-and-a-build-script objection that
# keeps this crate out of `[dependencies]` does not apply on this side of
# the line — dev-dependencies are outside `-e normal`, no consumer links
# them, `deny.toml`'s `exclude-dev` keeps them out of the shipped graph,
# and this test file only ever builds for the host.
zstd               = { version = "0.13", default-features = false }
# `tests/multipart.rs`'s oracle, and it is an oracle rather than a
# convenience: an encoder checked against its own idea of itself is green
# for any self-consistent mistake, so the parts are read back by a parser
# that shares no code with `src/multipart.rs` — the same role `url` plays
# for `uri.rs` one crate over. `default-features = false` on purpose: the
# default set pulls `tokio` with `io-util` plus `tokio-util` for the
# `AsyncRead` constructor, and this test feeds it a `Stream` instead.
#
# Executed rather than read. `multer` does NOT percent-decode the `name`
# and `filename` parameters — checked by running it, after this workspace
# spent a day on an upstream encoder whose documentation and behaviour
# disagreed (`h3-datagram`'s discarded stream id) — so the assertions below
# are about the escaped forms that go on the wire, which is also what a
# browser sends.
multer             = { version = "3.1", default-features = false }

# `tests/wasm_default.rs` — the first browser tests in this crate (Task 8 of
# vertical 3). `wasm-bindgen-test` is the harness `wasm-pack test` drives;
# `web-sys`'s `Window`/`Location` are there so the end-to-end test can fetch
# the harness's own already-loaded page (`window.location.href`) instead of
# reaching for the Internet — the same trick, and the same two features,
# `hclient-fetch`'s own `tests/transport.rs` uses.
#
# Same gate as the browser `[dependencies]` block above and for the same
# reason, not a bare `target_family = "wasm"`: on `wasm32-wasip2` there is
# no browser, no `DefaultTransport`, and nothing here to build.
[target.'cfg(all(target_family = "wasm", target_os = "unknown"))'.dev-dependencies]
wasm-bindgen-test = "0.3"
web-sys           = { version = "0.3.103", features = ["Window", "Location"] }

[lints]
workspace = true
