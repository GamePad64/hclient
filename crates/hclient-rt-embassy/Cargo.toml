[package]
name = "hclient-rt-embassy"
version.workspace = true
description = "hclient runtime capabilities implemented on top of embassy — embassy-time for the clock, embassy-net (smoltcp) for the sockets"
keywords     = ["hclient", "runtime", "embassy", "embedded"]
categories   = ["asynchronous", "embedded"]
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

# **Paused before the first release, and the reason is a measurement rather
# than doubt about the code.** As a *deployment* runtime this crate has no
# configuration today: it is not `no_std` and cannot be — `http` 1.5.0
# still carries `compile_error!("`std` feature currently required")` — so
# its configuration is *std plus `embassy-net`*, and `embassy-net` is the
# stack you use when you have no `std`. The one device the docs used to
# name, esp-idf, integrates `embassy-sync`, `embassy-time-driver` and
# `embassy-futures` and **not** `embassy-net`; it hands you lwIP through
# `std::net`, where the runtime is `hclient-rt-smol` or `hclient-rt-tokio`.
# The only place `Native<Embassy, ..>` actually runs is a Linux host over a
# TAP device, which is this repository's CI.
#
# Publishing would promise a configuration measurement says does not exist,
# and a published surface is a surface that must not move. Not publishing
# is free and reversible; un-publishing is neither.
#
# **What the crate is for stays exactly as it was**, and it is load-bearing:
# it is the workspace's only `!Send` seam implementor, and `tests/seam.rs`
# pins that. Delete it and `TcpConnect::Connecting` could quietly become a
# `Send` box, `SendTransport` would look like ceremony, and
# `Transport::execute`'s unbounded RPITIT would look like caution with no
# case — see `AGENTS.md`. `hclient-rt-pair-check` is unpublished for the
# same class of reason and `hclient-rt-nal` for a neighbouring one.
#
# Flip this back the day `no_std` becomes reachable: `http` growing it, or
# this workspace dropping `http` from its public API.
publish = false

# See the root Cargo.toml: `default` is near-empty here by design.
[package.metadata.docs.rs]
all-features = true

[features]
# Which address families this build can reach. They forward straight to
# `embassy-net`, because the smoltcp `IpAddress` enum has one variant per
# family GATED ON EXACTLY THESE FEATURES — a build without `proto-ipv6` has
# no way to name an IPv6 address at all. `connect` to a family that is not
# compiled in is a typed error naming the feature to turn on, not a panic
# and not a silent v4 fallback (`address_family_left_out_of_the_build_is_a
# _typed_error`).
#
# The `medium-*` set is smoltcp's link layer, and one of them is not
# optional: smoltcp's own `compile_error!` refuses a build that enables a
# socket without a medium. They are additive and belong to whoever brings
# the driver, so this crate only has to make sure the common case builds —
# `medium-ethernet` covers Ethernet and WiFi, and a device on a raw IP link
# (PPP, 6LoWPAN over a raw tunnel) adds its own.
default = ["proto-ipv4", "medium-ethernet"]
proto-ipv4 = ["embassy-net/proto-ipv4"]
proto-ipv6 = ["embassy-net/proto-ipv6"]
medium-ethernet = ["embassy-net/medium-ethernet"]
medium-ip = ["embassy-net/medium-ip"]
medium-ieee802154 = ["embassy-net/medium-ieee802154"]

[dependencies]
embassy-net  = { version = "0.9", default-features = false, features = ["tcp"] }
embassy-time = { version = "0.5", default-features = false }
hclient-rt   = { path = "../hclient-rt", version = "0.1.0-alpha.2" }
# Directly, not through `hclient-rt`: this crate implements
# `hyper::rt::{Read, Write}` itself, and a re-export would not be nameable
# in an `impl`.
hyper        = { version = "1.11", default-features = false }

[dev-dependencies]
static_assertions = { workspace = true }
# `arch-std` + `executor-thread` is embassy's own executor on a host OS —
# the same executor as on a device, with a std-based pender. The point of
# the acceptance is that the whole client runs under THIS executor.
#
# Ungated on purpose, and it is NOT only the acceptance that needs it: the
# `std` time driver below uses embassy's default INTEGRATED timer queue,
# whose storage lives in this crate's task headers, so every test binary
# here has to link it or `__embassy_time_queue_item_from_waker` is left
# unresolved. `src/lib.rs` says the rest, next to the `use` that keeps the
# rlib on the linker's command line.
embassy-executor = { version = "0.10", features = ["platform-std", "executor-thread"] }
# `std` here is embassy-time's std TIME DRIVER. A device build supplies its
# own driver (esp-idf-svc's `embassy-time-driver` feature, an MCU HAL's
# timer); the library above deliberately enables no driver at all, since
# picking one is the application's job and two drivers do not link.
#
# Ungated, and it has to be: `embassy-net` is a normal dependency and calls
# `embassy_time::Instant::now()`, so without a driver in the test build
# `_embassy_time_now` and `_embassy_time_schedule_wake` are unresolved —
# measured, by taking this line out and linking with `--no-gc-sections`.
embassy-time = { version = "0.5", features = ["std"] }
# `critical-section` is a `#[no_mangle]` contract of exactly the same shape:
# `embassy-sync` — a mandatory dependency of `embassy-net` — calls
# `critical_section::acquire`/`release`, and the implementation is the
# APPLICATION's to choose, because on a device it is an interrupt mask and
# nothing below can know which one. For a test binary on a host the answer
# is this crate's own `std` implementation, a reentrant global mutex.
#
# Nothing in these tests reaches `CriticalSectionRawMutex`, so the calls are
# dead code — which is exactly why this went unnoticed. NEITHER feature set
# supplied an implementation (`cargo tree -e features -i critical-section`
# shows `default` alone with and without `--all-features`); `--all-features`
# merely happened not to pull the referring archive members into the link,
# while the default build does. Both configurations now define the symbols
# instead of resting on which member a particular linker happens to need.
#
# No `use critical_section as _` beside the one in `src/lib.rs`: unlike
# `embassy-executor`, this crate is already on every link line as a
# transitive dependency of a NORMAL dependency, so the feature was the only
# thing missing. The strict-linker CI job checks that in both feature sets.
critical-section = { version = "1.2", features = ["std"] }
embassy-net  = { version = "0.9", features = ["tcp", "proto-ipv4", "medium-ethernet", "std", "log"] }
# The Linux TAP driver for embassy-net: an ordinary `embassy_net::driver::
# Driver` over `/dev/net/tun`, which is what lets the acceptance run a real
# smoltcp stack against a real kernel-side peer.

# Linux only, and it must say so: `embassy-net-tuntap` reaches for
# `libc::IFF_TAP`, which does not exist on macOS or Windows, so an
# ungated dev-dependency breaks `cargo test` on two of the three
# platforms this workspace supports. Measured on `macos-latest`:
# `error[E0425]: cannot find value \`IFF_TAP\` in crate \`libc\``.
[target.'cfg(target_os = "linux")'.dev-dependencies]
embassy-net-tuntap = "0.1"
heapless           = "0.9"
# Tracing for the acceptance, off unless `HCLIENT_EMBASSY_TRACE` is set.
# Not decoration: the reason `SocketPool` reclaims finished sockets eagerly
# is a smoltcp behaviour that is invisible without these two lines (see
# `Inner::reclaim_finished`, which quotes the log it produced), and a
# measurement nobody can reproduce is a story.
log                = { version = "0.4", features = ["std"] }
smoltcp            = { version = "0.13", default-features = false, features = ["log"] }
hclient          = { workspace = true }
hclient-core     = { workspace = true }
hclient-native   = { path = "../hclient-native", version = "0.1.0-alpha.2" }
# The control in `tests/seam.rs`: a transport that *can* promise `Send`,
# so the negative assertion beside it cannot pass vacuously. Chosen for
# being tiny — no runtime, no TLS — since this crate is the embedded one.
hclient-mock     = { path = "../hclient-mock", version = "0.1.0-alpha.2" }
hclient-dns      = { path = "../hclient-dns", version = "0.1.0-alpha.2" }
hclient-tls      = { path = "../hclient-tls", version = "0.1.0-alpha.2" }
# The scenarios collect response bodies themselves, because the embedded
# path is `Transport` rather than `hclient::Client` — see `tuntap.rs`'s
# `get`. `hclient::Collected` is not reachable from outside that facade.
http-body-util   = { workspace = true }
http             = { workspace = true }
http-body        = { workspace = true }
bytes            = { workspace = true }

[lints]
workspace = true
