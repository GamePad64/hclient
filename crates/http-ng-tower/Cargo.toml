[package]
name = "http-ng-tower"
version = "0.1.0"
description = "http-ng's Transport as a tower::Service, so the tower-http middleware stack applies"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
bytes         = { workspace = true }
http          = { workspace = true }
http-body     = { workspace = true }
http-ng-core  = { workspace = true }
tower-service = "0.3"

[dev-dependencies]
futures-executor = { version = "0.3", default-features = false, features = ["std"] }
http-ng          = { workspace = true, features = ["test-util"] }
http-ng-mock     = { workspace = true }
http-body-util   = { workspace = true }
tower-service    = "0.3"
tower            = { version = "0.5", default-features = false, features = ["util"] }

[lints]
workspace = true
