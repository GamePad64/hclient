[package]
name = "hclient-tls-native-tls"
version.workspace = true
description = "hclient's native-tls TLS backend — the platform's own TLS stack behind the same hyper::rt-typed seam"
keywords     = ["hclient", "tls", "native-tls", "schannel"]
categories   = ["cryptography"]
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

# See the root Cargo.toml: `default` is near-empty here by design.
[package.metadata.docs.rs]
all-features = true

[dependencies]
# `async-native-tls` is **gone**, and its absence is the port: this crate
# drives `native-tls`'s own handshake and owns the stream, because the
# seam's `Handshake` is an associated type and that crate's connector is a
# `pub async fn` whose future has no name. See `src/stream.rs`.
#
# What it cost is one `unsafe` (amendment C17) and what it bought is two
# things: `hclient::Client` works over this backend again, and
# `reports_alpn` is `true`, because `native_tls::TlsStream::negotiated_alpn`
# is public where the wrapper's was not.
futures-io       = { version = "0.3", default-features = false, features = ["std"] }
hclient-core     = { workspace = true }
hclient-rt       = { path = "../hclient-rt", version = "0.1.0-alpha.1" }
hclient-tls      = { path = "../hclient-tls", version = "0.1.0-alpha.1" }
hyper            = { version = "1.11", default-features = false }
native-tls       = { version = "0.2", features = ["alpn"] }

[dev-dependencies]
futures-executor = { version = "0.3", default-features = false, features = ["std"] }

# For `tests/insecure.rs` only. **The server side runs on rustls, and it
# ran on `native-tls` until the two other platforms' CI jobs said what
# that cost.** The argument for the old fixture was that this crate exists
# for the platform stack, so a peer built on the other backend tests the
# pair — but the *client* is the subject and a peer is a peer, and
# `native_tls::Identity::from_pkcs8` is an OpenSSL-shaped constructor:
# SChannel answers `ASN1 bad tag value met` for the same PEM pair and
# Security.framework answers `Unknown format in import` (-25257).
#
# So the fixture would not start on Windows or macOS — the two platforms
# where this test's own long comment says the distinction it pins is
# visible, since only the OpenSSL backend collapses the hostname flag into
# the certificate one. A test that runs nowhere but the host that cannot
# discriminate is the worst of both.
#
# `rcgen` mints the self-signed certificate the test needs a client to
# refuse; `ring` and no `aws-lc-rs`, matching `hclient-tls-rustls`, so a
# workspace build resolves one provider.
#
# These reach no published graph — a dev-dependency is stripped from the
# packaged manifest's normal section — and carry a `version` so that a
# downloaded `.crate` can still run its own tests, which is the reason
# `docs/publishing.md` gives for the three extra publish waves.
rcgen            = "0.14"
rustls           = { version = "0.23", default-features = false, features = ["std", "ring", "tls12"] }
rustls-pki-types = "1.15"
tokio-rustls     = { version = "0.26", default-features = false, features = ["ring"] }
tokio            = { version = "1", features = ["macros", "net", "rt", "time", "io-util"] }
hclient-rt       = { path = "../hclient-rt",       version = "0.1.0-alpha.1" }
hclient-rt-tokio = { path = "../hclient-rt-tokio", version = "0.1.0-alpha.1" }

# NOT `[lints] workspace = true`, for the reason `hclient-fetch`'s own
# table gives: the workspace sets `unsafe_code = "forbid"`, and `forbid`
# cannot be relaxed from inside a crate (`E0453`). This crate carries the
# project's second `unsafe` — `src/stream.rs`'s `StdAdapter`, which bridges
# `native-tls`'s synchronous `Read`/`Write` to a poll-based world — and
# that needs `deny`, overridable by a scoped `#[allow]` beside each site.
# See `docs/exceptions.md`, amendment C17.
#
# Opting out also drops `missing_debug_implementations` and
# `unexpected_cfgs`, restated below rather than lost silently.
[lints.rust]
unsafe_code                   = "deny"
missing_debug_implementations = "warn"
unexpected_cfgs               = { level = "warn", check-cfg = [] }

[features]
# Enables `NativeTls::danger_accept_invalid_certs`. Off by default, and a
# feature rather than a plain constructor for auditability: a build either
# contains a path that skips certificate verification or provably does
# not, and `cargo tree -f "{p} {f}"` answers which.
dangerous-insecure = []
