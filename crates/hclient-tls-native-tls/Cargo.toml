[package]
name = "hclient-tls-native-tls"
version.workspace = true
description = "hclient's native-tls TLS backend — the platform's own TLS stack behind the same hyper::rt-typed seam"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

# See the root Cargo.toml: `default` is near-empty here by design.
[package.metadata.docs.rs]
all-features = true

[dependencies]
# `runtime-smol` does NOT pull smol in, and this crate has no runtime
# dependency — verified against async-native-tls 0.6.0's own manifest, where
# `runtime-smol = ["futures-util"]` and nothing else, while `runtime-tokio =
# ["tokio"]` genuinely does. The feature only selects which IO traits the
# crate speaks: `futures_util::io::{AsyncRead, AsyncWrite}`, i.e. futures-io,
# versus tokio's. It is a misnomer, and it matters here because the whole
# point of the `hclient-tls` seam is that TLS carries no per-runtime glue — a
# reader seeing a feature named after a runtime is entitled to assume the
# opposite, so this comment answers that before it is asked.
#
# `default-features = false` even though the default IS `runtime-smol`:
# naming it explicitly means a future default change cannot silently swap our
# IO traits for tokio's.
async-native-tls = { version = "0.6", default-features = false, features = ["runtime-smol"] }
futures-io       = { version = "0.3", default-features = false, features = ["std"] }
hclient-core     = { workspace = true }
hclient-rt       = { path = "../hclient-rt", version = "0.1.0-alpha.1" }
hclient-tls      = { path = "../hclient-tls", version = "0.1.0-alpha.1" }
hyper            = { version = "1.11", default-features = false }
native-tls       = "0.2"

[dev-dependencies]
futures-executor = { version = "0.3", default-features = false, features = ["std"] }

[lints]
workspace = true
