[package]
name = "hclient-quinn"
version.workspace = true
description = "quinn on hclient's runtime seam: a quinn::Runtime over UdpBind, Spawn and Timer"
keywords     = ["hclient", "quic", "quinn", "runtime"]
categories   = ["network-programming", "asynchronous"]
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

# Its own crate, for the reason every other pluggable thing here is one:
# Cargo's features are additive. This adapter used to be `mod runtime`
# inside `hclient-h3`, which was not a feature and so not additive — it was
# simply *unreachable*, which is the other way a shared thing stops being
# shared. A `quinn` feature on `hclient-rt` would have been the additive
# mistake proper, putting `quinn-proto`, `quinn-udp` and `ring` into every
# build of the seam that any neighbour switched it on for; the seam's own
# `RecvMeta`/`EcnCodepoint` are re-declared rather than re-exported to keep
# exactly that from happening, and `just graph-no-quic` checks it.
#
# So this crate is where the QUIC vocabulary and the seam's vocabulary meet,
# and it is the only place either has to know about the other.
# The same argument puts the WebSocket framing in its own crate.

# See the root Cargo.toml: `default` is near-empty here by design.
[package.metadata.docs.rs]
all-features = true

[dependencies]
hclient-rt       = { path = "../hclient-rt", version = "0.1.0-alpha.1" }
pin-project-lite = "0.2"
# `ring` came here with the endpoint that needs it, and is not optional: a
# QUIC ENDPOINT needs an HMAC key for stateless resets and an AEAD for retry
# tokens, independently of any TLS session, and quinn expresses that as a
# crypto feature — `EndpointConfig` has no `Default` without one. It is the
# same provider rustls already uses in this graph, not a second one.
#
# No `runtime-*`: the runtime is this crate. No `rustls-*` either — nothing
# here builds a crypto configuration, and `ClientConfig` is the caller's to
# make. No `futures-io`: that one belongs to `h3-quinn`, which is
# `hclient-h3`'s dependency and not this crate's.
quinn            = { version = "0.11", default-features = false, features = ["ring"] }

[lints]
workspace = true
