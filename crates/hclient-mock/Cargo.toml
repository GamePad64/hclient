[package]
name = "hclient-mock"
version.workspace = true
description = "Mock transport and controllable timer for testing hclient transports and clients"
keywords     = ["hclient", "transport", "mock", "testing"]
categories   = ["development-tools::testing"]
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

# Depends on `hclient-core` ONLY, never on the `hclient` facade. That is the
# whole reason this crate exists separately: a transport implementation lives
# below the facade, so reaching the test doubles through it meant depending
# upward on everything the facade pulls in. Anyone writing a `Transport` —
# in this workspace or outside it — now gets `MockTransport` for the cost of
# `hclient-core`.
#
# Keep it that way. A dependency on `hclient` here would re-create exactly
# the coupling this split removed, and would do it silently, since the
# facade already dev-depends on nothing that would flag the cycle.
# See the root Cargo.toml: `default` is near-empty here by design.
[package.metadata.docs.rs]
all-features = true

[dependencies]
bytes         = { workspace = true }
http          = { workspace = true }
http-body     = { workspace = true }
hclient-core  = { workspace = true }
thiserror     = { workspace = true }

[lints]
workspace = true

[dev-dependencies]
futures-executor = { version = "0.3", default-features = false, features = ["std"] }
# For the crate doc's example alone, and **path-only, with no `version`**,
# which is not a slip. `hclient` depends on this crate behind its
# `test-util` feature, so a version-carrying dev-dependency the other way
# is a cycle: cargo allows it inside a workspace and refuses it at package
# time, because a dev-dependency with a version has to resolve from the
# registry and `hclient` cannot be there until this crate is. Path-only
# makes cargo strip it from the published manifest. Two other crates here
# carry the same line for the same reason and `just package-build` is what
# found it — every other dependency in this file being `workspace = true`
# invites a tidy-up that would put the defect straight back.
hclient    = { path = "../hclient" }
http       = { workspace = true }
serde_json = "1"

http-body-util = { workspace = true }
