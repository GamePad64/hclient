[package]
name = "http-ng-tls-rustls"
version = "0.1.0"
description = "http-ng's rustls TLS backend, the adapter written against hyper::rt"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = []
platform-verifier = ["dep:rustls-platform-verifier"]
webpki-roots      = ["dep:webpki-roots"]

[dependencies]
http-ng-core     = { workspace = true }
http-ng-tls      = { path = "../http-ng-tls", version = "0.1.0" }
hyper            = { version = "1.11", default-features = false }
rustls           = { version = "0.23", default-features = false, features = ["std", "ring", "tls12"] }
rustls-pki-types = "1.15"
rustls-platform-verifier = { version = "0.7", optional = true }
webpki-roots     = { version = "1.0", optional = true }

[dev-dependencies]
http-ng-rt       = { path = "../http-ng-rt" }
http-ng-rt-smol  = { path = "../http-ng-rt-smol" }
http-ng-rt-tokio = { path = "../http-ng-rt-tokio" }
futures-executor = { version = "0.3", default-features = false, features = ["std"] }
# `client` + `http1`: only this task (fix round 2) actually speaks HTTP
# over `TlsStream` — the claim "hyper decides framing, not this stream"
# can only be checked with a real hyper client, not a homegrown
# substitute. `[dependencies]` above stays `default-features = false`
# without these features — the per-target feature resolver (`resolver =
# "3"`, workspace root) keeps them from leaking into the library build,
# confirmed with `cargo tree`.
hyper            = { version = "1.11", default-features = false, features = ["client", "http1"] }
http-body-util   = { workspace = true }
rcgen            = "0.14"
socket2          = { version = "0.6", features = ["all"] }
tokio            = { version = "1", features = ["macros", "rt-multi-thread", "net", "io-util"] }
tokio-rustls     = { version = "0.26", default-features = false, features = ["ring"] }

[lints]
workspace = true
