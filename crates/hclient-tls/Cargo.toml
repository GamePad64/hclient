[package]
name = "hclient-tls"
version.workspace = true
description = "Pluggable TLS trait for hclient"
keywords     = ["hclient", "tls", "seam"]
categories   = ["cryptography", "network-programming"]
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

# See the root Cargo.toml: `default` is near-empty here by design.
[package.metadata.docs.rs]
all-features = true

[dependencies]
hclient-core = { workspace = true }
hyper        = { version = "1.11", default-features = false }

[lints]
workspace = true

[dev-dependencies]
futures-executor = { version = "0.3", default-features = false, features = ["std"] }
