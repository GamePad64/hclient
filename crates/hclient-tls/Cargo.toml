[package]
name = "hclient-tls"
version = "0.1.0-alpha.10"
description = "Pluggable TLS trait for hclient"
keywords     = ["hclient", "tls", "seam"]
categories   = ["cryptography", "network-programming"]
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

# See the root Cargo.toml: `default` is near-empty here by design.
[package.metadata.docs.rs]
all-features = true

[features]
default = []
# **There is no `quic` feature any more**, and the reason is that it had
# nothing left to gate. It existed because the QUIC seam *carried* an
# `Arc<dyn quinn_proto::crypto::ClientConfig>`, so this crate linked
# quinn to hold one — measured at 38 crates against 21, with `chacha20`
# and `rand` among them, in the crate that exists to have no
# cryptography. `QuicCryptoConfig` is this crate's own declarative type
# now: an ALPN list, two flags and a label. A feature gating a trait and
# two structs with no dependency behind them would be a flag a consumer
# has to remember for nothing.

[dependencies]
hclient-core = { workspace = true }
futures-io   = { version = "0.3", default-features = false, features = ["std"] }
hclient-rt   = { path = "../hclient-rt", version = "0.1.0-alpha.11" }

[lints]
workspace = true

[dev-dependencies]
futures-executor = { version = "0.3", default-features = false, features = ["std"] }
