[package]
name = "hclient-tls"
version = "0.1.0-alpha.11"
description = "Pluggable TLS trait for hclient"
keywords     = ["hclient", "tls", "seam"]
categories   = ["cryptography", "network-programming"]
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

# See the root Cargo.toml: `default` is near-empty here by design.
[package.metadata.docs.rs]
all-features = true

# **This crate has no features, and the empty `default` is what says so
# deliberately rather than by omission.**
#
# There was a `quic` one, gating the second seam, and it existed because
# that seam *carried* an `Arc<dyn quinn_proto::crypto::ClientConfig>`: so
# this crate linked quinn to hold the value, measured at 38 crates
# against 21 with `chacha20`, `rand_core` and `ring` among the
# difference — cryptography, in the crate whose purpose is that a backend
# chooses it.
#
# `QuicCryptoConfig` is this crate's own declarative type now — an ALPN
# list, two flags and an identity label — and `QuicTlsConnect::Session`
# is opaque, so **the two seams are peers with nothing to gate**: TCP and
# QUIC both describe what a backend must answer, and neither brings a
# dependency the other does not. A flag over that would be one a consumer
# has to remember for nothing, and `just graph-tls-seam-carries-no-stack`
# asserts under `--all-features` that no feature can put a stack back.
[features]
default = []

[dependencies]
hclient-core = { workspace = true }
futures-io   = { version = "0.3", default-features = false, features = ["std"] }
hclient-rt   = { path = "../hclient-rt", version = "0.1.0" }

[lints]
workspace = true

[dev-dependencies]
futures-executor = { version = "0.3", default-features = false, features = ["std"] }
