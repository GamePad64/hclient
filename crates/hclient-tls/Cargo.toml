[package]
name = "hclient-tls"
version = "0.1.0-alpha.10"
description = "Pluggable TLS trait for hclient"
keywords     = ["hclient", "tls", "seam"]
categories   = ["cryptography", "network-programming"]
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

# See the root Cargo.toml: `default` is near-empty here by design.
[package.metadata.docs.rs]
all-features = true

[features]
default = []
# TLS for QUIC, and the crates it brings. Off by default.
quic = ["dep:quinn-proto"]

[dependencies]
hclient-core = { workspace = true }
# `quic` only: the second seam *carries* a `quinn_proto::crypto::
# ClientConfig` — inside `QuicCryptoConfig`, so it is not in the seam's
# signature, but this crate still links quinn to hold it, which is why that
# seam is behind a feature and not simply here. The newtype answers a
# different question from the feature: the feature decides who links quinn,
# the newtype decides who names its 0.11 version in a signature. See
# `src/quic.rs`'s own doc.
quinn-proto  = { version = "0.11", default-features = false, optional = true }
futures-io   = { version = "0.3", default-features = false, features = ["std"] }
hclient-rt   = { path = "../hclient-rt", version = "0.1.0-alpha.11" }

[lints]
workspace = true

[dev-dependencies]
futures-executor = { version = "0.3", default-features = false, features = ["std"] }
