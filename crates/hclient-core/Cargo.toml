[package]
name = "hclient-core"
version.workspace = true
description = "Plugin contract for hclient: Transport, Capabilities, RequestBody, Error, Timer"
keywords     = ["hclient", "http", "transport", "async"]
categories   = ["web-programming::http-client", "asynchronous"]
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

# See the root Cargo.toml: `default` is near-empty here by design.
[package.metadata.docs.rs]
all-features = true

[dependencies]
bytes     = { workspace = true }
# The two halves of the WebSocket seam's shape, and nothing else from the
# `futures` family: both are dependency-free type-only crates, and both
# were already in every graph in this workspace that has any `futures` at
# all (measured: `hclient-wasi` on wasm32-wasip2 and `hclient-fetch` on
# wasm32-unknown-unknown both carry them today). So this is not behind a
# feature — a seam a backend author can only name in some builds is worse
# than two crates that are already there.
futures-core = { workspace = true }
futures-sink = { workspace = true }
http      = { workspace = true }
http-body = { workspace = true }
thiserror = { workspace = true }
# `ConnectionId`'s counter is an `AtomicU64` and a 32-bit target has no
# 64-bit atomics — not `riscv32imac`, not `thumbv7em`. `core`'s type simply
# is not there, which is a compile error rather than a slow path.
#
# **`fallback` is not decoration and `default-features = false` alone
# breaks this**: `cfg_has_atomic_64` is gated on `feature = "fallback"` AND
# one of the CAS sources, so turning defaults off removes the very thing
# that makes the 64-bit type exist. Measured, after it failed with
# `critical-section` alone.
#
# `critical-section` is the same `#[no_mangle]` contract
# `hclient-rt-embassy`'s manifest documents at length: the implementation
# is the APPLICATION's, because on a device it is an interrupt mask and
# nothing below can know which one. On a host target the whole dependency
# is inert — the native atomics are used and no section is ever taken.
#
# See `docs/no-std.md`. The cheaper alternative is narrowing the counter to
# `AtomicU32`, which changes a public type.
portable-atomic = { version = "1", default-features = false, features = ["critical-section", "fallback"] }

[dev-dependencies]
http-body-util = { workspace = true }


[lints]
workspace = true
