[package]
name = "hclient-proto"
version.workspace = true
description = "Pure state machines for hclient's protocol layers: no I/O, no async, no runtime"
keywords     = ["hclient", "http", "sans-io", "uri", "sse"]
categories   = ["web-programming::http-client", "parser-implementations"]
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

# See the root Cargo.toml: `default` is near-empty here by design.
[package.metadata.docs.rs]
all-features = true

[features]
default = ["idn"]
# Internationalised domain names: `uri::parse` converts a non-ASCII host to
# its A-label form (punycode) instead of refusing it. ON by default,
# because this is what the client did before `url` was removed — but a
# feature, because it is the entire weight of the dependency graph this
# crate used to carry unconditionally.
#
# Turning it off removes the whole IDN implementation from the build
# ENTIRELY — on Linux and wasm that is `idna`, `icu_normalizer`,
# `icu_properties` and their data crates (`cargo tree -p hclient-proto -e
# normal --no-default-features` has none of them); on Windows and Apple it
# is the platform binding `hclient-idn` uses instead. A non-ASCII host
# then becomes `uri::UriError::NonAsciiHost`, which names the cause and
# tells the caller to supply the A-label itself.
#
# There is no middle setting. `idna`'s own `compiled_data` feature cannot
# be turned off in isolation: `idna_adapter` (the back end `idna` reaches
# Unicode through) has exactly one feature, `compiled_data`, and without it
# the adapter does not compile at all — its whole body calls the
# `compiled_data`-gated `*Borrowed::new()` constructors. The alternative
# back ends `idna_adapter` documents are chosen by PINNING A VERSION in the
# top-level `Cargo.lock` (1.1.x = unicode-rs, "binary size larger"; 1.0.x =
# a stub with no Unicode data at all), which is an application's decision
# to make in its own lock file, not something a library can express.
idn = ["dep:hclient-idn"]

[dependencies]
# `winnow`, and only for `head`: an HTTP response head is a grammar, which
# is where a combinator library pays — the line this workspace drew when
# the date parsers were split, and measured in both directions there.
winnow = { workspace = true }
base64 = { workspace = true }
form_urlencoded = { workspace = true }
percent-encoding = { workspace = true }
bytes = { workspace = true }
http  = { workspace = true }
thiserror = { workspace = true }
# Only under the `idn` feature. This used to be `idna` directly, with an
# explicit `default-features = false` plus `std`/`compiled_data`; those
# three words now live in `hclient-idn`'s own manifest, copied there
# verbatim when the crate was written, and this crate no longer names
# `idna` at all.
#
# **What that changes, and what it deliberately does not.** On Linux and
# every other ELF unix, and on wasm, `hclient-idn` resolves to the bundled
# `idna` crate and `bundled_to_ascii` is `idna::domain_to_ascii_cow(…,
# AsciiDenyList::URL)` — the same call this file used to reach directly,
# with the same arguments, so the answer is byte for byte what it was.
# On Windows and Apple it resolves to the platform's own UTS 46
# (`icuuc.dll`, Foundation) and `idna` is not in the graph at all. Which
# one a target gets is decided by `hclient-idn/build.rs`, not here and not
# by a feature.
hclient-idn = { workspace = true, optional = true }

# `url` is a DEV-dependency only, and deliberately so: it is the incumbent
# implementation of `uri::resolve_reference` and the only oracle the
# hand-written replacement has. `tests/uri_resolution.rs` runs both over the
# same corpus. It is not in `[dependencies]`, so it reaches no downstream
# build — `cargo tree -p hclient-proto -e normal` contains no `url` at all,
# with or without `idn`.
[dev-dependencies]
proptest = { workspace = true }
url      = { workspace = true }
rstest   = { workspace = true }

[lints]
workspace = true
