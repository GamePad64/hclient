[package]
name = "hclient-proto"
version = "0.1.0"
description = "Internal to hclient: the sans-io response-head parser, Happy Eyeballs scheduler and encoders its transports share. Not a public API"
keywords     = ["hclient", "http", "sans-io"]
categories   = ["web-programming::http-client", "parser-implementations"]
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

# See the root Cargo.toml: `default` is near-empty here by design.
# Internal: published because its dependents need it on crates.io, and
# promising nothing. No other crate may expose its types —
# `just internal-crates-stay-internal` reads this key.
[package.metadata.hclient]
internal = true

[package.metadata.docs.rs]
all-features = true

[dependencies]
# `winnow`, and only for `head`: an HTTP response head is a grammar, which
# is where a combinator library pays — the line this workspace drew when
# the date parsers were split, and measured in both directions there.
winnow = { workspace = true }
base64 = { workspace = true }
form_urlencoded = { workspace = true }
bytes = { workspace = true }
http  = { workspace = true }
thiserror = { workspace = true }

# `url` is a dev-dependency only: the oracle `encode`'s tests compare the
# form serialiser against.
[dev-dependencies]
proptest = { workspace = true }
url      = { workspace = true }

[lints]
workspace = true
