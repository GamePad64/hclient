[package]
name = "hclient-idn"
# **Its own version, and the reason is `system-resolver`'s.** Every crate
# in the family rides `[workspace.package].version`, which is a
# pre-release because the family's seams are still moving — and inside a
# pre-release `cargo semver-checks` executes none of its lints, because
# every step is a major one. So the guarantee this crate can offer is not
# bought by versioning separately; it is bought by leaving pre-release,
# and versioning separately is what lets it do that without promising the
# same of a family that is not ready.
#
# It is a crate that can afford it: two public functions, an error type,
# and a use outside HTTP entirely — nothing here depends on `hclient`'s
# mechanisms, and `cargo tree -i` names `hclient-proto` as its only
# in-workspace consumer.
version = "0.1.0"
description = "IDN (UTS 46) domain-to-ASCII and back, through whatever UTS 46 the platform already carries"
keywords     = ["hclient", "idn", "uts46", "punycode", "idna"]
categories   = ["internationalization", "encoding"]
edition.workspace = true
# **Its own floor, for the reason it carries its own version.** The
# family's policy is "MSRV is the latest stable", which buys it no shim
# code and no matrix and costs a crate meant to be used from outside its
# reach. This one is meant to be used from outside.
#
# Measured rather than picked: 1.94 rejects `core::cfg_select!` as an
# unstable library feature and 1.95 accepts it, so that macro is the
# single binding constraint — every dependency's own floor is below it
# (`thiserror` 1.31, `windows-sys` 1.71, `jni` 1.73, `idna`
# 1.57), and edition 2024's 1.85 is lower still. On 1.95.0 the crate
# builds `--all-targets` and passes its tests.
#
# `just msrv` is what keeps this from being a claim with nothing behind
# it, and it reads the floor out of this line rather than carrying a
# second copy.
rust-version = "1.95.0"
license.workspace = true
repository.workspace = true
# Turns the `idna` feature and the target into exactly one backend cfg.
# The target predicate lives there and in the `[target.…]` tables below,
# and nowhere else.
build = "build.rs"

# A leaf on purpose: no `hclient-core`, no `hclient-proto`, nothing else
# from this workspace. The whole point is that a build may take this crate
# INSTEAD of the Unicode tables, and a crate that dragged the rest of the
# client in with it could not be used that way.
# See the root Cargo.toml: `default` is near-empty here by design.
[package.metadata.docs.rs]
all-features = true

# The other half of leaving the shared version: `shared-version` takes a
# string, so a named group is a *subset* that versions together. This
# crate is a group of one.
[package.metadata.release]
shared-version = "hclient-idn"

[dependencies]
thiserror = { workspace = true }

# **`idna` is declared twice, and the pair is the whole feature design.**
# Optional here, so `--features idna` reaches every target; unconditional
# in the `[target.…]` table further down, so an ELF unix or a wasm build
# takes it whether the feature is on or not — there is no system UTS 46 to
# reach for on those, and `build.rs` picks `idna_backend` for them either
# way.
#
# The consequence worth knowing: on Windows and Android the feature is the
# only thing that pulls the Unicode tables in, and keeping them off those
# two is what this crate is for.
#
# `default-features = false` plus the two features named explicitly is
# copied from `hclient-proto`'s manifest for the reason it gives there: a
# future change to `idna`'s defaults must not silently change what is in
# this graph.
[dependencies.idna]
version = "1.1"
optional = true
default-features = false
features = ["std", "compiled_data"]

# The platform backends are target-scoped and **not optional**, which is
# what changed when three features became one. There is no longer a switch
# that could turn one off on the target that needs it: with `idna` on, the
# backend is `idna` everywhere and these sit unused in a Windows or
# Android graph, which costs a manifest line and no code.

# Windows: `icuuc.dll` is linked, not resolved, because its ICU is built
# with `U_DISABLE_RENAMING` and the exports are unsuffixed. `windows-sys`
# already declares `uidna_openUTS46`, `uidna_nameToASCII_UTF8`,
# `uidna_close`, `UIDNAInfo` and every `UIDNA_*` constant, GENERATED from
# Microsoft's Win32 metadata — so nothing is transcribed by hand on this
# platform and `src/icu/windows.rs` has no `extern` block at all.
#
# `windows-link` emits a `raw-dylib` import, resolved by the LINKER, not
# by `LoadLibrary` — no dynamic resolution happens anywhere in this crate.
#
# The cost, recorded because it is real: a load-time import means a
# Windows without `icuuc.dll` — 10 before 1703, and Server 2016, which is
# supported into 2027 — does not fall back to the tables, the process
# fails to start, with `STATUS_DLL_NOT_FOUND` and no mention of IDN. The
# floor is stated rather than degraded to, and nothing checks it at build
# time or at run time.
#
# **An ELF backend existed here and was deliberately removed.** It reached
# `libicuuc.so.NN` through `dlopen`, because both the soname and every
# symbol carry the ICU major version and there is nothing stable to link.
# What came back was whatever ICU that machine happens to carry, on a
# Unicode version nobody chose and nothing reports — and for IDN a Unicode
# difference is a different host. That is a correctness risk taken on for
# a size saving, on the one platform where the version is not ours to
# know. Linux takes the bundled tables instead.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Globalization"] }

# Android reaches UTS 46 through the JVM, because that is where Android
# keeps it: `android.icu.text.IDNA` is ICU4J, shipped with the platform
# since API 24, and the NDK exposes no C entry point for it. `jni` +
# `ndk-context` is the pair `hclient-proxy` takes to read the system proxy
# settings, for the same reason — the thing being read lives behind
# managed code.
#
# The alternative is the bundled tables, which is the ~1.9 MB of ICU data
# this crate exists to keep off a mobile target.
[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
ndk-context = "0.1"

# Everywhere else — Linux and the other ELF unixes, WASI, and Apple.
# Unconditional, unlike the optional declaration at the top of this file:
# these targets have no UTS 46 to reach for, so the bundled crate is the
# backend with the feature and without it.
#
# **Apple is in this row and had a backend of its own until it was
# measured.** Foundation is reached through `NSURL`, a URL parser: it does
# not case-fold ASCII and it does not validate an ACE label, so eight rows
# of the differential corpus came back as themselves. Closing that took a
# punycode decoder and a conversion sequence written here — a
# reimplementation of the thing this crate exists to avoid
# reimplementing. What it cost to stop is the honest number: 13 crates on
# `aarch64-apple-darwin` become 50, because the ICU tables arrive with
# `idna`. What it buys is that macOS answers what every other target
# answers, with nothing of ours between the caller and the oracle.
# Apple: Foundation, part of the OS and linked, so it meets the same
# "static, OS-versioned ABI" rule Windows does. It needs no `unsafe` at
# all — every `objc2-foundation` call is a safe function.
#
# **It is a URL parser and not a UTS 46 implementation**, which is the
# fact `src/ace.rs` exists for: `NSURL` converts an IDN host as a side
# effect of parsing, so it does not case-fold ASCII and does not validate
# an ACE label, and eight rows of the differential corpus came back as
# themselves the day nothing supplied those. The browser is reached the
# same way and needs one line of the same file; Apple needs all of it.
[target.'cfg(target_vendor = "apple")'.dependencies]
objc2-foundation = { version = "0.3", default-features = false, features = [
    "std",
    "NSString",
    "NSURL",
] }

# The browser, and only the browser. `URL` is the whole surface: the
# WHATWG URL Standard *defines* its host parsing as UTS 46 with named
# parameters, which is the difference between it and Foundation — that one
# converts as an undocumented side effect of parsing, this one is the
# standard saying so. Measured on the differential corpus in Firefox: 37
# of 38 rows answer what `idna` answers, against Foundation's 30 of 38.
#
# What it saves is the largest share this crate has anywhere, because in a
# browser build there is almost nothing else in the module: after the full
# `wasm-pack` pipeline, **17.4 KiB against 159.1 KiB** — 89%.
#
# One direction only, and that is the browser's limit rather than a
# shortcut: `URL.hostname` always hands back the A-label and there is no
# ToUnicode in any JS API, so `domain_to_unicode` answers
# `NoImplementation` here. A build that needs it turns on `idna`, which is
# what a forcing switch is for.
[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
web-sys = { version = "0.3", features = ["Url"] }

[target.'cfg(not(any(windows, target_vendor = "apple", target_os = "android", all(target_arch = "wasm32", target_os = "unknown"))))'.dependencies]
idna = { version = "1.1", default-features = false, features = [
    "std",
    "compiled_data",
] }

[dev-dependencies]
rstest = { workspace = true }

# **The oracle, and deliberately a dev-dependency** — the same role `url`
# plays for `hclient-proto`'s `tests/uri_resolution.rs`. The whole claim
# of this crate is that the platform agrees with `idna`, and that
# comparison has to be possible on the very targets where `idna` is NOT a
# normal dependency, which is every target that has a system UTS 46. As a
# dev-dependency it reaches no downstream build: `cargo tree -e normal`
# for this crate has no `idna` on Windows or Android, with the feature off,
# and the CI job checks exactly that.
idna = { version = "1.1", default-features = false, features = [
    "std",
    "compiled_data",
] }

# The browser corpus, `tests/web_corpus.rs` — the check the Apple backend
# never had: Foundation passed the acceptance probe and failed eight
# corpus rows, and nothing ran them. A backend reached through a URL
# parser is held to the whole corpus from the day it lands.
#
# **Last in the file on purpose.** A `[target.….dev-dependencies]` table
# ends `[dev-dependencies]`, so putting this above `idna` moved the oracle
# into the wasm-only table and took it off Windows and Android — where it
# is the only way the platform column can be compared at all. Caught by
# `cargo clippy --target x86_64-pc-windows-msvc`, which is the check that
# exists because those targets do not build here.
[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dev-dependencies]
wasm-bindgen-test = "0.3"

# **One feature, and it is off by default.** `idna` forces the bundled
# crate and its Unicode tables on every target; without it each platform
# answers from what it already carries, and only the ELF unixes and wasm
# fall back to `idna`, because there is nothing else there to ask.
#
# It is out of `default` for this workspace's own reason: Cargo unifies
# features across a graph, so a default here would be a **floor**, and one
# careless crate in a dependency tree would put the ICU tables into every
# Windows, Apple and Android build in it — the three platforms this crate
# was written to keep them off.
#
# It replaced `platform`/`bundled`/`system-icu`/`foundation`, four
# switches whose combinations could select two backends at once or none.
# One forcing switch is a total function from (feature, target) to a
# backend, which is why `build.rs` now emits exactly one cfg and
# `src/lib.rs` has no `compile_error!` left to carry.
[features]
default = []
idna = ["dep:idna"]

# NOT `[lints] workspace = true`, for the same reason `hclient-fetch`
# (amendment C7) and `hclient-dns-system` (amendment C8) are not: the
# workspace table sets `unsafe_code = "forbid"`, and `forbid` cannot be
# relaxed from inside a crate (`E0453`). This crate carries `unsafe` in
# `src/icu/windows.rs` (amendment C9) and in `src/android.rs` (amendment
# C19's shape, `JavaVM::from_raw`), which need `deny`, overridable by a
# scoped `#[allow]`, not `forbid`. See `docs/exceptions.md`.
#
# `missing_debug_implementations` and `unexpected_cfgs` are restated here
# because opting out of the workspace table drops them along with
# `unsafe_code`.
[lints.rust]
unsafe_code                   = "deny"
missing_debug_implementations = "warn"
unexpected_cfgs               = { level = "warn", check-cfg = [] }
