[package]
name = "hclient-rt-nal"
version = "0.1.0-alpha.3"
description = "hclient-rt's TcpConnect over embedded-nal-async, with Send inferred rather than proven"
keywords     = ["hclient", "embedded", "no-std", "embedded-nal", "transport"]
categories   = ["embedded", "network-programming", "asynchronous"]
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

# **Not published yet, and the reason is a dependency rather than this
# code.** The eight stacks this adapter exists to reach are `no_std`
# devices, and `http` 1.x still carries
# `compile_error!("`std` feature currently required")`, which every crate
# in this workspace inherits through `hclient-core`. So today it can be
# built and tested only against the `std` shims — which is enough to keep
# it honest and not enough to be worth a crates.io page promising reach it
# does not have. `hclient-rt-pair-check` is unpublished for a different
# reason and is the precedent for the mechanism.
#
# **What the crate is for**, and "enough to keep it honest" above is the
# whole of it rather than a consolation: this is a gate on the seam's
# *universality*, the way `hclient-rt-embassy` is the gate on its `!Send`
# case. `embedded-nal-async` shares none of this workspace's assumptions —
# no `std::net`, no reactor, `async fn` in trait rather than associated
# future types, its own error vocabulary, no half-close — so a
# `TcpConnect` still implementable over it is one that has not grown a
# dependency on how tokio happens to work. Delete it and the seam can
# drift towards one runtime with nothing failing.
#
# So it deliberately fails the usual test for a crate boundary — *does it
# hold a dependency a feature would otherwise spread* — and is kept
# anyway, the same exception `hclient-rt-embassy` and
# `hclient-rt-pair-check` are. `src/lib.rs` names the three properties
# gated and the test that dies when each stops holding.
publish = false

[dependencies]
hclient-rt         = { path = "../hclient-rt", version = "0.1.0" }
embedded-nal-async = "0.9"
embedded-io-async  = "0.7"
futures-io         = { version = "0.3", default-features = false, features = ["std"] }

[dev-dependencies]
static_assertions = { workspace = true }
futures-executor = { version = "0.3", default-features = false, features = ["std"] }

[lints]
workspace = true
