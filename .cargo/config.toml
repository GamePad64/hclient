# Раннер тестов под `wasm32-wasip2` (Task 16). Компилятор даёт бинарь
# компонента, но исполнить его умеет только настоящий хост `wasi:http` —
# `cargo test`/`cargo run` для этой цели без раннера собирают, но не
# запускают. `-S http` подключает `wasi:http` 0.3 (аутбаунд через реальные
# сокеты хоста) — без этого флага `wasip3::http::client::send` был бы
# недоступен гостю и падал бы на связывании импорта.
[target.wasm32-wasip2]
runner = "wasmtime run -S http --"
