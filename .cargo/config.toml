# Test runner for `wasm32-wasip2` (Task 16). The compiler produces a component
# binary, but only a real `wasi:http` host can execute it — without a runner,
# `cargo test`/`cargo run` for this target build but never run. `-S http`
# enables `wasi:http` 0.3 (outbound through the host's real sockets); without
# that flag `wasip3::http::client::send` would be unavailable to the guest and
# would fail at import linking.
[target.wasm32-wasip2]
runner = "wasmtime run -S http --"
