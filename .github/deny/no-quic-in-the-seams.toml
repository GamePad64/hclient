# The seams HTTP/3 needed must not become QUIC-shaped.
#
# Two claims, one config, applied per crate by `--manifest-path` in the
# `dependency-graph` job.
#
# `hclient-rt` gained `UdpBind`/`UdpDatagrams` for QUIC and declares
# `RecvMeta` and `EcnCodepoint` itself rather than re-exporting `quinn-udp`'s
# identical structs. That costs a field-for-field conversion in two places
# and buys this: a runtime seam that any UDP backend can implement —
# including one with no descriptor and therefore no `quinn-udp` — without a
# QUIC stack in its graph. The conversion is only worth its price while this
# holds, so it is checked rather than asserted.
#
# `hclient-tls` is **not** checked by this config, and the reason is worth
# knowing before someone adds it back. Its claim is the weaker and more
# useful one — *no QUIC unless the `quic` feature is asked for* — and
# `cargo deny` structurally cannot express it: it walks optional edges
# regardless of features, which is right for a supply-chain tool and wrong
# for a question about defaults. Measured: `--no-default-features` does not
# change its answer. `just graph-no-quic` makes that claim with
# `cargo tree`, in both directions.
#
# `exclude-dev`: this is a claim about what a consumer links. Both crates
# have QUIC in their dev-dependencies on purpose — that is where the tests
# that drive the seam live.
[graph]
exclude-dev = true

[advisories]
[licenses]
allow = ["MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-3-Clause", "ISC", "Unicode-3.0", "Unlicense", "Zlib", "CDLA-Permissive-2.0", "MPL-2.0"]

[bans]
deny = [
    { crate = "quinn", reason = "the seam is a UDP capability, not a QUIC one" },
    { crate = "quinn-proto", reason = "the seam is a UDP capability, not a QUIC one" },
    { crate = "quinn-udp", reason = "RecvMeta and EcnCodepoint are re-declared here precisely so this stays true" },
    { crate = "h3", reason = "nothing below the transport knows what HTTP/3 is" },
    { crate = "h3-quinn", reason = "nothing below the transport knows what HTTP/3 is" },
]
