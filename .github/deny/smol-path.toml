# What the smol path is allowed to carry.
#
# Absence of tokio is NOT achievable and never was: hyper depends on it
# unconditionally (AGENTS.md, "What's in the dependency graph"). What must
# hold is that the tokio present is the inert `sync` leaf — hyper's
# `upgrade::oneshot` — and not a reactor. `exact = true` is the whole
# check: it fails on a feature ARRIVING, which a deny-list of today's
# reactor features would not.
#
# This replaces forty lines of bash that parsed `cargo tree -f '{p} [{f}]'`
# and had to fail closed on three separate ways that format could shift.
[graph]
exclude-dev = true

[advisories]
[licenses]
allow = ["MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-3-Clause", "ISC", "Unicode-3.0", "Unlicense", "Zlib", "CDLA-Permissive-2.0", "MPL-2.0"]

[bans]
deny = [
    { crate = "async-compat", reason = "a shim for a foreign runtime; the smol path must not need one" },
]

[[bans.features]]
crate = "tokio"
exact = true
allow = ["default", "sync"]
