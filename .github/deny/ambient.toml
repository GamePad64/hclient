# The ambient builds — the browser and the wasi:http guest — must not carry
# the native HTTP stack. Both delegate the exchange to their host, so tokio,
# hyper or h2 appearing there means something reached across the Transport
# seam.
#
# Used with `--manifest-path` and `-t` per backend; see the `supply-chain`
# job. `exclude-dev` because this is a claim about what a consumer links,
# and the dev-dependencies here (test servers, the `url` oracle) are not.
[graph]
exclude-dev = true

[advisories]
[licenses]
allow = ["MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-3-Clause", "ISC", "Unicode-3.0", "Unlicense", "Zlib", "CDLA-Permissive-2.0", "MPL-2.0"]

[bans]
deny = [
    { crate = "tokio", reason = "the ambient transports have no socket of their own" },
    { crate = "hyper", reason = "the host performs the exchange, not us" },
    { crate = "h2",    reason = "the host performs the exchange, not us" },
]
