name: ci
on: [push, pull_request]

# Крейты появляются по ходу вертикали. Каждая проверка активируется, как только
# её крейт существует, и до тех пор ЯВНО печатает, что пропущена. Молчаливый
# зелёный чек опаснее красного: после опечатки в имени крейта он остаётся
# зелёным навсегда.

jobs:
  # Резолюция review (Task 16, fix round 2, находка 1): этот файл был
  # невалидным YAML с `68d91f3` (многострочное `echo "::error::…"` в
  # `sse-complexity-guard` переносилось на новую строку с нулевым отступом
  # внутри `run: |` — YAML block scalar завершается первой строкой с
  # отступом МЕНЬШЕ базового, так что парсер читал продолжение сообщения
  # как начало нового документа и падал с `ScannerError`). Следствие: ни
  # один job в этом файле не запускался вовсе — ни sans-io проверка, ни
  # `no-declared-send`, ни clippy-гейт, ни сканер сеттеров, ни guard
  # сложности, ни живой тест. Единственная проверка YAML была ручной, один
  # раз, при создании файла (Task 1) — и ни разу больше, ровно тот класс
  # дефекта "прогон один раз не защищает ничего, что напишут позже",
  # против которого вся эта вертикаль. Job внутри файла не может спасти
  # уже сломанный файл — но предотвращает СЛЕДУЮЩУЮ поломку, что и есть
  # реалистичный риск здесь. Локально: `python3 -c "import yaml;
  # yaml.safe_load(open('.github/workflows/ci.yml'))"` (тот же вызов, что
  # ниже) — стоит прогонять перед каждым коммитом, трогающим этот файл.
  workflow-yaml-is-valid:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - shell: bash
        run: |
          set -euo pipefail
          # `actions/runner-images`' ubuntu-latest обычно уже несёт PyYAML, но
          # не гарантированно — проверяем импортом и ставим только при
          # необходимости. `--break-system-packages`: PEP 668
          # ("externally-managed-environment") на некоторых образах
          # запрещает голый `pip install` в системный Python; для
          # одноразового CI-раннера это ровно тот случай, для которого флаг
          # существует.
          python3 -c "import yaml" 2>/dev/null || \
            python3 -m pip install --quiet --break-system-packages pyyaml || \
            python3 -m pip install --quiet pyyaml
          python3 - <<'PYEOF'
          import sys
          import yaml
          from pathlib import Path

          ok = True
          for path in sorted(Path(".github/workflows").glob("*.yml")):
              try:
                  yaml.safe_load(path.read_text(encoding="utf-8"))
                  print(f"{path}: valid YAML")
              except yaml.YAMLError as e:
                  print(f"::error file={path}::{path} is not valid YAML: {e}")
                  ok = False
          sys.exit(0 if ok else 1)
          PYEOF

  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - shell: bash
        run: |
          set -euo pipefail
          if [ -z "$(ls -A crates 2>/dev/null | grep -v '^.gitkeep$' || true)" ]; then
            echo "::notice::в workspace ещё нет крейтов — тесты пропущены"
            exit 0
          fi
          # `parsing_scales_linearly_not_quadratically` (sse/lines.rs) исключён
          # отсюда намеренно (Task 14, review round 1, Finding 4): этот job
          # гоняет `cargo test --workspace --all-features` целиком, и именно
          # это соседство — несколько тяжёлых тестовых процессов на одном
          # раннере одновременно — было измеренным источником флейка теста
          # сложности. У него свой job, `sse-complexity-guard` ниже, где он
          # не делит раннер ни с чем.
          #
          # У `--skip` здесь НЕТ отдельной проверки "нашёл ли он что пропустить":
          # непереименованный на этой стороне тест просто вернётся в общий прогон
          # и рискует флейком под нагрузкой (деградация, не слепая зона — тест
          # всё равно выполняется и рано или поздно поймает настоящую регрессию).
          # Симметричный дефект — на стороне `sse-complexity-guard`, где
          # несовпадение имени даёт ПОЛНОСТЬЮ немой зелёный джоб без единого
          # прогона теста — и именно там стоит проверка (Finding 1, review round
          # 2). Она красная останавливает мердж и вынуждает поправить оба места
          # разом, так что дублировать проверку здесь избыточно.
          cargo test --workspace --all-features -- --skip parsing_scales_linearly_not_quadratically

  # До этого джоба clippy нигде в CI не гонялся: каждая задача вертикали
  # запускала `cargo clippy --workspace --all-targets --all-features -- -D
  # warnings` вручную и рапортовала "чисто", но ничего не проверяло, что это
  # действительно происходит на каждый пуш — дисциплина держалась только на
  # соглашении (Task 15, review round 1, Finding 3). Тот же guard-паттерн,
  # что у `test`: печатает `::notice::` и выходит нулём, пока в workspace
  # нет ни одного крейта, вместо того чтобы быть тихо-зелёным по умолчанию.
  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { components: clippy }
      - shell: bash
        run: |
          set -euo pipefail
          if [ -z "$(ls -A crates 2>/dev/null | grep -v '^.gitkeep$' || true)" ]; then
            echo "::notice::в workspace ещё нет крейтов — clippy пропущен"
            exit 0
          fi
          cargo clippy --workspace --all-targets --all-features -- -D warnings

  # Изолированный запуск теста-регресса на квадратичность (`sse/lines.rs`).
  # Не часть `test` выше — см. комментарий у `--skip` там. `best-of-3`
  # внутри самого теста — вторичная защита от разового шума; первичная
  # защита — вот эта изоляция: собственный job, ничего больше не гоняется
  # параллельно на этом раннере. Подробное обоснование, включая измеренные
  # цифры (best-of-5 флеканул 25 раз из 25 под устойчивым overcommit,
  # single-sample — 9 из 25) — в doc-комментарии самого теста.
  sse-complexity-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - shell: bash
        run: |
          set -euo pipefail
          if [ ! -d crates/http-ng-proto ]; then
            echo "::notice::http-ng-proto ещё нет — проверка сложности пропущена"
            exit 0
          fi
          # `cargo test ... -- --exact NAME`, если NAME ни с чем не совпал,
          # выходит с кодом 0 и печатает "0 passed" — тот же класс дефекта,
          # что уже правился в Task 1 (`cargo tree | grep` и `grep -rn`,
          # молча зелёные при отсутствующем крейте). Переименование или
          # перенос теста дало бы здесь ПОЛНОСТЬЮ немой зелёный джоб — ноль
          # прогонов, ничего не проверено — если не проверить явно, что тест
          # реально нашёлся и выполнился (review round 2, Finding 1).
          out="$(cargo test -p http-ng-proto --all-features \
            sse::lines::tests::parsing_scales_linearly_not_quadratically -- --exact)"
          printf '%s\n' "$out"
          if ! printf '%s\n' "$out" | grep -qE '^test result: ok\. 1 passed;'; then
            echo "::error::sse-complexity-guard не запустил ровно один тест — похоже, parsing_scales_linearly_not_quadratically переименован или перемещён. Поправьте путь здесь И значение --skip в job'е test."
            exit 1
          fi

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85.0
      - shell: bash
        run: |
          set -euo pipefail
          pkgs=""
          for p in http-ng-proto http-ng-core http-ng; do
            if [ -d "crates/$p" ]; then pkgs="$pkgs -p $p"; fi
          done
          if [ -z "$pkgs" ]; then
            echo "::notice::крейтов ядра ещё нет — MSRV не проверяется"
            exit 0
          fi
          cargo check $pkgs --all-features

  wasip2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: wasm32-wasip2 }
      - shell: bash
        run: |
          set -euo pipefail
          if [ ! -d crates/http-ng-wasi ]; then
            echo "::notice::http-ng-wasi ещё нет — сборка под wasip2 пропущена"
            exit 0
          fi
          cargo check -p http-ng-wasi --target wasm32-wasip2
      # Резолюция review (Task 16, находка B-7): `tests/live_roundtrip.rs` —
      # единственная автоматическая защита свойства, ради которого
      # существует вся эта вертикаль (`Body::is_end_stream()` против
      # настоящего хоста), и раньше не гонялся ни в одном CI job'е вовсе.
      # При отсутствии `wasmtime` он печатал `::notice::` и молча возвращал
      # `ok` — зелёный `cargo test` в этом случае ничего не говорит о том,
      # была ли эта ветка вообще проверена; тот же класс вакуумной проверки,
      # что правился во всех остальных job'ах вертикали. `cargo install`, а
      # не готовый бинарь — тот же паттерн, что у `cargo-fuzz` в
      # `fuzz-smoke` ниже.
      - run: cargo install wasmtime-cli --locked
      - shell: bash
        run: |
          set -euo pipefail
          if [ ! -d crates/http-ng-wasi ]; then
            echo "::notice::http-ng-wasi ещё нет — живой прогон wasip2 пропущен"
            exit 0
          fi
          # Чистые юнит-тесты — реально исполняются под настоящим
          # `wasmtime` через раннер из `.cargo/config.toml`, не только
          # компилируются.
          cargo test -p http-ng-wasi --target wasm32-wasip2
          # `live_roundtrip`/`shape` — нативные (см. doc-комментарий
          # `tests/live_roundtrip.rs` про то, почему им нельзя быть
          # `wasm32-wasip2`-таргетом): сами поднимают мок-сервер и
          # запускают `wasmtime` подпроцессом. `CI` (GitHub Actions
          # выставляет её для каждого job'а сама) заставляет
          # `find_wasmtime()` внутри `live_roundtrip.rs` паниковать, если
          # `wasmtime` всё-таки не нашёлся, вместо того чтобы тихо
          # пропустить проверку — здесь он обязан найтись, раз только что
          # установлен шагом выше.
          cargo test -p http-ng-wasi --test live_roundtrip -- --test-threads=1
          cargo test -p http-ng-wasi --test shape

  # Task 16: `wasi:http` 0.3 возвращает `result<_, ...>` из сеттеров опций
  # запроса (`set_connect_timeout`, `set_method`, `set_scheme`, ...) именно
  # для того, чтобы хост мог отказать — предшественник этого крейта,
  # `wasi-fetch`, отбрасывал семь таких `Result` через `let _ =`. Черновик
  # задачи проверял это один раз, вручную, на этапе реализации — единственный
  # прогон не защищает ничего, что напишут позже. Тот же guard-паттерн, что у
  # остальных job'ов: `::notice::` и выход нулём, пока крейта нет.
  no-discarded-wasi-setters:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - shell: bash
        run: |
          set -euo pipefail
          if [ ! -d crates/http-ng-wasi/src ]; then
            echo "::notice::http-ng-wasi ещё нет — проверка отброшенных сеттеров пропущена"
            exit 0
          fi
          # Ревью (Task 16, находка B-4) нашло исходную grep-версию этой
          # проверки дефектной по двум независимым осям:
          #
          # 1. Построчный `grep` матчит `.set_x(...)` и способ отбросить его
          #    `Result` только если оба на ОДНОЙ строке. `cargo fmt` в этом
          #    workspace переносит длинный вызов сеттера на новую строку
          #    (`max_width = 100`) — `opts\n    .set_between_bytes_timeout(..)\n    .unwrap_or_default();`
          #    после форматирования сам форматтер, которым эта же CI и гейтит
          #    (`fmt`-джоб), делает нарушение невидимым для построчного
          #    поиска. Девять форм, засеянных ревью, доказали это на живом
          #    прогоне: три исходных ловились, шесть — нет, и первый же
          #    промах был не гипотетическим, а именно этим переносом.
          # 2. Список форм отброса был неполон: `.ok()`/`.unwrap_or_default()`
          #    — не единственные способы молча выбросить `Result`, не давая
          #    компилятору повода предупредить о `#[must_use]` (голый
          #    `foo.set_x(y);` без обёртки САМ не собрался бы под `-D
          #    warnings` — этот случай уже защищён обычной сборкой).
          #    `.unwrap_or(..)`, `.is_ok()`, `.is_err()`, `let _ident = ..`
          #    (не только буквально `let _ =`) и `drop(..)` — тоже.
          #
          # Оба исправлены переходом на Python: вместо построчного `grep`
          # склеиваем содержимое каждого файла (без комментариев — см. ниже)
          # в один нормализованный по пробелам поток, сохраняя для каждого
          # символа исходный номер строки — перенос rustfmt'а перестаёт быть
          # невидимым, а диагностика всё равно называет строку, где вызов
          # начался. Вызовы `.set_xxx(...)` находятся вручную подсчитанным
          # балансом скобок (обычный regex не умеет вложенные `Some(ns)`
          # внутри `set_connect_timeout(Some(ns))`), а следом за закрывающей
          # скобкой проверяется расширенный список форм отброса — на
          # нормализованном потоке, а не на исходных строках.
          #
          # Проверено на девяти засеянных нарушениях round 1 (три исходных
          # плюс перенос rustfmt для каждой) и на существующем дереве (`OK`,
          # без ложных срабатываний на `.map_err(..)?` — легитимном пути
          # honoring'а). Fix round 2 (находка 6) добавил ТРИ ещё незакрытые
          # формы, найденные повторным ревью, — предыдущая формулировка
          # "проверено на всех девяти" была неточной: сами девять форм round
          # 1 не покрывали всё пространство способов отбросить `Result`.
          # Закрыты: `if let Err(_e) = ..set_x(..) { }` (пустой блок под
          # if-let-цепочкой), голое `_ = ..set_x(..);` (destructuring
          # assignment без `let`), и `let _: Тип = ..set_x(..);` (аннотация
          # типа ломала регэксп `let _\w*\s*=`, ожидавший `=` сразу после
          # идентификатора). Ревью также отметило два НЕ прогнанных до
          # компилируемой формы: `/* .. */`-комментарий между вызовом и
          # `.ok()`, и `//` внутри строкового литера (`set_path_with_query`/
          # `set_authority` реально принимают строки — `"//foo"`,
          # `"http://x"` — вполне вероятны в реальном коде, так что это не
          # только гипотетический риск). Собственное тестирование фикстурой
          # для этого раунда подтвердило оба и заодно нашло третий дефект,
          # привнесённый уже ЭТИМ раундом: `?` после вызова (типичный
          # `let _x = opts.set_x(y).map_err(..)?;`) ложно ловился как
          # `let _ident = ..` — присваивается-то уже `()`, не `Result`,
          # ошибка честно пропагирована. Все пять (три из первого списка
          # плюс два из повторного) закрыты и заново проверены на
          # шестнадцати формах (двенадцать нарушений плюс четыре легитимных
          # — `?`-пропагация, `match` с реальной обработкой, переменная
          # `foo_`, строка с `//`, за которой идёт `?`, а не discard) в
          # изолированной фикстуре перед применением здесь — zero ложных
          # срабатываний ни в одну сторону.
          python3 - <<'PYEOF'
          import re, sys, pathlib

          ROOT = pathlib.Path("crates/http-ng-wasi/src")

          DISCARD_TAIL = re.compile(r'^\s*\.(ok|unwrap_or_default|is_ok|is_err)\s*\(\s*\)')
          DISCARD_TAIL_ARG = re.compile(r'^\s*\.unwrap_or\s*\(')
          # `(:[^=;{}]*)?` — необязательная аннотация типа между `_<ident>`
          # и `=` (`let _: Result<(), E> = ..`), иначе не матчилась.
          LET_UNDERSCORE = re.compile(r'\blet\s+_\w*\s*(:[^=;{}]*)?=\s*[^;{}]*$')
          DROP_CALL = re.compile(r'\bdrop\s*\([^;{}]*$')
          # Голое `_ = expr;` (destructuring assignment, не `let`). `\b`
          # перед `_` не даёт словить конец обычного идентификатора вроде
          # `foo_ = ..` (там между `o` и `_` нет границы слова — оба словные
          # символы); `(?!>)` не даёт словить `_ => ..` (match-рукав).
          BARE_UNDERSCORE_ASSIGN = re.compile(r'\b_\s*=(?!>)\s*[^;{}]*$')
          # `if let Err(_e) = ..` — в т.ч. внутри let-цепочки (`if let Some(x)
          # = y && let Err(_e) = ..`), где `if` не стоит вплотную перед `let
          # Err` — поэтому без `\bif\s+` в начале, ищем сам `let Err(_ident)
          # =` где угодно в préfix'е.
          IF_LET_ERR_UNDERSCORE = re.compile(r'\blet\s+Err\s*\(\s*_\w*\s*\)\s*=\s*[^;{}]*$')
          BLOCK_COMMENT = re.compile(r'/\*.*?\*/', re.DOTALL)

          def strip_block_comments(text):
              # Заменяет содержимое `/* .. */` пробелами, СОХРАНЯЯ переносы
              # строк внутри — номера строк для всего, что после, не
              # съезжают. Не умеет вложенные `/* /* */ */` (Rust это
              # разрешает) — соответствующая находка ревью осталась
              # незакрытой сознательно, редкий случай для этого файла.
              def repl(m):
                  return ''.join(c if c == '\n' else ' ' for c in m.group(0))
              return BLOCK_COMMENT.sub(repl, text)

          def strip_line_comment(line):
              # Наивный `line.split("//", 1)[0]` резал строку и по `//`
              # ВНУТРИ строкового литерала (`"http://x"`), пряча всё, что
              # шло дальше на той же строке, включая настоящий discard.
              # `set_path_with_query`/`set_authority` в этом крейте реально
              # принимают строки такого вида — не гипотетический риск.
              in_string = False
              i, n = 0, len(line)
              while i < n:
                  c = line[i]
                  if in_string:
                      if c == '\\' and i + 1 < n:
                          i += 2
                          continue
                      if c == '"':
                          in_string = False
                      i += 1
                      continue
                  if c == '"':
                      in_string = True
                      i += 1
                      continue
                  if c == '/' and i + 1 < n and line[i + 1] == '/':
                      return line[:i]
                  i += 1
              return line

          violations = []

          for path in sorted(ROOT.rglob("*.rs")):
              text = strip_block_comments(path.read_text())
              lines = text.splitlines()
              stream_chars = []
              char_line = []
              for lineno, line in enumerate(lines, start=1):
                  code = strip_line_comment(line)
                  for ch in code:
                      stream_chars.append(ch)
                      char_line.append(lineno)
                  stream_chars.append(' ')
                  char_line.append(lineno)
              stream = ''.join(stream_chars)

              for m in re.finditer(r'\.set_[a-z_]+\(', stream):
                  start = m.start()
                  depth = 0
                  i = m.end() - 1
                  end = None
                  while i < len(stream):
                      if stream[i] == '(':
                          depth += 1
                      elif stream[i] == ')':
                          depth -= 1
                          if depth == 0:
                              end = i
                              break
                      i += 1
                  if end is None:
                      continue
                  after = stream[end + 1:end + 60]
                  line_no = char_line[start]
                  snippet = re.sub(r'\s+', ' ', stream[start:end + 1]).strip()

                  if DISCARD_TAIL.match(after) or DISCARD_TAIL_ARG.match(after):
                      tail = re.sub(r'\s+', ' ', after[:30]).strip()
                      violations.append((path, line_no, f"{snippet}{tail}"))
                      continue

                  stmt_start = max(
                      stream.rfind(';', 0, start),
                      stream.rfind('{', 0, start),
                      stream.rfind('}', 0, start),
                  ) + 1
                  prefix = stream[stmt_start:start]

                  # `?` между вызовом и концом инструкции означает, что
                  # `Result` пропагируется наружу (возможно, после
                  # `.map_err(..)`), а не отбрасывается — `let _x =
                  # opts.set_authority(..).map_err(..)?;` присваивает `_x`
                  # уже значение `()`, а не `Result`. Без этой проверки
                  # каждый такой (легитимный, обычный в этом крейте) вызов
                  # ловился бы проверками ниже как ложный "нарушитель" —
                  # найдено и закрыто при собственном тестировании фикстурой
                  # для fix round 2, не входило в находки ревью.
                  stmt_end = stream.find(';', end)
                  if stmt_end == -1:
                      stmt_end = len(stream)
                  propagated = '?' in stream[end + 1:stmt_end]

                  if not propagated:
                      for pattern in (
                          LET_UNDERSCORE,
                          DROP_CALL,
                          BARE_UNDERSCORE_ASSIGN,
                          IF_LET_ERR_UNDERSCORE,
                      ):
                          if pattern.search(prefix):
                              p = re.sub(r'\s+', ' ', prefix).strip()
                              violations.append((path, line_no, f"{p[-40:]} {snippet}"))
                              break

          for path, line_no, snippet in violations:
              print(f"{path}:{line_no}: {snippet}")

          if violations:
              print(
                  "::error::найден отброшенный Result у сеттера wasi:http "
                  "(let _ / let _ident / let _: Тип / .ok() / .unwrap_or_default() / "
                  ".unwrap_or(..) / .is_ok() / .is_err() / drop(..) / голое `_ = ..` / "
                  "`if let Err(_e) = ..` с пустым блоком — в одну строку или через перенос "
                  "rustfmt) — каждый отказ хоста обязан стать типизированной Error, "
                  "см. crates/http-ng-wasi/src/convert.rs"
              )
              sys.exit(1)
          PYEOF

  fuzz-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - run: cargo install cargo-fuzz --locked
      - run: cargo fuzz run sse -- -max_total_time=60
        working-directory: crates/http-ng-proto/fuzz
      - run: cargo fuzz run sse_accounting -- -max_total_time=30 -max_len=256
        working-directory: crates/http-ng-proto/fuzz

  # ── инварианты из спеки ───────────────────────────────────────────────
  proto-is-sans-io:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: no async deps in http-ng-proto
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -d crates/http-ng-proto ]; then
            echo "::notice::http-ng-proto ещё нет — проверка пропущена"
            exit 0
          fi
          tree="$(cargo tree -p http-ng-proto -e normal --prefix none)"
          if printf '%s\n' "$tree" | grep -Ei '^(tokio|futures-|async-|smol|compio)'; then
            echo "::error::http-ng-proto подцепил async-зависимость"
            exit 1
          fi
      - name: no async fn in http-ng-proto
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -d crates/http-ng-proto/src ]; then
            echo "::notice::http-ng-proto ещё нет — проверка пропущена"
            exit 0
          fi
          if grep -rn "async fn" crates/http-ng-proto/src \
               | grep -vE '^[^:]+:[0-9]+:[[:space:]]*(//|/\*|\*)'; then
            echo "::error::sans-io крейт содержит async fn"
            exit 1
          fi

  no-declared-send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: no Send/Sync bounds declared in core surface
        shell: bash
        run: |
          set -euo pipefail
          # `http-ng-wasi/src` в списке с Task 15 (review round 1, Finding 4):
          # инвариант защищает потребителей от бондов Send/Sync, которые их
          # ограничивают, а транспорт способен утечь такой же бонд в своём
          # публичном API не хуже ядра — было выбором никого не сканировать
          # его, а не осознанным решением, что он не в области действия.
          # Маркер `send-bound-exception` по-прежнему разрешает обоснованные
          # исключения, так что расширение охвата ничего не стоит там, где
          # бонд оправдан.
          dirs=""
          for d in crates/http-ng-core/src crates/http-ng/src crates/http-ng-wasi/src; do
            if [ -d "$d" ]; then dirs="$dirs $d"; fi
          done
          if [ -z "$dirs" ]; then
            echo "::notice::крейтов ядра ещё нет — проверка пропущена"
            exit 0
          fi
          # Ищем ОБЪЯВЛЕННЫЕ бонды, а не упоминания в доках: строки, у которых
          # содержимое начинается с комментария, отбрасываются вторым grep.
          #
          # Третий grep вычитает строки с маркером `send-bound-exception` —
          # ПОСТРОЧНОЕ, а не файловое исключение. До Task 12 fix round 1 этот
          # список был файловым (`! -path .../error.rs` и `.../body.rs`):
          # ревью нашло, что это слепая зона на весь файл — например,
          # `trait FakeSeamTrait: Send + Sync {}`, вставленный куда угодно в
          # такой файл, проходил бы CI незамеченным, и `client.rs` был
          # третьим таким файлом ещё до того, как Task 13 начал его менять
          # дальше. Маркер сужает исключение до конкретной строки: только она
          # пропускается, весь остальной текст файла (включая новый код,
          # который допишут поздние задачи) по-прежнему сканируется.
          #
          # Маркер — это ЗАЯВКА, а не способ заглушить проверку: каждая
          # маркированная строка обязана называть поправку (C1 или C2, Latin
          # C) из `docs/superpowers/specs/2026-08-05-http-ng-design.md`,
          # которая её оправдывает.
          #
          # ПРАВИЛО, а не список конкретных строк (Task 13 fix round 2):
          # всякая обобщённая функция, которая заворачивает чужую ошибку в
          # `Error::new` — а значит требует `Send + Sync` от неё, потому что
          # `Error` хранит источник как `Arc<dyn Error + Send + Sync>` — обязана
          # повторить этот бонд в своей собственной where-клаузе: Rust не
          # пробрасывает бонды через вызов. Число маркеров растёт не построчно
          # с ростом крейта, а вместе с числом НЕЗАВИСИМЫХ таких цепочек
          # вызова; сегодня их четыре: `Client::execute` (client.rs),
          # `Response::chunk`+`collect`, разделяющие один бонд (response.rs),
          # `RequestBuilder::send`, который зовёт `Client::execute` и обязан
          # повторить её бонд (request.rs), и `SseStream::next` (Task 14,
          # sse.rs), который зовёт `Response::chunk` и по той же причине обязан
          # повторить её бонд — плюс два исходных места вне этой цепочки:
          # `http-ng-core/src/error.rs` (поле `source` и бонд `Error::new`
          # самого типа) и `http-ng-core/src/body.rs` (`RewindFactory`,
          # `Streaming`-вариант и бонд `rewindable` — C2, про то же стирание
          # auto-traits, но в объектах-трейтах `RequestBody`, а не в
          # `Error::new`). Список конкретных строк дважды переписывался вручную
          # вслед за счётом (5→6→8) и настолько же легко разойдётся снова;
          # проверяйте правило, а не пересчитывайте маркеры.
          #
          # Ревью Task 13 разобрало и отвергло две альтернативы этому правилу:
          # (1) общий хелпер-обёртка для `Error::new` — не помогает, компилятор
          # всё равно требует бонд в точке вызова хелпера, чистый +1 маркер без
          # выигрыша; (2) поднять бонд на весь `impl`-блок `Client<T>` —
          # компилируется, но ломает `Client::builder`, `.get`, `.transport`,
          # `.config` для транспорта с честно `!Send` ошибкой — регресс именно
          # того свойства, ради которого бонды живут в отдельных
          # where-клаузах, а не в трейте. Трейт-алиас, прячущий бонд от grep
          # (`MaybeSend`-подобная обёртка), был бы не сужением исключения, а
          # его сокрытием — дизайн прямо отвергает этот приём.
          #
          # Новый маркер без соответствующей поправки в спеке — повод для
          # ревью, а не для зелёного CI. Сам фильтр маркера тоже сузили
          # (Task 13 fix round 1): раньше `grep -v 'send-bound-exception'`
          # пропускал ЛЮБУЮ строку, содержащую эту подстроку — включая маркер
          # с выдуманным обоснованием. Теперь строка обязана содержать
          # `send-bound-exception:` и реальную ссылку на поправку C1 или C2.
          #
          # Round 2 латинизировал сам токен поправки (`C1`/`C2`, было
          # `С1`/`С2`): кириллическая `С` (U+0421) неотличима на глаз от
          # латинской `C`, из-за чего ASCII-поиск вроде `grep -rn
          # "amendment-C1" .` не находил ни маркер, ни заголовок в спеке,
          # который его оправдывает — ревьюер, добросовестно искавший
          # поправку С1, её не нашёл и корректно репортовал исключение как
          # необоснованное. Это не закрывает дыру полностью (выдумать можно и
          # «amendment-C1»), но поднимает планку выше «любая строка» и делает
          # каждую заявку находимой обычным ASCII-поиском по двум
          # существующим сегодня поправкам.
          if grep -rnE '(:|\+)[[:space:]]*(Send|Sync)\b|MaybeSend' $dirs \
               | grep -vE '^[^:]+:[0-9]+:[[:space:]]*(//|/\*|\*)' \
               | grep -vE 'send-bound-exception:[[:space:]]*amendment-C[12]\b'; then
            echo "::error::в ядре объявлен бонд Send или Sync без маркера send-bound-exception"
            exit 1
          fi
