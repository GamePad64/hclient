name: ci
on: [push, pull_request]

# What each job guarantees, and the trap it defends against, is in
# docs/ci.md. What each job RUNS is in the justfile, and that is not a
# convention — `scripts/ci-mirrors-just.py` fails this build if any `run:`
# below is something other than a call to a recipe that exists there.
#
# So the division is: a job carries a matrix, a runner OS, a toolchain, a
# cache, an `env:` and an `if:`. It does not carry a decision. Every flag,
# filterset, threshold and grep-over-output lives in a recipe, where it can
# be run before pushing rather than discovered afterwards.
#
# The two rules that bind the whole arrangement are still docs/ci.md's:
# fail closed, and a check must be able to fail. Two mistakes have each cost
# a red run and will again — greping output without `--color never` (ANSI
# escapes break `^` anchors), and capturing output into a variable under
# `set -e` without `|| rc=$?` (the step aborts before anything is printed).
# Both now live in the recipes.

jobs:
  test:
    strategy:
      # A platform-specific failure must not hide the other two: Windows
      # twice reported red having run nothing, cancelled mid-download.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: moonrepo/setup-rust@v1
        with:
          channel: stable
          bins: cargo-nextest,just
      # The socket-option tests need a loopback source IP distinct from the
      # default route; only Linux and Windows make all of 127.0.0.0/8
      # loopback. See docs/ci.md.
      - name: give macOS a second loopback address
        if: runner.os == 'macOS'
        shell: bash
        run: just macos-loopback
      # `http-ng-rt-embassy`'s live scenarios drive a real embassy-net stack
      # over a TAP device and are the only thing proving the W1 cancellation
      # contract holds there. Without the marker they SKIP — quietly, which
      # is what this file exists to prevent. Its own step, Linux only, so a
      # runner that has lost `/dev/net/tun` or unprivileged user namespaces
      # goes red HERE with a name that says so, rather than reddening the
      # whole matrix or passing while testing nothing.
      - name: the embassy tuntap scenarios run, rather than skip
        if: runner.os == 'Linux'
        shell: bash
        env:
          HTTP_NG_REQUIRE_TUNTAP: "1"
        run: just test-embassy-live
      - shell: bash
        run: just test-workspace
      # nextest cannot run doctests. Until v0.4 nothing did: the recipe
      # existed and no job called it, so a broken example sat in
      # `http-ng-h3` compiling only under feature unification.
      - name: the doctests, which nextest cannot run
        shell: bash
        run: just test-doc

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: moonrepo/setup-rust@v1
        with:
          channel: stable
          components: rustfmt,clippy
          bins: just
      - run: just fmt-check
      - run: just lint

  sse-complexity-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: moonrepo/setup-rust@v1
        with:
          channel: stable
          bins: cargo-nextest,just
      - shell: bash
        run: just test-sse-complexity

  # An undefined symbol reachable only from dead code is invisible on the
  # Linux runner and on macOS: `ld --gc-sections` and `ld64`'s dead-strip
  # both drop the reference before anything has to resolve it, while MSVC's
  # `link.exe` resolves first and only then runs `/OPT:REF`. That asymmetry
  # cost this repository a windows-only
  # `LNK2019: unresolved external symbol __embassy_time_queue_item_from_waker`
  # in `http-ng-rt-embassy`'s `lib test`, which no amount of green Linux and
  # macOS could have found.
  #
  # This job puts the strict linker's rule on the cheap runner. Which flags,
  # which feature sets and why both of them is in the recipe.
  #
  # Scoped to this crate, deliberately: it is the one whose dependencies
  # bind to symbols by name across crate boundaries (`embassy-time-driver`,
  # `embassy-executor-timer-queue`, `critical-section` — three separate
  # `#[no_mangle]` contracts), which is the arrangement that produces this
  # class of defect at all.
  embassy-tests-link-under-a-strict-linker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: moonrepo/setup-rust@v1
        with:
          channel: stable
          bins: just
      - shell: bash
        run: just embassy-strict-link

  wasip2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: moonrepo/setup-rust@v1
        with:
          channel: stable
          targets: wasm32-wasip2
          # `wasmtime-cli` is required, not optional: a test inside
          # live_roundtrip.rs reads this file and asserts this `bins:` line
          # still installs it.
          bins: cargo-nextest,wasmtime-cli,just
      - run: just build-wasi-example
      - shell: bash
        env:
          # Turns "wasmtime not found, skipping" into a failure. Set here and
          # only here — this is the job that promises to install it.
          HTTP_NG_REQUIRE_WASMTIME: "1"
        run: just test-wasi

  browser:
    strategy:
      # Engine-specific behaviour is the point of running both, so a Chrome
      # failure must not cancel Firefox.
      fail-fast: false
      matrix:
        browser: [chrome, firefox]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: moonrepo/setup-rust@v1
        with:
          channel: stable
          targets: wasm32-unknown-unknown
          bins: wasm-pack,just
      - name: browser tests
        shell: bash
        env:
          # Same shape as HTTP_NG_REQUIRE_WASMTIME, and set only here: this
          # is the job that installs wasm-pack, so here a missing one is a
          # broken runner rather than a laptop without a headless browser.
          HTTP_NG_REQUIRE_BROWSERS: "1"
        run: just test-browser ${{ matrix.browser }}

  # Every fixture in `crates/http-ng-ws-tungstenite/tests/websocket.rs` was
  # written beside the implementation it observes, which is the arrangement
  # in which a fixture agrees with a bug. This job is the external oracle:
  # `crossbario/autobahn-testsuite` in `fuzzingserver` mode, 517 client
  # cases nobody in this repository wrote, and a parser that fails closed
  # on a report with no cases in it.
  #
  # Its own job rather than a step in `test`, for the reason the embassy
  # tuntap step has one: a runner that has lost Docker must go red HERE,
  # with a name that says so, instead of reddening a matrix leg or —
  # worse — skipping quietly. Ubuntu only, because that is where the
  # GitHub image ships a Docker daemon.
  #
  # About 20 seconds, container start included, so it belongs on every
  # push rather than on a schedule.
  autobahn:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: moonrepo/setup-rust@v1
        with:
          channel: stable
          bins: just
      - name: the WebSocket client against the Autobahn TestSuite
        shell: bash
        env:
          # Same shape as HTTP_NG_REQUIRE_WASMTIME, and set only here:
          # this is the job that promises a Docker daemon, so here a
          # missing one is a broken runner rather than a laptop.
          HTTP_NG_REQUIRE_DOCKER: "1"
        run: just test-autobahn

  fuzz-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: moonrepo/setup-rust@v1
        with:
          channel: nightly
          bins: cargo-fuzz,just
      - shell: bash
        env:
          # `rust-toolchain.toml` pins stable and outranks the installed
          # channel; the sanitizer flags cargo-fuzz needs exist only on
          # nightly. The recipe sets RUSTUP_TOOLCHAIN and asserts it took
          # effect; this marker is what turns "no nightly here" from a skip
          # into a failure, in the job that installed one.
          HTTP_NG_REQUIRE_NIGHTLY: "1"
        run: just fuzz-smoke

  idn-feature-is-real:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: moonrepo/setup-rust@v1
        with:
          channel: stable
          components: clippy
          bins: cargo-nextest,just
      - name: url is gone, with the feature either way
        shell: bash
        run: just graph-no-url
      - name: without idn there is no IDN implementation, with it there is
        shell: bash
        run: just graph-idn-feature
      - name: the feature-off path is compiled and run, not merely declared
        shell: bash
        run: just test-no-default

  # The whole claim of `http-ng-idn` is that the platform's ICU answers
  # what the bundled `idna` crate answers.
  #
  # **Two targets have a platform backend, and Linux is not one of them.**
  # The rule is "static linkage against an ABI the OS versions for us":
  # Windows' `icuuc.dll` through `windows-sys`, and Apple's Foundation
  # through `objc2-foundation`. The ELF `dlopen` backend was removed — on
  # Linux the ICU version is a property of the user's machine that nobody
  # chose and nothing reports, and for IDN a Unicode difference is a
  # different host — so Linux and wasm take the bundled tables.
  #
  # The platform column of `tests/differential.rs` does not compile at all
  # where there is no platform backend, which is why
  # `HTTP_NG_IDN_REQUIRE_PLATFORM` is set on Windows and macOS only:
  # asking for it on Linux would demand a test that is not there.
  #
  # The Linux leg is not decoration. It checks the opposite invariant —
  # that a target with no platform backend really does get the bundled
  # tables and links neither `windows-sys` nor `objc2-foundation` — which
  # is the half that breaks silently if the target predicate in `build.rs`
  # and the ones in `Cargo.toml` ever drift apart. Both halves are one
  # recipe, `graph-idn-backend`, which branches on the OS itself.
  idn-platform-agrees-with-idna:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: moonrepo/setup-rust@v1
        with:
          channel: stable
          components: clippy
          bins: cargo-nextest,just
      - name: the differential corpus, platform column required where there is one
        shell: bash
        env:
          # Empty on Linux, so the guard test — which does not exist there
          # — is not asked for. `env:` cannot be conditional, so the value
          # is, and the test reads presence, not truth.
          HTTP_NG_IDN_REQUIRE_PLATFORM: ${{ runner.os != 'Linux' && '1' || '' }}
        run: just test-idn
      - name: the Unicode tables come from the platform, or from idna
        shell: bash
        run: just graph-idn-backend
      - name: clippy on both feature settings
        shell: bash
        run: just lint-idn

  portable-example-three-targets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: moonrepo/setup-rust@v1
        with:
          channel: stable
          targets: wasm32-wasip2,wasm32-unknown-unknown
          bins: just
      # Three green builds alone would also be green for an example that
      # branched per target; `invariants` checks it contains no #[cfg].
      - shell: bash
        run: just build-three-targets

  fetch-must-fail-under-wasm-threads:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: moonrepo/setup-rust@v1
        with:
          channel: nightly
          targets: wasm32-unknown-unknown
          components: rust-src
          bins: just
      - name: the unsafe Send must be rejected when atomics are on
        shell: bash
        env:
          # As in `fuzz-smoke`: `rust-toolchain.toml` pins stable, and
          # `-Z build-std` needs nightly.
          HTTP_NG_REQUIRE_NIGHTLY: "1"
        run: just fetch-must-fail-under-atomics

  # Text scans. No build — six checks' worth of runner setup collapsed into
  # one; a failed step is named in the UI just as a failed job was. The
  # toolchain here is only what `bins:` needs to fetch `just` and
  # `ast-grep`; nothing in this job compiles anything.
  invariants:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: moonrepo/setup-rust@v1
        with:
          channel: stable
          bins: just,ast-grep
      # `actionlint`, the official image, rather than a hand-written
      # validator. It catches the class that once made Actions reject this
      # whole file — a step carrying both `uses:` and `run:` — with a line
      # number and a message, and it runs shellcheck over the `run:`
      # blocks, which nothing did before. Verified by mutation: reinstating
      # the merged step is reported at the exact line.
      - uses: docker://rhysd/actionlint:1.7.12
      # ast-grep, its own corpus tests, and a fail-closed check that every
      # rule's `files:` glob still matches something. Three hand-written
      # source scanners retired into rules; see scripts/ast-grep/rules.
      - name: the ast-grep rules, and the corpus they were accepted against
        run: just ast-grep
      - name: no Send/Sync bounds declared in the core surface
        run: just no-send-or-sync
      - name: unsafe_code stays forbidden by declaration
        run: just unsafe-policy
      - name: "every `run:` in this file is a call to a recipe that exists"
        run: just ci-mirrors-just

  # `cargo tree` and `cargo deny` — resolution, no compilation. `--target`
  # needs no installed toolchain, which is why the three-triple check costs
  # one runner rather than three.
  dependency-graph:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: moonrepo/setup-rust@v1
        with:
          channel: stable
          bins: cargo-deny,cargo-hack,just
      # Supply chain: RUSTSEC advisories, licence policy and source policy.
      # `deny.toml` carries the policy and its reasoning.
      - run: just supply-chain
      # The graph invariants this project actually promises. `cargo deny`
      # rather than `cargo tree | grep` wherever it can express the claim:
      # see docs/ci.md for the two it cannot.
      - name: the ambient builds contain no tokio, hyper or h2
        shell: bash
        run: just tree-ambient
      - name: the runtime and TLS seams contain no QUIC
        shell: bash
        run: just graph-no-quic
      - name: and the udp feature really does pull it
        shell: bash
        run: just graph-udp-pulls-quic
      - name: the WebSocket framing stays out of the transport
        shell: bash
        run: just graph-no-framing-in-the-transport
      - name: the smol path carries no reactor, only hyper's inert tokio leaf
        shell: bash
        run: just graph-smol-path
      - name: every feature combination compiles
        shell: bash
        run: just features
      - name: the default http-ng build carries no cookie jar
        shell: bash
        run: just graph-no-cookie-jar
      - name: http-ng-proto pulls in no async runtime, on any target
        shell: bash
        run: just graph-proto-sans-io
