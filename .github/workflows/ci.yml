name: ci
on: [push, pull_request]

# What each job guarantees, and the trap it defends against, is in
# docs/ci.md. Two rules bind everything here:
#
#   1. Fail closed. A check whose crate or file is missing goes red; it does
#      not skip. A silently green check stays green forever after a typo.
#   2. A check must be able to fail. Break it on purpose once before you
#      trust it.
#
# Two mistakes have each cost a red run and will again: greping output
# without `--color never` (ANSI escapes break `^` anchors), and capturing
# output into a variable under `set -e` without `|| rc=$?` (the step aborts
# before anything is printed).

jobs:
  test:
    strategy:
      # A platform-specific failure must not hide the other two: Windows
      # twice reported red having run nothing, cancelled mid-download.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: moonrepo/setup-rust@v1
        with:
          channel: stable
          bins: cargo-nextest
      # The socket-option tests need a loopback source IP distinct from the
      # default route; only Linux and Windows make all of 127.0.0.0/8
      # loopback. They degrade to a weaker assertion without it, so the bind
      # probe is what keeps CI on the strong one. See docs/ci.md.
      - name: give macOS a second loopback address
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          sudo ifconfig lo0 alias 127.0.0.2 up
          python3 - <<'PY'
          import socket, sys
          s = socket.socket()
          try:
              s.bind(("127.0.0.2", 0))
          except OSError as e:
              sys.exit(f"::error::127.0.0.2 is still not bindable after `ifconfig lo0 alias`: {e}")
          PY
      # `http-ng-rt-embassy`'s live scenarios drive a real embassy-net stack
      # over a TAP device and are the only thing proving the W1 cancellation
      # contract holds there. Without the marker they SKIP — quietly, which
      # is what this file exists to prevent. Its own step, Linux only, so a
      # runner that has lost `/dev/net/tun` or unprivileged user namespaces
      # goes red HERE with a name that says so, rather than reddening the
      # whole matrix or passing while testing nothing.
      - name: the embassy tuntap scenarios run, rather than skip
        if: runner.os == 'Linux'
        shell: bash
        env:
          HTTP_NG_REQUIRE_TUNTAP: "1"
        run: |
          set -euo pipefail
          # Measured on this runner: `unshare -Ur --net` fails, and the
          # marker turned that into a red job instead of nine silent skips —
          # which is what the marker is for. The cause is ubuntu-24.04's
          # AppArmor restriction on unprivileged user namespaces, and it is
          # lifted the documented way. `|| true`: if a future image drops
          # the knob, the run below is what reports it, with the test's own
          # message, rather than this line failing with a sysctl error.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          unshare -Ur --net true || {
            echo "::error::unprivileged user namespaces are still unavailable after lifting the AppArmor restriction — the embassy live scenarios cannot run on this image. Do not paper over this by dropping HTTP_NG_REQUIRE_TUNTAP: that returns nine silent skips."
            exit 1
          }
          cargo nextest run -p http-ng-rt-embassy --all-features --color never
      - shell: bash
        run: |
          set -euo pipefail
          # `parsing_scales_linearly_not_quadratically` runs alone in
          # `sse-complexity-guard`; sharing a runner is what made it flake.
          rc=0
          out="$(cargo nextest run --workspace --all-features --color never --no-fail-fast \
            -E 'not test(parsing_scales_linearly_not_quadratically)' 2>&1)" || rc=$?
          printf '%s\n' "$out"
          [ "$rc" -eq 0 ] || exit "$rc"
          if ! printf '%s\n' "$out" | grep -qE '[0-9]+ tests? run:'; then
            echo "::error::nextest printed no Summary — the workspace test run did not happen"
            exit 1
          fi

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: moonrepo/setup-rust@v1
        with:
          channel: stable
          components: rustfmt,clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  sse-complexity-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: moonrepo/setup-rust@v1
        with:
          channel: stable
          bins: cargo-nextest
      - shell: bash
        run: |
          set -euo pipefail
          rc=0
          out="$(cargo nextest run -p http-ng-proto --all-features --color never \
            -E 'test(=sse::lines::tests::parsing_scales_linearly_not_quadratically)' 2>&1)" || rc=$?
          printf '%s\n' "$out"
          [ "$rc" -eq 0 ] || exit "$rc"
          # EXACTLY one: this job exists so the test runs alone on a runner,
          # and "at least one ran" would not say that.
          if ! printf '%s\n' "$out" | grep -qE '1 test run: 1 passed'; then
            echo "::error::sse-complexity-guard did not run exactly one test — parsing_scales_linearly_not_quadratically was renamed or moved. Fix it here AND in the `test` job's filterset."
            exit 1
          fi

  # An undefined symbol reachable only from dead code is invisible on the
  # Linux runner and on macOS: `ld --gc-sections` and `ld64`'s dead-strip
  # both drop the reference before anything has to resolve it, while MSVC's
  # `link.exe` resolves first and only then runs `/OPT:REF`. That asymmetry
  # cost this repository a windows-only
  # `LNK2019: unresolved external symbol __embassy_time_queue_item_from_waker`
  # in `http-ng-rt-embassy`'s `lib test`, which no amount of green Linux and
  # macOS could have found.
  #
  # `--no-gc-sections` puts the strict linker's rule on the cheap runner. It
  # reproduced that exact symbol, named from the exact function Windows
  # named, which is this job's "break it on purpose once" — revert the
  # `use embassy_executor as _` in `crates/http-ng-rt-embassy/src/lib.rs`
  # and it goes red here.
  #
  # **BOTH feature sets, and that is not symmetry for its own sake.** The
  # first version of this job ran `--all-features` alone and passed while a
  # second defect of the same kind sat next to it: the default build had no
  # `critical-section` implementation either, and `_critical_section_1_0_
  # acquire` was undefined there. Neither feature set supplied one — the
  # difference was only which archive members the link happened to need, so
  # `--all-features` alone was a green check over a red configuration. The
  # default build is not hypothetical: `idn-feature-is-real` runs
  # `cargo nextest run -p http-ng-rt-embassy` with no features, because
  # `an_address_family_left_out_of_the_build_is_a_typed_error` lives under
  # `#[cfg(not(feature = "proto-ipv6"))]` and cannot compile with them on.
  #
  # All test targets, not `--lib`: `tests/tuntap.rs` links here too now that
  # the implementation is supplied rather than discarded.
  #
  # Scoped to this crate, deliberately: it is the one whose dependencies
  # bind to symbols by name across crate boundaries (`embassy-time-driver`,
  # `embassy-executor-timer-queue`, `critical-section` — three separate
  # `#[no_mangle]` contracts), which is the arrangement that produces this
  # class of defect at all.
  embassy-tests-link-under-a-strict-linker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: moonrepo/setup-rust@v1
        with:
          channel: stable
      - shell: bash
        env:
          RUSTFLAGS: "-C link-arg=-Wl,--no-gc-sections"
        run: |
          set -euo pipefail
          # "" is the default build, and it is the one that was broken while
          # the --all-features leg was green. Keep both.
          for features in "" "--all-features"; do
            rc=0
            out="$(cargo test -p http-ng-rt-embassy $features --no-run \
              --color never 2>&1)" || rc=$?
            printf '%s\n' "$out"
            if [ "$rc" -ne 0 ]; then
              echo "::error::http-ng-rt-embassy's tests do not link with --no-gc-sections for [${features:-default features}]. An undefined symbol above is a Windows LNK2019 waiting to happen: see the embassy_executor note in crates/http-ng-rt-embassy/src/lib.rs and the critical-section note in its Cargo.toml. Do not silence this by dropping the flag or a feature set."
              exit 1
            fi
            # Fail closed, per binary. A renamed package, a renamed test
            # file, or a cargo that stopped building one of the targets
            # would otherwise leave a job green forever while linking less
            # than it claims.
            for exe in 'Executable unittests src/lib.rs' 'Executable tests/tuntap.rs'; do
              if ! printf '%s\n' "$out" | grep -qF "$exe"; then
                echo "::error::cargo reported no '$exe' for [${features:-default features}] — this job linked less than it claims to check"
                exit 1
              fi
            done
          done

  wasip2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: moonrepo/setup-rust@v1
        with:
          channel: stable
          targets: wasm32-wasip2
          # `wasmtime-cli` is required, not optional: a test inside
          # live_roundtrip.rs reads this file and asserts this `bins:` line
          # still installs it.
          bins: cargo-nextest,wasmtime-cli
      - run: cargo build -p http-ng-wasi --example fetch --target wasm32-wasip2
      - shell: bash
        env:
          # Turns "wasmtime not found, skipping" into a panic. Set here and
          # only here — this is the job that promises to install it.
          HTTP_NG_REQUIRE_WASMTIME: "1"
        run: |
          set -euo pipefail
          # Runs under a real wasmtime host via the runner in .cargo/config.toml.
          cargo nextest run -p http-ng-wasi --target wasm32-wasip2
          # live_roundtrip/shape are native: they spin up a mock server and
          # launch wasmtime as a subprocess. `--no-capture` is FOR the grep
          # below — nextest replays a test's output only on failure, so a
          # passing skipped test would print nothing and the check would be
          # vacuous.
          rc=0
          out="$(cargo nextest run -p http-ng-wasi --test live_roundtrip \
            --color never --no-capture 2>&1)" || rc=$?
          printf '%s\n' "$out"
          [ "$rc" -eq 0 ] || exit "$rc"
          if printf '%s\n' "$out" | grep -q 'NOTICE: `wasmtime` not found'; then
            echo "::error::the live wasip2 run skipped the tests instead of executing them — HTTP_NG_REQUIRE_WASMTIME did not reach the test, or wasmtime is not on PATH"
            exit 1
          fi
          cargo nextest run -p http-ng-wasi --test shape

  browser:
    strategy:
      # Engine-specific behaviour is the point of running both, so a Chrome
      # failure must not cancel Firefox.
      fail-fast: false
      matrix:
        browser: [chrome, firefox]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: moonrepo/setup-rust@v1
        with:
          channel: stable
          targets: wasm32-unknown-unknown
          bins: wasm-pack
      - name: browser tests
        shell: bash
        run: |
          set -euo pipefail
          # The minimum count is the check: a suite that silently stops
          # running tests is the failure mode, not one that fails.
          run_browser_suite() {
            local crate="$1" min="$2" log passed
            shift 2
            [ -d "$crate" ] || { echo "::error::$crate is missing — this job must run browser tests, not skip them"; exit 1; }
            log="$(mktemp)"
            if ! wasm-pack test --headless --${{ matrix.browser }} "$crate" "$@" 2>&1 | tee "$log"; then
              echo "::error::browser tests failed for $crate on ${{ matrix.browser }}"
              exit 1
            fi
            passed="$(grep -oE '[0-9]+ passed' "$log" | awk '{s+=$1} END {print s+0}')"
            if [ "$passed" -lt "$min" ]; then
              echo "::error::$crate on ${{ matrix.browser }} ran $passed browser tests, expected at least $min — a renamed test file, a dropped #[wasm_bindgen_test], or drift between this job's --features and the crate's own cfg gate all produce a green run that tests nothing"
              exit 1
            fi
            echo "$crate on ${{ matrix.browser }}: $passed browser tests passed (minimum $min)"
          }
          # 65 -> 68 in v0.2 W1: three tests in `tests/transport.rs` for
          # `Transport::execute`'s drop-cancellation contract — the abort the
          # browser actually performs, its control, and the capability
          # declaration. Counted with the same summation this job does.
          # 68 -> 78 in v0.2 W6: ten tests for the streaming request body
          # and the probe that decides whether to offer it. Measured by
          # running both engines locally, not inferred from the attribute
          # count — several `#[wasm_bindgen_test]`s are cfg-gated, so the
          # two numbers do not agree. Chrome 78, Firefox 78.
          run_browser_suite crates/http-ng-fetch 78
          # `--features` here are wasm-pack's own arguments, not a
          # `cargo test --` passthrough.
          run_browser_suite crates/http-ng 6 --features default-transport,test-util

  fuzz-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: moonrepo/setup-rust@v1
        with:
          channel: nightly
          bins: cargo-fuzz
      - shell: bash
        working-directory: crates/http-ng-proto/fuzz
        env:
          # `rust-toolchain.toml` pins stable and outranks the installed
          # channel; the sanitizer flags cargo-fuzz needs exist only on
          # nightly.
          RUSTUP_TOOLCHAIN: nightly
        run: |
          set -euo pipefail
          rustc --version | grep -q nightly || {
            echo "::error::cargo fuzz is about to run on a non-nightly toolchain — RUSTUP_TOOLCHAIN did not take effect"
            exit 1
          }
          # `--target` is explicit because `cargo fuzz` otherwise builds for
          # the triple IT was compiled for, and `bins:` fetches a prebuilt
          # musl binary — every fuzz target then fails with "sanitizer is
          # incompatible with statically linked libc".
          host="$(rustc -vV | sed -n 's/^host: //p')"
          [ -n "$host" ] || { echo "::error::could not read the host triple out of rustc -vV"; exit 1; }
          cargo fuzz run --target "$host" sse -- -max_total_time=60
          cargo fuzz run --target "$host" sse_accounting -- -max_total_time=30 -max_len=256
          # `http-ng-idn`'s own safe layer — the deny list, the error mask,
          # the ASCII/A-label handling — which sits in front of every
          # backend and so is worth fuzzing on a Linux runner even though
          # Linux has no platform backend. Deliberately NOT a differential
          # fuzzer against `idna`: with the bundled backend
          # `domain_to_ascii` *is* `idna::domain_to_ascii_cow`, so that
          # comparison could not fail. See the target's own docs.
          (cd ../../http-ng-idn/fuzz && cargo fuzz run --target "$host" idn_policy -- -max_total_time=45 -max_len=512)
          # The same layer, and this one IS differential — because
          # `testing::policy_over` takes the backend as an argument, so
          # handing it `idna` cancels `idna` out of both sides and leaves
          # only this crate's code. It exists for the hand-written RFC 3492
          # decoder `src/policy.rs` added: sixty lines of arithmetic in the
          # path that decides which host is contacted, where a wrong answer
          # is a different domain rather than a crash.
          (cd ../../http-ng-idn/fuzz && cargo fuzz run --target "$host" idn_policy_vs_idna -- -max_total_time=45 -max_len=512)

  idn-feature-is-real:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: moonrepo/setup-rust@v1
        with:
          channel: stable
          components: clippy
          bins: cargo-nextest
      - name: url is gone, with the feature either way
        shell: bash
        run: |
          set -euo pipefail
          for flags in "" "--no-default-features"; do
            .github/scripts/tree-guard.sh absent '^(url|form_urlencoded|percent-encoding) ' \
              "http-ng-proto ${flags:-with default features} depends on url again — RFC 3986 §5.2 is written out in src/uri.rs precisely so that it does not; url belongs in [dev-dependencies], where it is the oracle for tests/uri_resolution.rs" \
              -- -p http-ng-proto $flags
          done
      - name: without idn there are no Unicode tables, with it there are
        shell: bash
        run: |
          set -euo pipefail
          # icu_properties_data alone is 1.9 MB of vendored source; this is
          # the entire measurable benefit of the feature. The usual cause of
          # a failure is some crate depending on http-ng-proto WITH default
          # features, unioning idn back on — see [workspace.dependencies].
          .github/scripts/tree-guard.sh absent '^(idna|idna_adapter|icu_)' \
            "--no-default-features still pulls in idna/ICU" \
            -- -p http-ng-proto --no-default-features
          .github/scripts/tree-guard.sh absent '^(idna|idna_adapter|icu_)' \
            "http-ng --no-default-features still pulls in idna/ICU — the facade's idn feature is not forwarding, or something else in its graph turns it on" \
            -- -p http-ng --no-default-features
          # Without this the two checks above would also pass if idn had
          # simply been deleted.
          .github/scripts/tree-guard.sh present '^idna ' \
            "the default build of http-ng-proto has no idna — the idn feature is in [features] default, so either it was removed or the dependency is no longer reached" \
            -- -p http-ng-proto
      - name: the feature-off path is compiled and run, not merely declared
        shell: bash
        run: |
          set -euo pipefail
          # Every #[cfg(not(feature = ...))] path runs only here: the
          # workspace suite is `--all-features`, so it turns each of these
          # ON and never compiles the other side.
          #
          # `http-ng-native` joined the list when h2 landed behind a feature
          # (v0.2 W3). Without it the h1-only build — the default one, what
          # a consumer gets — was compiled by nothing in CI.
          for args in "-p http-ng-proto --no-default-features" \
                      "-p http-ng-native --no-default-features" \
                      "-p http-ng-rt-embassy" \
                      "-p http-ng --no-default-features --features test-util"; do
            rc=0
            out="$(cargo nextest run $args --color never 2>&1)" || rc=$?
            printf '%s\n' "$out"
            [ "$rc" -eq 0 ] || exit "$rc"
            if ! printf '%s\n' "$out" | grep -qE '[0-9]+ tests? run:'; then
              echo "::error::nextest reported no summary for [$args] — the run did not happen"
              exit 1
            fi
          done
          cargo clippy -p http-ng-proto --all-targets --no-default-features -- -D warnings
          cargo clippy -p http-ng-native --all-targets --no-default-features -- -D warnings
          cargo clippy -p http-ng-rt-embassy --all-targets -- -D warnings
          cargo clippy -p http-ng --all-targets --no-default-features --features test-util -- -D warnings

  # The whole claim of `http-ng-idn` is that the platform's ICU answers
  # what the bundled `idna` crate answers.
  #
  # **Two targets have a platform backend, and Linux is not one of them.**
  # The rule is "static linkage against an ABI the OS versions for us":
  # Windows' `icuuc.dll` through `windows-sys`, and Apple's Foundation
  # through `objc2-foundation`. The ELF `dlopen` backend was removed — on
  # Linux the ICU version is a property of the user's machine that nobody
  # chose and nothing reports, and for IDN a Unicode difference is a
  # different host — so Linux and wasm take the bundled tables.
  #
  # The platform column of `tests/differential.rs` does not compile at all
  # where there is no platform backend, which is why
  # `HTTP_NG_IDN_REQUIRE_PLATFORM` is set on Windows and macOS only:
  # asking for it on Linux would demand a test that is not there.
  #
  # The Linux leg is not decoration. It checks the opposite invariant —
  # that a target with no platform backend really does get the bundled
  # tables and links neither `windows-sys` nor `objc2-foundation` — which
  # is the half that breaks silently if the target predicate in `build.rs`
  # and the ones in `Cargo.toml` ever drift apart.
  idn-platform-agrees-with-idna:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: moonrepo/setup-rust@v1
        with:
          channel: stable
          components: clippy
          bins: cargo-nextest
      - name: the differential corpus, platform column required where there is one
        shell: bash
        env:
          # Empty on Linux, so the guard test — which does not exist there
          # — is not asked for. `env:` cannot be conditional, so the value
          # is, and the test reads presence, not truth.
          HTTP_NG_IDN_REQUIRE_PLATFORM: ${{ runner.os != 'Linux' && '1' || '' }}
        run: |
          set -euo pipefail
          # The default (`platform`, resolved by target) and
          # `--all-features`, which is what the `test` matrix job runs.
          # Features have to stay additive: `system-icu` off Windows and
          # `bundled` on it are no-ops, not errors.
          for args in "" "--all-features"; do
            rc=0
            out="$(cargo nextest run -p http-ng-idn $args --color never --no-fail-fast 2>&1)" || rc=$?
            printf '%s\n' "$out"
            [ "$rc" -eq 0 ] || exit "$rc"
            if ! printf '%s\n' "$out" | grep -qE '[0-9]+ tests? run:'; then
              echo "::error::nextest reported no summary for [$args] — the run did not happen"
              exit 1
            fi
          done
      - name: a platform backend means no Unicode tables in the graph
        if: runner.os != 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          # The saving the crate exists for, on the two targets that get
          # it. Its size in bytes is unverified on both — no Windows or
          # Apple linker produced this crate — but its absence from the
          # graph is not, and that is what this checks.
          .github/scripts/tree-guard.sh absent '^(idna|idna_adapter|icu_)' \
            "the default http-ng-idn build on this target pulls in idna/ICU — the whole point of a platform backend is that the OS supplies the tables" \
            -- -p http-ng-idn
          .github/scripts/tree-guard.sh absent '^(idna|idna_adapter|icu_)' \
            "--all-features drags idna back into http-ng-idn on a target with a platform backend" \
            -- -p http-ng-idn --all-features
          .github/scripts/tree-guard.sh present '^(windows-sys|objc2-foundation) ' \
            "http-ng-idn on this target links neither windows-sys nor objc2-foundation, so no platform backend is compiled in at all" \
            -- -p http-ng-idn
      - name: a target with no platform backend takes the bundled tables
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          # The other half of the same invariant. `idna` present is what
          # makes the default build work at all here; the absent list is
          # what says no dynamic loading or platform linking crept back
          # in. `libloading` in particular was a real dependency of this
          # crate until the ELF backend was removed, so its name stays
          # here as a tripwire even though nothing references it now.
          .github/scripts/tree-guard.sh present '^idna ' \
            "http-ng-idn on Linux has no idna, so this target has no IDN implementation at all" \
            -- -p http-ng-idn
          .github/scripts/tree-guard.sh absent '^(libloading|windows-sys|objc2-foundation) ' \
            "http-ng-idn on Linux pulls in a loader or a platform binding — the ELF dlopen backend was removed on purpose, see the crate docs" \
            -- -p http-ng-idn --all-features
      - name: clippy on both feature settings
        shell: bash
        run: |
          set -euo pipefail
          cargo clippy -p http-ng-idn --all-targets -- -D warnings
          cargo clippy -p http-ng-idn --all-targets --all-features -- -D warnings

  portable-example-three-targets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: moonrepo/setup-rust@v1
        with:
          channel: stable
          targets: wasm32-wasip2,wasm32-unknown-unknown
      - shell: bash
        run: |
          set -euo pipefail
          # Three green builds alone would also be green for an example that
          # branched per target; `invariants` checks it contains no #[cfg].
          cargo build -p http-ng --example portable
          cargo build -p http-ng --example portable --target wasm32-wasip2
          cargo build -p http-ng --example portable --target wasm32-unknown-unknown

  fetch-must-fail-under-wasm-threads:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: moonrepo/setup-rust@v1
        with:
          channel: nightly
          targets: wasm32-unknown-unknown
          components: rust-src
      - name: the unsafe Send must be rejected when atomics are on
        shell: bash
        env:
          # As in `fuzz-smoke`: `rust-toolchain.toml` pins stable, and
          # `-Z build-std` needs nightly.
          RUSTUP_TOOLCHAIN: nightly
        run: |
          set -euo pipefail
          rustc --version | grep -q nightly || {
            echo "::error::this check needs nightly for -Z build-std — RUSTUP_TOOLCHAIN did not take effect"
            exit 1
          }
          [ -d crates/http-ng-fetch ] || { echo "::error::crates/http-ng-fetch is missing — this check must run, not skip"; exit 1; }
          log="$(mktemp)"
          if RUSTFLAGS="-Ctarget-feature=+atomics,+bulk-memory" \
              cargo check -p http-ng-fetch --tests \
              --target wasm32-unknown-unknown -Zbuild-std=std,panic_abort \
              > "$log" 2>&1; then
            echo "::error::expected a compile error under +atomics — the Send guarantee SingleThreaded<T> exists to provide is not being enforced"
            exit 1
          fi
          # It must fail for the RIGHT reason: a typo in the flag also fails.
          if ! grep -q 'error\[E0277\]' "$log" || ! grep -q 'cannot be sent between threads safely' "$log"; then
            echo "::error::the build under +atomics failed, but NOT with the expected Send rejection (E0277 / cannot be sent between threads safely) — full output follows"
            cat "$log"
            exit 1
          fi
          echo "OK: correctly rejected under +atomics with E0277 on the Send bound"

  # Text scans. No toolchain, no build — five jobs' worth of runner setup
  # collapsed into one; a failed step is named in the UI just as a failed
  # job was.
  invariants:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: workflows are valid YAML and valid workflows
        run: |
          set -euo pipefail
          python3 -c "import yaml" 2>/dev/null || \
            python3 -m pip install --quiet --break-system-packages pyyaml || \
            python3 -m pip install --quiet pyyaml
          python3 .github/scripts/check_workflow_structure.py
      - name: no Send/Sync bounds declared in the core surface
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          all=(crates/*/src)
          [ ${#all[@]} -gt 0 ] || { echo "::error::crates/*/src matched no directory — the glob is broken or the layout changed"; exit 1; }
          # Excluded by name: these three are runtime/system crates where the
          # bound is real, not leaked through an erased seam.
          dirs=()
          for d in "${all[@]}"; do
            case "$d" in
              crates/http-ng-rt-tokio/src|crates/http-ng-rt-smol/src|crates/http-ng-dns-system/src) ;;
              *) dirs+=("$d") ;;
            esac
          done
          [ ${#dirs[@]} -gt 0 ] || { echo "::error::every crate was excluded — the exclusion set has outgrown the workspace and this check now scans nothing"; exit 1; }
          if grep -rnE '(:|\+)[[:space:]]*(Send|Sync)\b|MaybeSend' "${dirs[@]}" \
               | grep -vE '^[^:]+:[0-9]+:[[:space:]]*(//|/\*|\*)' \
               | grep -vE 'send-bound-exception:[[:space:]]*amendment-C[125]\b'; then
            echo "::error::the core declares a Send or Sync bound without a send-bound-exception marker — erasing a type behind dyn Trait drops auto-traits (amendment C1), so the bound would be forced on backends that cannot satisfy it"
            exit 1
          fi
          echo "no undeclared Send/Sync bounds across ${#dirs[@]} directories"
      - name: unsafe_code stays forbidden by declaration
        run: .github/scripts/unsafe-code-policy.sh
      - name: http-ng-proto contains no async fn
        shell: bash
        run: |
          set -euo pipefail
          [ -d crates/http-ng-proto/src ] || { echo "::error::http-ng-proto is missing — a renamed crate must fail this check, not remove it"; exit 1; }
          if grep -rn "async fn" crates/http-ng-proto/src \
               | grep -vE '^[^:]+:[0-9]+:[[:space:]]*(//|/\*|\*)'; then
            echo "::error::the sans-io crate contains an async fn"
            exit 1
          fi
          echo "http-ng-proto: no async fn"
      - name: no discarded wasi:http setter results
        run: python3 .github/scripts/no_discarded_wasi_setters.py
      - name: the acceptance example has no cfg switch
        run: python3 .github/scripts/no_cfg_in_portable_example.py

  # `cargo tree` only — resolution, no compilation. `--target` needs no
  # installed toolchain, which is why the three-triple check below costs one
  # runner rather than three.
  dependency-graph:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: moonrepo/setup-rust@v1
        with:
          channel: stable
          bins: cargo-deny
      # Supply chain: RUSTSEC advisories, licence policy and source policy.
      # Neither question had any check here before; `deny.toml` carries the
      # policy and its reasoning.
      - run: cargo deny --all-features check
      # The graph invariants this project actually promises. `cargo deny`
      # rather than `cargo tree | grep` wherever it can express the claim:
      # see docs/ci.md for the two it cannot.
      - name: the ambient builds contain no tokio, hyper or h2
        shell: bash
        run: |
          set -euo pipefail
          cargo deny --manifest-path crates/http-ng-fetch/Cargo.toml \
            --config .github/deny/ambient.toml -t wasm32-unknown-unknown check bans
          cargo deny --manifest-path crates/http-ng-wasi/Cargo.toml \
            --config .github/deny/ambient.toml -t wasm32-wasip2 check bans
      - name: the smol path carries no reactor, only hyper's inert tokio leaf
        shell: bash
        run: |
          set -euo pipefail
          for t in x86_64-unknown-linux-gnu x86_64-apple-darwin x86_64-pc-windows-msvc; do
            cargo deny --manifest-path crates/http-ng-rt-smol/Cargo.toml \
              --config .github/deny/smol-path.toml -t "$t" check bans
          done
      # Still `tree-guard`, and deliberately: `cargo deny` bans crates by
      # name, and this one bans a FAMILY by prefix. Enumerating today's
      # names would pass for tomorrow's `futures-whatever`, which is the
      # regression the check exists for. docs/ci.md says so.
      # The `cookies` feature is off by default because `http-ng-cookie`'s
      # compiled-in public suffix list is +77 KiB — a claim nothing checked
      # until here. Exact analogue of the `idna`/ICU guard above.
      - name: the default http-ng build carries no cookie jar
        shell: bash
        run: |
          set -euo pipefail
          .github/scripts/tree-guard.sh absent '^(http-ng-cookie|public-suffix) ' \
            "http-ng's default build pulled in the cookie jar and its public suffix list — the feature is off by default precisely so this does not happen" \
            -- -p http-ng
      - name: http-ng-proto pulls in no async runtime, on any target
        shell: bash
        run: |
          set -euo pipefail
          for t in "" "--target wasm32-unknown-unknown"; do
            .github/scripts/tree-guard.sh absent '^(tokio|futures-|async-|smol|compio)' \
              "http-ng-proto picked up an async dependency ${t:-on the host} — this crate must stay sans-io on every target, not just the host" \
              -- -p http-ng-proto $t
          done
