name: ci
on: [push, pull_request]

# What each job guarantees, and the trap it defends against, is in
# docs/ci.md. Two rules bind everything here:
#
#   1. Fail closed. A check whose crate or file is missing goes red; it does
#      not skip. A silently green check stays green forever after a typo.
#   2. A check must be able to fail. Break it on purpose once before you
#      trust it.
#
# Two mistakes have each cost a red run and will again: greping output
# without `--color never` (ANSI escapes break `^` anchors), and capturing
# output into a variable under `set -e` without `|| rc=$?` (the step aborts
# before anything is printed).

jobs:
  test:
    strategy:
      # A platform-specific failure must not hide the other two: Windows
      # twice reported red having run nothing, cancelled mid-download.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: moonrepo/setup-rust@v1
        with:
          channel: stable
          bins: cargo-nextest
      # The socket-option tests need a loopback source IP distinct from the
      # default route; only Linux and Windows make all of 127.0.0.0/8
      # loopback. They degrade to a weaker assertion without it, so the bind
      # probe is what keeps CI on the strong one. See docs/ci.md.
      - name: give macOS a second loopback address
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          sudo ifconfig lo0 alias 127.0.0.2 up
          python3 - <<'PY'
          import socket, sys
          s = socket.socket()
          try:
              s.bind(("127.0.0.2", 0))
          except OSError as e:
              sys.exit(f"::error::127.0.0.2 is still not bindable after `ifconfig lo0 alias`: {e}")
          PY
      - shell: bash
        run: |
          set -euo pipefail
          # `parsing_scales_linearly_not_quadratically` runs alone in
          # `sse-complexity-guard`; sharing a runner is what made it flake.
          rc=0
          out="$(cargo nextest run --workspace --all-features --color never --no-fail-fast \
            -E 'not test(parsing_scales_linearly_not_quadratically)' 2>&1)" || rc=$?
          printf '%s\n' "$out"
          [ "$rc" -eq 0 ] || exit "$rc"
          if ! printf '%s\n' "$out" | grep -qE '[0-9]+ tests? run:'; then
            echo "::error::nextest printed no Summary — the workspace test run did not happen"
            exit 1
          fi

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: moonrepo/setup-rust@v1
        with:
          channel: stable
          components: rustfmt,clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  sse-complexity-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: moonrepo/setup-rust@v1
        with:
          channel: stable
          bins: cargo-nextest
      - shell: bash
        run: |
          set -euo pipefail
          rc=0
          out="$(cargo nextest run -p http-ng-proto --all-features --color never \
            -E 'test(=sse::lines::tests::parsing_scales_linearly_not_quadratically)' 2>&1)" || rc=$?
          printf '%s\n' "$out"
          [ "$rc" -eq 0 ] || exit "$rc"
          # EXACTLY one: this job exists so the test runs alone on a runner,
          # and "at least one ran" would not say that.
          if ! printf '%s\n' "$out" | grep -qE '1 test run: 1 passed'; then
            echo "::error::sse-complexity-guard did not run exactly one test — parsing_scales_linearly_not_quadratically was renamed or moved. Fix it here AND in the `test` job's filterset."
            exit 1
          fi

  wasip2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: moonrepo/setup-rust@v1
        with:
          channel: stable
          targets: wasm32-wasip2
          # `wasmtime-cli` is required, not optional: a test inside
          # live_roundtrip.rs reads this file and asserts this `bins:` line
          # still installs it.
          bins: cargo-nextest,wasmtime-cli
      - run: cargo build -p http-ng-wasi --example fetch --target wasm32-wasip2
      - shell: bash
        env:
          # Turns "wasmtime not found, skipping" into a panic. Set here and
          # only here — this is the job that promises to install it.
          HTTP_NG_REQUIRE_WASMTIME: "1"
        run: |
          set -euo pipefail
          # Runs under a real wasmtime host via the runner in .cargo/config.toml.
          cargo nextest run -p http-ng-wasi --target wasm32-wasip2
          # live_roundtrip/shape are native: they spin up a mock server and
          # launch wasmtime as a subprocess. `--no-capture` is FOR the grep
          # below — nextest replays a test's output only on failure, so a
          # passing skipped test would print nothing and the check would be
          # vacuous.
          rc=0
          out="$(cargo nextest run -p http-ng-wasi --test live_roundtrip \
            --color never --no-capture 2>&1)" || rc=$?
          printf '%s\n' "$out"
          [ "$rc" -eq 0 ] || exit "$rc"
          if printf '%s\n' "$out" | grep -q 'NOTICE: `wasmtime` not found'; then
            echo "::error::the live wasip2 run skipped the tests instead of executing them — HTTP_NG_REQUIRE_WASMTIME did not reach the test, or wasmtime is not on PATH"
            exit 1
          fi
          cargo nextest run -p http-ng-wasi --test shape

  browser:
    strategy:
      # Engine-specific behaviour is the point of running both, so a Chrome
      # failure must not cancel Firefox.
      fail-fast: false
      matrix:
        browser: [chrome, firefox]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: moonrepo/setup-rust@v1
        with:
          channel: stable
          targets: wasm32-unknown-unknown
          bins: wasm-pack
      - name: browser tests
        shell: bash
        run: |
          set -euo pipefail
          # The minimum count is the check: a suite that silently stops
          # running tests is the failure mode, not one that fails.
          run_browser_suite() {
            local crate="$1" min="$2" log passed
            shift 2
            [ -d "$crate" ] || { echo "::error::$crate is missing — this job must run browser tests, not skip them"; exit 1; }
            log="$(mktemp)"
            if ! wasm-pack test --headless --${{ matrix.browser }} "$crate" "$@" 2>&1 | tee "$log"; then
              echo "::error::browser tests failed for $crate on ${{ matrix.browser }}"
              exit 1
            fi
            passed="$(grep -oE '[0-9]+ passed' "$log" | awk '{s+=$1} END {print s+0}')"
            if [ "$passed" -lt "$min" ]; then
              echo "::error::$crate on ${{ matrix.browser }} ran $passed browser tests, expected at least $min — a renamed test file, a dropped #[wasm_bindgen_test], or drift between this job's --features and the crate's own cfg gate all produce a green run that tests nothing"
              exit 1
            fi
            echo "$crate on ${{ matrix.browser }}: $passed browser tests passed (minimum $min)"
          }
          # 65 -> 68 in v0.2 W1: three tests in `tests/transport.rs` for
          # `Transport::execute`'s drop-cancellation contract — the abort the
          # browser actually performs, its control, and the capability
          # declaration. Counted with the same summation this job does.
          run_browser_suite crates/http-ng-fetch 68
          # `--features` here are wasm-pack's own arguments, not a
          # `cargo test --` passthrough.
          run_browser_suite crates/http-ng 6 --features default-transport,test-util

  fuzz-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: moonrepo/setup-rust@v1
        with:
          channel: nightly
          bins: cargo-fuzz
      - shell: bash
        working-directory: crates/http-ng-proto/fuzz
        env:
          # `rust-toolchain.toml` pins stable and outranks the installed
          # channel; the sanitizer flags cargo-fuzz needs exist only on
          # nightly.
          RUSTUP_TOOLCHAIN: nightly
        run: |
          set -euo pipefail
          rustc --version | grep -q nightly || {
            echo "::error::cargo fuzz is about to run on a non-nightly toolchain — RUSTUP_TOOLCHAIN did not take effect"
            exit 1
          }
          # `--target` is explicit because `cargo fuzz` otherwise builds for
          # the triple IT was compiled for, and `bins:` fetches a prebuilt
          # musl binary — every fuzz target then fails with "sanitizer is
          # incompatible with statically linked libc".
          host="$(rustc -vV | sed -n 's/^host: //p')"
          [ -n "$host" ] || { echo "::error::could not read the host triple out of rustc -vV"; exit 1; }
          cargo fuzz run --target "$host" sse -- -max_total_time=60
          cargo fuzz run --target "$host" sse_accounting -- -max_total_time=30 -max_len=256

  idn-feature-is-real:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: moonrepo/setup-rust@v1
        with:
          channel: stable
          components: clippy
          bins: cargo-nextest
      - name: url is gone, with the feature either way
        shell: bash
        run: |
          set -euo pipefail
          for flags in "" "--no-default-features"; do
            .github/scripts/tree-guard.sh absent '^(url|form_urlencoded|percent-encoding) ' \
              "http-ng-proto ${flags:-with default features} depends on url again — RFC 3986 §5.2 is written out in src/uri.rs precisely so that it does not; url belongs in [dev-dependencies], where it is the oracle for tests/uri_resolution.rs" \
              -- -p http-ng-proto $flags
          done
      - name: without idn there are no Unicode tables, with it there are
        shell: bash
        run: |
          set -euo pipefail
          # icu_properties_data alone is 1.9 MB of vendored source; this is
          # the entire measurable benefit of the feature. The usual cause of
          # a failure is some crate depending on http-ng-proto WITH default
          # features, unioning idn back on — see [workspace.dependencies].
          .github/scripts/tree-guard.sh absent '^(idna|idna_adapter|icu_)' \
            "--no-default-features still pulls in idna/ICU" \
            -- -p http-ng-proto --no-default-features
          .github/scripts/tree-guard.sh absent '^(idna|idna_adapter|icu_)' \
            "http-ng --no-default-features still pulls in idna/ICU — the facade's idn feature is not forwarding, or something else in its graph turns it on" \
            -- -p http-ng --no-default-features
          # Without this the two checks above would also pass if idn had
          # simply been deleted.
          .github/scripts/tree-guard.sh present '^idna ' \
            "the default build of http-ng-proto has no idna — the idn feature is in [features] default, so either it was removed or the dependency is no longer reached" \
            -- -p http-ng-proto
      - name: the feature-off path is compiled and run, not merely declared
        shell: bash
        run: |
          set -euo pipefail
          # Every #[cfg(not(feature = "idn"))] test runs only here: the
          # workspace suite turns `idn` on.
          for args in "-p http-ng-proto --no-default-features" \
                      "-p http-ng --no-default-features --features test-util"; do
            rc=0
            out="$(cargo nextest run $args --color never 2>&1)" || rc=$?
            printf '%s\n' "$out"
            [ "$rc" -eq 0 ] || exit "$rc"
            if ! printf '%s\n' "$out" | grep -qE '[0-9]+ tests? run:'; then
              echo "::error::nextest reported no summary for [$args] — the run did not happen"
              exit 1
            fi
          done
          cargo clippy -p http-ng-proto --all-targets --no-default-features -- -D warnings
          cargo clippy -p http-ng --all-targets --no-default-features --features test-util -- -D warnings

  portable-example-three-targets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: moonrepo/setup-rust@v1
        with:
          channel: stable
          targets: wasm32-wasip2,wasm32-unknown-unknown
      - shell: bash
        run: |
          set -euo pipefail
          # Three green builds alone would also be green for an example that
          # branched per target; `invariants` checks it contains no #[cfg].
          cargo build -p http-ng --example portable
          cargo build -p http-ng --example portable --target wasm32-wasip2
          cargo build -p http-ng --example portable --target wasm32-unknown-unknown

  fetch-must-fail-under-wasm-threads:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: moonrepo/setup-rust@v1
        with:
          channel: nightly
          targets: wasm32-unknown-unknown
          components: rust-src
      - name: the unsafe Send must be rejected when atomics are on
        shell: bash
        env:
          # As in `fuzz-smoke`: `rust-toolchain.toml` pins stable, and
          # `-Z build-std` needs nightly.
          RUSTUP_TOOLCHAIN: nightly
        run: |
          set -euo pipefail
          rustc --version | grep -q nightly || {
            echo "::error::this check needs nightly for -Z build-std — RUSTUP_TOOLCHAIN did not take effect"
            exit 1
          }
          [ -d crates/http-ng-fetch ] || { echo "::error::crates/http-ng-fetch is missing — this check must run, not skip"; exit 1; }
          log="$(mktemp)"
          if RUSTFLAGS="-Ctarget-feature=+atomics,+bulk-memory" \
              cargo check -p http-ng-fetch --tests \
              --target wasm32-unknown-unknown -Zbuild-std=std,panic_abort \
              > "$log" 2>&1; then
            echo "::error::expected a compile error under +atomics — the Send guarantee SingleThreaded<T> exists to provide is not being enforced"
            exit 1
          fi
          # It must fail for the RIGHT reason: a typo in the flag also fails.
          if ! grep -q 'error\[E0277\]' "$log" || ! grep -q 'cannot be sent between threads safely' "$log"; then
            echo "::error::the build under +atomics failed, but NOT with the expected Send rejection (E0277 / cannot be sent between threads safely) — full output follows"
            cat "$log"
            exit 1
          fi
          echo "OK: correctly rejected under +atomics with E0277 on the Send bound"

  # Text scans. No toolchain, no build — five jobs' worth of runner setup
  # collapsed into one; a failed step is named in the UI just as a failed
  # job was.
  invariants:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: workflows are valid YAML and valid workflows
        run: |
          set -euo pipefail
          python3 -c "import yaml" 2>/dev/null || \
            python3 -m pip install --quiet --break-system-packages pyyaml || \
            python3 -m pip install --quiet pyyaml
          python3 .github/scripts/check_workflow_structure.py
      - name: no Send/Sync bounds declared in the core surface
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          all=(crates/*/src)
          [ ${#all[@]} -gt 0 ] || { echo "::error::crates/*/src matched no directory — the glob is broken or the layout changed"; exit 1; }
          # Excluded by name: these three are runtime/system crates where the
          # bound is real, not leaked through an erased seam.
          dirs=()
          for d in "${all[@]}"; do
            case "$d" in
              crates/http-ng-rt-tokio/src|crates/http-ng-rt-smol/src|crates/http-ng-dns-system/src) ;;
              *) dirs+=("$d") ;;
            esac
          done
          [ ${#dirs[@]} -gt 0 ] || { echo "::error::every crate was excluded — the exclusion set has outgrown the workspace and this check now scans nothing"; exit 1; }
          if grep -rnE '(:|\+)[[:space:]]*(Send|Sync)\b|MaybeSend' "${dirs[@]}" \
               | grep -vE '^[^:]+:[0-9]+:[[:space:]]*(//|/\*|\*)' \
               | grep -vE 'send-bound-exception:[[:space:]]*amendment-C[125]\b'; then
            echo "::error::the core declares a Send or Sync bound without a send-bound-exception marker — erasing a type behind dyn Trait drops auto-traits (amendment C1), so the bound would be forced on backends that cannot satisfy it"
            exit 1
          fi
          echo "no undeclared Send/Sync bounds across ${#dirs[@]} directories"
      - name: unsafe_code stays forbidden by declaration
        run: .github/scripts/unsafe-code-policy.sh
      - name: http-ng-proto contains no async fn
        shell: bash
        run: |
          set -euo pipefail
          [ -d crates/http-ng-proto/src ] || { echo "::error::http-ng-proto is missing — a renamed crate must fail this check, not remove it"; exit 1; }
          if grep -rn "async fn" crates/http-ng-proto/src \
               | grep -vE '^[^:]+:[0-9]+:[[:space:]]*(//|/\*|\*)'; then
            echo "::error::the sans-io crate contains an async fn"
            exit 1
          fi
          echo "http-ng-proto: no async fn"
      - name: no discarded wasi:http setter results
        run: python3 .github/scripts/no_discarded_wasi_setters.py
      - name: the acceptance example has no cfg switch
        run: python3 .github/scripts/no_cfg_in_portable_example.py

  # `cargo tree` only — resolution, no compilation. `--target` needs no
  # installed toolchain, which is why the three-triple check below costs one
  # runner rather than three.
  dependency-graph:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: moonrepo/setup-rust@v1
        with:
          channel: stable
      - name: http-ng-proto pulls in no async runtime, on any target
        shell: bash
        run: |
          set -euo pipefail
          for t in "" "--target wasm32-unknown-unknown"; do
            .github/scripts/tree-guard.sh absent '^(tokio|futures-|async-|smol|compio)' \
              "http-ng-proto picked up an async dependency ${t:-on the host} — this crate must stay sans-io on every target, not just the host" \
              -- -p http-ng-proto $t
          done
      - name: the ambient builds contain no tokio, hyper or h2
        shell: bash
        run: |
          set -euo pipefail
          .github/scripts/tree-guard.sh absent '^(tokio|hyper|h2) ' \
            "http-ng-fetch's wasm32-unknown-unknown graph contains tokio, hyper or h2 — the browser transport must stay free of the native HTTP stack" \
            -- -p http-ng-fetch --target wasm32-unknown-unknown
          .github/scripts/tree-guard.sh absent '^(tokio|hyper|h2) ' \
            "http-ng-wasi's wasm32-wasip2 graph contains tokio, hyper or h2 — the wasi:http transport delegates the exchange to the host" \
            -- -p http-ng-wasi --target wasm32-wasip2
      - name: the smol path carries no reactor, only hyper's inert tokio leaf
        shell: bash
        run: |
          set -euo pipefail
          # Absence of tokio is NOT achievable and never was: hyper depends
          # on it unconditionally. What must hold is that the tokio present
          # is the inert `sync` leaf (hyper::upgrade's oneshot) and not a
          # reactor. Checked for three host triples from this one runner.
          for t in x86_64-unknown-linux-gnu x86_64-apple-darwin x86_64-pc-windows-msvc; do
            .github/scripts/tree-guard.sh absent '^async-compat' \
              "the smol path pulled in async-compat on $t — a shim for a foreign runtime that should not be here" \
              -- -p http-ng-rt-smol --target "$t"
            feat_line="$(cargo tree -p http-ng-rt-smol -e normal -i tokio --prefix none \
              --target "$t" -f '{p} [{f}]' | head -1)"
            if [ -z "$feat_line" ]; then
              echo "::error::tokio has disappeared from the smol path's graph on $t. Today that is FALSE — hyper requires tokio unconditionally. Either hyper genuinely stopped requiring it (update this block and AGENTS.md together) or 'cargo tree -f' changed format and the parsing below broke. Neither is a silent pass."
              exit 1
            fi
            feats="$(printf '%s\n' "$feat_line" | grep -oE '\[[^]]*\]' | tr -d '[]')"
            if [ -z "$feats" ]; then
              echo "::error::could not parse the tokio feature list out of '$feat_line' — the output format of 'cargo tree -f' changed and this script needs updating"
              exit 1
            fi
            saw_sync=0
            IFS=',' read -ra feat_arr <<< "$feats"
            for f in "${feat_arr[@]}"; do
              case "$f" in
                sync) saw_sync=1 ;;
                default) ;;
                *)
                  echo "::error::tokio in the smol path carries feature '$f' on $t, outside the measured inert set {default, sync}. Either a real reactor arrived — the regression this check exists for — or hyper/tokio regrouped features upstream, which needs a deliberate update, not a widened blacklist."
                  exit 1
                  ;;
              esac
            done
            [ "$saw_sync" -eq 1 ] || {
              echo "::error::tokio in the smol path on $t no longer carries 'sync' — the only known reason it is there at all. The composition changed; check why and update this block and AGENTS.md together."
              exit 1
            }
            echo "$t: tokio confined to {$feats}, async-compat absent"
          done
