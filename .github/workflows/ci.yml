name: ci
on: [push, pull_request]

# Every check in this file FAILS CLOSED. If the crate or file a check names is
# absent, the job goes red — it does not skip.
#
# This reverses the convention that stood while the workspace was being built,
# under which a check printed `::notice::` and exited zero until its crate
# appeared. That had a reason: the crates arrived one vertical at a time, and a
# check for a crate nobody had written yet would have been red for weeks. All
# fourteen crates now exist, so the only thing a skip can still express is a
# typo in a path or a renamed crate — and it expresses it as a green run.
#
# The reasoning the old text gave was right and is why this changed: a silent
# green check is more dangerous than a red one, because after a typo in a crate
# name it stays green forever. The guards simply had not been brought into line
# with it. Comments further down that still describe the skip-and-notice
# behaviour are describing history, not current behaviour.

jobs:
  # Review resolution (Task 16, fix round 2, finding 1): this file was
  # invalid YAML as of `68d91f3` (a multi-line `echo "::error::…"` in
  # `sse-complexity-guard` wrapped onto a new line at zero indentation
  # inside a `run: |` block — a YAML block scalar ends at the first line
  # whose indentation is LESS than the base indentation, so the parser read
  # the continuation of the message as the start of a new document and
  # failed with `ScannerError`). Consequence: not a single job in this file
  # ran at all — not the sans-io check, not `no-declared-send`, not the
  # clippy gate, not the setter scanner, not the complexity guard, not the
  # live test. The only YAML check was manual, done once, when the file was
  # created (Task 1) — and never again, exactly the class of defect "a
  # single run protects nothing written later" that this whole vertical
  # exists to fight. A job inside the file cannot save an already-broken
  # file — but it prevents the NEXT breakage, which is the realistic risk
  # here. Locally: `python3 -c "import yaml;
  # yaml.safe_load(open('.github/workflows/ci.yml'))"` (the same call as
  # below) is worth running before every commit that touches this file.
  #
  # Finding 3 (Task 16, fix round 3) — what THIS check does NOT guarantee,
  # explicitly, since it is not obvious by default from the name and the
  # job's position first in the file: this is a PURELY syntactic YAML check
  # (`yaml.safe_load` doesn't raise), not GitHub Actions schema validation.
  # The review built four files, each valid YAML but an invalid workflow:
  # an unknown top-level key, a malformed `on:`, a job without `runs-on:`,
  # a broken `uses:` — and all four pass this check green. This is a
  # deliberate boundary of coverage, not an oversight: closing the whole
  # class would mean pulling in the Actions schema (not in PyYAML) or
  # actually running the workflow on a GitHub runner instead of just
  # parsing the file — the cost is clearly higher than such an error is
  # rare. This job guarantees exactly one thing: the file will not be
  # rejected by the YAML parser. GitHub can still refuse to run the
  # workflow for reasons this gate does not see at all.
  workflow-yaml-is-valid:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - shell: bash
        run: |
          set -euo pipefail
          # `actions/runner-images`' ubuntu-latest usually already carries PyYAML,
          # but not guaranteed — check via import and only install if
          # needed. `--break-system-packages`: PEP 668
          # ("externally-managed-environment") on some images
          # forbids a bare `pip install` into the system Python; for
          # a one-shot CI runner this is exactly the case the flag
          # exists for.
          python3 -c "import yaml" 2>/dev/null || \
            python3 -m pip install --quiet --break-system-packages pyyaml || \
            python3 -m pip install --quiet pyyaml
          python3 - <<'PYEOF'
          import sys
          import yaml
          from pathlib import Path

          ok = True
          for path in sorted(Path(".github/workflows").glob("*.yml")):
              try:
                  yaml.safe_load(path.read_text(encoding="utf-8"))
                  print(f"{path}: valid YAML")
              except yaml.YAMLError as e:
                  print(f"::error file={path}::{path} is not valid YAML: {e}")
                  ok = False
          sys.exit(0 if ok else 1)
          PYEOF

  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - shell: bash
        run: |
          set -euo pipefail
          if [ -z "$(ls -A crates 2>/dev/null | grep -v '^.gitkeep$' || true)" ]; then
            echo "::error::the workspace crates is missing — every crate in this workspace exists, so this is a broken path or a renamed crate, not a not-yet-written one; the check must run, not skip"
            exit 1
          fi
          # `parsing_scales_linearly_not_quadratically` (sse/lines.rs) is excluded
          # from here deliberately (Task 14, review round 1, Finding 4): this job
          # runs `cargo test --workspace --all-features` as a whole, and exactly
          # that neighborhood — several heavy test processes on one
          # runner at the same time — was the measured source of the complexity
          # test's flakiness. It has its own job, `sse-complexity-guard` below,
          # where it does not share the runner with anything.
          #
          # `--skip` here has NO separate check for "did it actually find something
          # to skip": a test that wasn't renamed on this side simply falls back into
          # the shared run and risks flaking under load (degradation, not a blind
          # spot — the test still runs and will eventually catch a real regression
          # sooner or later). The symmetric defect — on the `sse-complexity-guard`
          # side, where a name mismatch produces a COMPLETELY silent green job with
          # not a single test run — is where the check actually belongs (Finding 1,
          # review round 2). It going red blocks the merge and forces both spots to
          # be fixed together, so duplicating the check here would be redundant.
          cargo test --workspace --all-features -- --skip parsing_scales_linearly_not_quadratically

  # m2 of the branch's final review. `no-discarded-wasi-setters` below justifies
  # its switch from a line-by-line grep to Python by saying the line wrap is done
  # by "the very formatter this same CI gates with (the `fmt` job)" — but there
  # was no `fmt` job in the file, and formatting was not checked anywhere. The
  # scanner's justification is true regardless (rustfmt wraps the line whether or
  # not CI gates it), but it shouldn't reference a job that doesn't exist.
  # Cheaper and more useful to add the job than to strike the phrase:
  # `rustfmt.toml` exists in the workspace, and every task of the vertical
  # already ran `cargo fmt` by hand and reported "clean" — meaning the discipline
  # rested on exactly the same convention that was judged insufficient for
  # clippy (Task 15, review round 1, Finding 3).
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { components: rustfmt }
      - shell: bash
        run: |
          set -euo pipefail
          if [ -z "$(ls -A crates 2>/dev/null | grep -v '^.gitkeep$' || true)" ]; then
            echo "::error::the workspace crates is missing — every crate in this workspace exists, so this is a broken path or a renamed crate, not a not-yet-written one; the check must run, not skip"
            exit 1
          fi
          cargo fmt --all --check

  # Before this job, clippy did not run anywhere in CI: every task of the
  # vertical ran `cargo clippy --workspace --all-targets --all-features -- -D
  # warnings` by hand and reported "clean", but nothing verified that this
  # actually happens on every push — the discipline rested only on
  # convention (Task 15, review round 1, Finding 3). Same guard pattern as
  # `test`: prints `::notice::` and exits zero while the workspace has
  # no crate yet, instead of being silently green by default.
  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { components: clippy }
      - shell: bash
        run: |
          set -euo pipefail
          if [ -z "$(ls -A crates 2>/dev/null | grep -v '^.gitkeep$' || true)" ]; then
            echo "::error::the workspace crates is missing — every crate in this workspace exists, so this is a broken path or a renamed crate, not a not-yet-written one; the check must run, not skip"
            exit 1
          fi
          cargo clippy --workspace --all-targets --all-features -- -D warnings

  # Isolated run of the quadratic-regression test (`sse/lines.rs`). Not
  # part of `test` above — see the comment at `--skip` there. `best-of-3`
  # inside the test itself is secondary protection against one-off noise;
  # the primary protection is this isolation: its own job, with nothing
  # else running in parallel on this runner. Detailed rationale, including
  # measured numbers (best-of-5 flaked 25 times out of 25 under sustained
  # overcommit, single-sample — 9 out of 25) — in the doc comment of the
  # test itself.
  sse-complexity-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - shell: bash
        run: |
          set -euo pipefail
          if [ ! -d crates/http-ng-proto ]; then
            echo "::error::http-ng-proto is missing — every crate in this workspace exists, so this is a broken path or a renamed crate, not a not-yet-written one; the check must run, not skip"
            exit 1
          fi
          # `cargo test ... -- --exact NAME`, if NAME matched nothing,
          # exits with code 0 and prints "0 passed" — the same class of defect
          # already fixed in Task 1 (`cargo tree | grep` and `grep -rn`,
          # silently green when the crate is missing). Renaming or moving the
          # test would produce a COMPLETELY silent green job here — zero
          # runs, nothing checked — unless we explicitly verify that the test
          # actually was found and executed (review round 2, Finding 1).
          out="$(cargo test -p http-ng-proto --all-features \
            sse::lines::tests::parsing_scales_linearly_not_quadratically -- --exact)"
          printf '%s\n' "$out"
          if ! printf '%s\n' "$out" | grep -qE '^test result: ok\. 1 passed;'; then
            echo "::error::sse-complexity-guard did not run exactly one test — parsing_scales_linearly_not_quadratically appears to have been renamed or moved. Fix the path here AND the --skip value in the test job."
            exit 1
          fi

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.0
        with:
          # `http-ng-fetch` (Task 1 of vertical 3) is wasm-only — see below
          # for why it needs its own `cargo check` call, on its own target,
          # rather than joining the workspace check.
          targets: wasm32-unknown-unknown
      - shell: bash
        run: |
          set -euo pipefail
          # No hand-maintained crate list any more. It named twelve
          # crates and excluded `http-ng-wasi`, which used to declare its
          # own higher `rust-version`; with the MSRV policy now "the
          # latest stable", nothing in the workspace diverges, so
          # `--workspace` covers everything and cannot silently omit a
          # crate added later — which the list could, and which is the
          # failure mode this file spends most of its length preventing.
          # `--all-targets` — resolution from the branch's final review (§4,
          # "only appears protected"). Without it, only lib targets were
          # checked, and `tests/` were NEVER checked at 1.85 during the
          # whole vertical: MSRV is a published promise in `rust-version`,
          # and a test that fails to build at the stated minimum breaks
          # exactly the consumer who trusted that promise and wanted to run
          # the test suite themselves.
          #
          # Nothing in the workspace declares a `rust-version` of its own
          # any more. `http-ng-wasi` used to (1.90, a `wasip3` requirement)
          # and was excluded here for it; under the "latest stable" policy
          # that override sits below the floor and was removed, so the crate
          # is checked with the rest.
          cargo check --workspace --all-features --all-targets

          # `http-ng-fetch` (Task 1 of vertical 3) is NOT covered by the
          # above: everything else in that list is a native crate, checked
          # on the job's default host target
          # (`x86_64-unknown-linux-gnu`), and `http-ng-fetch` has no
          # meaningful native build at all — it's `web-sys`/`wasm-bindgen`
          # over the browser `fetch` API. Folding it into the host check would
          # either silently host-check it (which type-checks — `wasm-
          # bindgen`'s externs stay inert off wasm32 rather than failing —
          # but never touches any `#[cfg(target_arch = "wasm32")]` branch,
          # so it isn't a faithful MSRV check of the code that actually
          # ships) or, if `--target wasm32-unknown-unknown` were added to
          # the shared `cargo check` line instead, break every native
          # crate in the workspace that depends on `tokio`/`std::net` and cannot
          # build for wasm32 at all. So it gets its own call, on its own
          # target. The command the job runs below was verified by hand
          # against this crate before the job was written, and re-runs on
          # every push.
          #
          # This passage used to carry three paragraphs of archaeology about
          # `wasm-streams` 0.5 versus 0.6: 0.6.0 declares
          # `rust-version = "1.88"`, which broke the workspace's then-floor
          # of 1.85, so the crate was pinned to 0.5 and the reasoning was
          # written out here and in that crate's manifest. The MSRV policy
          # is now "the latest stable", the crate is on 0.6, and every
          # version number in that argument was stale. Deleted rather than
          # annotated — a comment arguing from a floor the repository no
          # longer has does not become true by being labelled historical.
          if [ ! -d "crates/http-ng-fetch" ]; then
            echo "::error::crates/http-ng-fetch is missing — this is CI's only wasm32-unknown-unknown MSRV check; a renamed directory must fail the job, not quietly remove the check"
            exit 1
          fi
          cargo check -p http-ng-fetch --all-features --all-targets --target wasm32-unknown-unknown

          # Task 9 (task-9-addendum-measured.md, "Also add: the facade's
          # browser target is unchecked at every level"). Before this line,
          # nothing in this file ever checked `http-ng` itself on
          # `wasm32-unknown-unknown` — Task 7 round 1's `AmbientClock::
          # sleep` shipped a `!Send` future inside THIS crate, and no job
          # could have caught it, not because the technique doesn't exist
          # (`crates/http-ng-fetch/tests/transport.rs` already has
          # `assert_send<T: Send>` applied to a real `execute` future, and
          # the line right above this one, unchanged since Task 1 of this
          # vertical, already catches a regression there via
          # `--all-targets`) but because it was never pointed at the
          # facade.
          #
          # NOT `--all-features --all-targets`, the exact form the
          # addendum's own text asks for — verified NOT to work, for two
          # independent reasons, neither fixable from this file alone
          # (`crates/http-ng` was off-limits for this task: Task 8 is live
          # there).
          #   1. `--all-features` turns on `default-transport`, and
          #      `Client<T = crate::DefaultTransport>`'s struct
          #      declaration (`client.rs`) is gated only on
          #      `feature = "default-transport"`, not on target, while
          #      `DefaultTransport` ITSELF (`lib.rs`) is additionally
          #      gated `not(target_family = "wasm")` — on this target,
          #      with the feature on, the struct names a type that
          #      doesn't exist here: `error[E0425]: cannot find type
          #      `DefaultTransport``. Measured directly, not assumed.
          #   2. `--all-targets` compiles every dev-dependency the crate
          #      has, including `tokio`/`http-ng-native`/`http-ng-rt-
          #      tokio` — needed only by the native-only `tests/
          #      two_runtimes.rs`, and listed in `Cargo.toml` with no
          #      target gate at all. Those pull in `mio`, which does not
          #      build for `wasm32-unknown-unknown`: 48 compile errors,
          #      none of them about this crate's own code. Also measured
          #      directly.
          # `--features test-util` sidesteps landmine 1 (no
          # `default-transport` involved) without adding a dependency this
          # crate doesn't already have optionally — but a bare `cargo
          # check` with no test target selected does not compile `tests/
          # shape.rs` at all, so today this line only proves the LIB
          # compiles here; the `Send` assertion the addendum specifically
          # asked for (`tests/shape.rs`'s
          # `client_future_is_send_when_the_transport_is`, over a real
          # `Client<MockTransport>::execute` future) needs `--tests` too,
          # which reopens landmine 2 regardless of which features are on.
          # Reported to the dispatcher as a real, measured blocker rather
          # than silently narrowed or left unattempted — closing it means
          # target-gating `crates/http-ng/Cargo.toml`'s native-only
          # dev-dependencies, out of scope for this task.
          if [ ! -d "crates/http-ng" ]; then
            echo "::error::crates/http-ng is missing — a renamed directory must fail this job, not quietly skip the facade's browser-target check"
            exit 1
          fi
          cargo check -p http-ng --features test-util --target wasm32-unknown-unknown

  # Task 14: end-to-end acceptance of the vertical — the same generic code
  # (`fetch_once` in `two_runtimes.rs`) really runs over the network on
  # tokio and on smol without a single `#[cfg]`. Matrix of three OSes,
  # because the runtime seam is exactly the place where a platform
  # difference (epoll/kqueue/IOCP under `async-io`, tokio's scheduler)
  # could leak out unnoticed.
  two-runtimes:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - shell: bash
        run: |
          set -euo pipefail
          if [ ! -d crates/http-ng ]; then
            echo "::error::http-ng is missing — every crate in this workspace exists, so this is a broken path or a renamed crate, not a not-yet-written one; the check must run, not skip"
            exit 1
          fi
          cargo test -p http-ng --test two_runtimes
      # The task brief (task-14-brief.md, Step 5) proposed a literal
      # `grep -E '^(tokio|async-compat)'` over `cargo tree -p http-ng-rt-smol
      # -e normal` and expected an empty result — checked on this tree and
      # it did NOT hold: `tokio` is present. The reason is not a smol-path
      # regression but an already-documented (README, "What's in the
      # dependency graph") fact: `hyper` depends on `tokio`
      # UNCONDITIONALLY, not behind a feature, and enters the
      # `http-ng-rt-smol` graph transitively through `http-ng-rt` (which
      # depends on `hyper` for the `hyper::rt::{Read,Write}` bridge traits,
      # needed identically by every runtime backend — not only tokio). A
      # literal check per the brief would have had to fail on every push —
      # not because the smol path violated anything, but because it was
      # checking a fact that this very vertical had already disproved in
      # advance. The actual property worth keeping green: the smol path
      # does not pull in the tokio RUNTIME (the reactor, `tokio::spawn`,
      # `tokio::net`) — only an inert leaf (`tokio::sync::oneshot`, which
      # `hyper::upgrade` uses internally and which never executes on this
      # path) — and does not pull in `async-compat` (a shim for running
      # tokio-specific code on someone else's executor, which would be
      # needed if the graph below were structured differently).
      # Fix round 1, finding 1: the first version of this check blacklisted
      # a set of FORBIDDEN feature names (`rt`, `net`, `time`, ...) — the
      # same class of defect this file already fixed elsewhere (`cargo tree |
      # grep`, silent when the crate is missing; `--exact NAME`, green on
      # 0 matches): if tokio upstream renames or regroups its features, the
      # blacklist simply stops finding anything, and the job stays green
      # even though the check no longer sees anything — "clean" and
      # "didn't look" become indistinguishable. The fix is a whitelist: the
      # set of features that today ACTUALLY are present (`default`, `sync`
      # — the inert leaf of `hyper::upgrade`'s `tokio::sync::oneshot`, see
      # the comment above) must match EXACTLY; any name outside this set is
      # an error regardless of whether it "looks" more dangerous (`rt`) or
      # not: the goal is not to tell dangerous names from safe ones, but to
      # notice that the composition changed at all, and call a human to
      # check what it means. Same for the fact of presence: if `tokio`
      # disappears from the graph entirely (in theory an improvement —
      # hyper would have stopped requiring it), the check also fails rather
      # than silently celebrating, because "disappeared" is
      # indistinguishable to this script from "cargo tree changed its
      # output format and the parsing broke". Both outcomes require the
      # same thing: a human looks at the job output and either fixes the
      # regression or deliberately updates the allowlist and this comment
      # together with the README ("What's in the dependency graph").
      - name: smol path pulls no tokio runtime and no async-compat
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -d crates/http-ng-rt-smol ]; then
            echo "::error::http-ng-rt-smol is missing — every crate in this workspace exists, so this is a broken path or a renamed crate, not a not-yet-written one; the check must run, not skip"
            exit 1
          fi
          tree="$(cargo tree -p http-ng-rt-smol -e normal --prefix none)"
          printf '%s\n' "$tree"
          if printf '%s\n' "$tree" | grep -qE '^async-compat'; then
            echo "::error::the smol path pulled in async-compat — a shim for a foreign runtime that should not be here"
            exit 1
          fi

          feat_line="$(cargo tree -p http-ng-rt-smol -e normal -i tokio --prefix none -f '{p} [{f}]' | head -1)"
          echo "tokio feature line: ${feat_line:-<EMPTY>}"
          if [ -z "$feat_line" ]; then
            echo "::error::tokio has disappeared from the smol path's graph. Today this is FALSE: hyper depends on tokio unconditionally (README, \"What's in the dependency graph\"), so either (a) hyper genuinely stopped requiring tokio — update this allowlist block and the README together, the check is not obligated to stay silently empty, or (b) 'cargo tree -f' changed its output format and the parsing below broke — this too requires an update, not a silent pass."
            exit 1
          fi

          feats="$(printf '%s\n' "$feat_line" | grep -oE '\[[^]]*\]' | tr -d '[]')"
          if [ -z "$feats" ]; then
            echo "::error::failed to parse the tokio feature list from line '$feat_line' — the output format of 'cargo tree -f {p} [{f}]' changed, the script needs updating, this must not be treated as a clean run"
            exit 1
          fi
          echo "tokio features: $feats"

          # Whitelist — the only names that today are measured to be
          # present and inert (see the comment above and the README).
          saw_sync=0
          IFS=',' read -ra feat_arr <<< "$feats"
          for f in "${feat_arr[@]}"; do
            case "$f" in
              sync) saw_sync=1 ;;
              default) ;;
              *)
                echo "::error::tokio in the smol path carries feature '$f', which is not in the measured inert set (default, sync). Either this is a real reactor — a smol-path regression that this check is meant to catch — or hyper/tokio regrouped their features upstream and the allowlist needs a deliberate update, not a silent blacklist expansion. Either way — a red job with this message, not a silent green."
                exit 1
                ;;
            esac
          done
          if [ "$saw_sync" -ne 1 ]; then
            echo "::error::tokio in the smol path NO LONGER carries the 'sync' feature (hyper::upgrade's tokio::sync::oneshot, the only known reason tokio is here at all) — the composition changed, check the actual reason and update the allowlist/README together, not just the code."
            exit 1
          fi
          echo "OK: tokio is confined to the inert feature set {default, sync}, async-compat is absent"

  wasip2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: wasm32-wasip2 }
      - shell: bash
        run: |
          set -euo pipefail
          if [ ! -d crates/http-ng-wasi ]; then
            echo "::error::http-ng-wasi is missing — every crate in this workspace exists, so this is a broken path or a renamed crate, not a not-yet-written one; the check must run, not skip"
            exit 1
          fi
          cargo check -p http-ng-wasi --target wasm32-wasip2
          # Task 17: the end-to-end example `examples/fetch.rs` — the only
          # code in the repository that actually goes through the user-facing
          # `http_ng::Client`, rather than directly through
          # `Transport::execute`. `cargo check` does not see it (it is not a
          # lib/bin target by default for `check` without `--examples`), so
          # a separate `cargo build` is needed.
          cargo build -p http-ng-wasi --example fetch --target wasm32-wasip2
      # Review resolution (Task 16, finding B-7): `tests/live_roundtrip.rs` —
      # the only automated protection of the property this whole vertical
      # exists for (`Body::is_end_stream()` against a real host) — previously
      # did not run in any CI job at all. When `wasmtime` was absent it
      # printed `::notice::` and silently returned `ok` — a green
      # `cargo test` in that case says nothing about whether this path was
      # exercised at all; the same class of vacuous check that was fixed in
      # every other job of the vertical. `cargo install`, rather than a
      # prebuilt binary — the same pattern as `cargo-fuzz` in `fuzz-smoke`
      # below.
      - run: cargo install wasmtime-cli --locked
      - shell: bash
        env:
          # Resolution of the branch's final review, finding B3. Previously
          # `require_wasmtime` in `tests/live_roundtrip.rs` keyed off `CI` —
          # a variable GitHub Actions sets for EVERY job, whereas `wasmtime`
          # is installed by exactly this one. The matrix job `test` runs
          # `cargo test --workspace --all-features`, picks up
          # `live_roundtrip.rs` (it's native) and failed on all three
          # runners: `0 passed; 5 failed`. The guard was right in intent and
          # wrong in signal — `CI` means "some job somewhere", but what's
          # needed is "the job that promised to install wasmtime". Here the
          # promise is made by the step above, so the strictness belongs
          # here, and only here.
          HTTP_NG_REQUIRE_WASMTIME: "1"
        run: |
          set -euo pipefail
          if [ ! -d crates/http-ng-wasi ]; then
            echo "::error::http-ng-wasi is missing — every crate in this workspace exists, so this is a broken path or a renamed crate, not a not-yet-written one; the check must run, not skip"
            exit 1
          fi
          # Plain unit tests — actually execute under real `wasmtime` via
          # the runner from `.cargo/config.toml`, not just compiled.
          cargo test -p http-ng-wasi --target wasm32-wasip2
          # `live_roundtrip`/`shape` — native (see the doc comment in
          # `tests/live_roundtrip.rs` on why they cannot be a
          # `wasm32-wasip2` target): they spin up a mock server themselves
          # and launch `wasmtime` as a subprocess. `HTTP_NG_REQUIRE_WASMTIME`
          # (see `env:` above) makes `require_wasmtime()` inside
          # `live_roundtrip.rs` panic if `wasmtime` still wasn't found,
          # instead of quietly skipping the check — here it is required to
          # be found, since it was just installed by the step above.
          # `--nocapture` is not for readability, it's FOR the check below:
          # libtest swallows the stdout/stderr of a passing test, so the
          # `NOTICE` of a skipped live run doesn't reach `grep` at all
          # without this flag — verified, `0` matches versus `5` with the
          # flag. Without it, the next check would be vacuous, exactly the
          # defect it is written against.
          out="$(cargo test -p http-ng-wasi --test live_roundtrip -- --test-threads=1 --nocapture 2>&1)"
          printf '%s\n' "$out"
          # Second half of the same protection. The marker above turns a
          # skip into a FAILURE, but only as long as it actually reaches the
          # test: a typo in the name, `env:` moved to the wrong step,
          # `cargo install` silently installing the binary outside `PATH` —
          # and the five live tests print `NOTICE` again and report `ok`,
          # while the job stays green, having checked nothing. The name
          # symmetry between the guard and this file is held by a test
          # inside `live_roundtrip.rs`; here we verify that the skip did not
          # happen for ANY reason.
          if printf '%s\n' "$out" | grep -q 'NOTICE: `wasmtime` not found'; then
            echo "::error::the live wasip2 run skipped the tests instead of executing them — HTTP_NG_REQUIRE_WASMTIME did not reach the test or wasmtime is not on PATH"
            exit 1
          fi
          cargo test -p http-ng-wasi --test shape

  # Task 16: `wasi:http` 0.3 returns `result<_, ...>` from the setters of
  # request options (`set_connect_timeout`, `set_method`, `set_scheme`, ...)
  # precisely so the host can refuse — this crate's predecessor,
  # `wasi-fetch`, discarded seven such `Result`s via `let _ =`. The task
  # brief checked this once, by hand, during implementation — a single run
  # protects nothing written later. The same guard pattern as the other
  # jobs: `::notice::` and exit zero while the crate doesn't exist.
  no-discarded-wasi-setters:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - shell: bash
        run: |
          set -euo pipefail
          if [ ! -d crates/http-ng-wasi/src ]; then
            echo "::error::http-ng-wasi is missing — every crate in this workspace exists, so this is a broken path or a renamed crate, not a not-yet-written one; the check must run, not skip"
            exit 1
          fi
          # The review (Task 16, finding B-4) found the original grep-based
          # version of this check defective along two independent axes:
          #
          # 1. A line-by-line `grep` matches `.set_x(...)` and the way its
          #    `Result` gets discarded only if both are on the SAME line.
          #    `cargo fmt` in this workspace wraps a long setter call onto a
          #    new line (`max_width = 100`) —
          #    `opts\n    .set_between_bytes_timeout(..)\n    .unwrap_or_default();`
          #    after formatting, the very formatter this same CI gates with
          #    (the `fmt` job) makes the violation invisible to a
          #    line-by-line search. Nine forms seeded by the review proved
          #    this on a live run: three of the original ones were caught,
          #    six were not, and the very first miss was not hypothetical —
          #    it was exactly this wrap.
          # 2. The list of discard forms was incomplete: `.ok()`/
          #    `.unwrap_or_default()` are not the only ways to silently
          #    throw away a `Result` without giving the compiler a reason to
          #    warn about `#[must_use]` (a bare `foo.set_x(y);` without a
          #    wrapper would itself fail to compile under `-D warnings` —
          #    that case is already protected by the ordinary build).
          #    `.unwrap_or(..)`, `.is_ok()`, `.is_err()`, `let _ident = ..`
          #    (not only the literal `let _ =`), and `drop(..)` — also count.
          #
          # Both are fixed by switching to Python: instead of a line-by-line
          # `grep`, we glue the contents of each file (minus comments — see
          # below) into a single whitespace-normalized stream, keeping the
          # original line number for every character — rustfmt's line wrap
          # stops being invisible, and the diagnostic still names the line
          # where the call started. `.set_xxx(...)` calls are located by a
          # manually counted paren balance (an ordinary regex can't handle
          # the nested `Some(ns)` inside `set_connect_timeout(Some(ns))`),
          # and right after the closing paren the extended list of discard
          # forms is checked — on the normalized stream, not on the source
          # lines.
          #
          # Round 1: checked against nine seeded violations (three original
          # plus the rustfmt wrap for each) and against the existing tree.
          # Round 2 (finding 6) added three forms (`if let Err(_e) = .. { }`,
          # a bare `_ = ..`, `let _: Type = ..`) and fixed `//`-inside-a-string/
          # `/* */`-comment handling in the scanner itself; it also found and
          # fixed its own bug with `?`-propagation being falsely caught as a
          # discard.
          #
          # Round 3 closed two newly found open spots and documented two
          # that remain open deliberately:
          # - Finding 1: `if let Err(_e) = call { }` was caught for ANY form,
          #   including `if let Err(_e) = call { return Err(_e.into()); }` —
          #   an honest propagation where `_e` is actually used. A leading
          #   underscore in a name does not make the binding unused — it is
          #   just a naming convention. Narrowed to an empty block: find the
          #   `{` right after the end of the call chain, balance to the
          #   matching `}`, flag only if the content between them is empty.
          # - Finding 2, and this matters more than everything else in this
          #   check: ANY combinator between `.set_x(..)` and the final
          #   discard hid it — `.set_connect_timeout(Some(ns)).map(|_| ()).ok();`
          #   really loses the `RequestOptionsError`, compiles cleanly, is
          #   clippy- and fmt-clean, and the scanner (checked byte for byte
          #   with the very script here) found nothing. Previously the
          #   DISCARD check only looked at what comes RIGHT AFTER the
          #   closing paren of the call; now `walk_chain` walks the entire
          #   `.method(..).method(..)...` chain (with the same counted paren
          #   balance) and looks for a discard form at any position, stopping
          #   at `?` (honest propagation) or at the first non-chain token.
          #   `.unwrap_or_else(..)` and `.map_or(..)` were added along the
          #   way — the same class of terminal forms as `.unwrap_or(..)`,
          #   simply not named explicitly before.
          #   Fixture testing for this round found, on its own, a third bug
          #   that was nobody's finding: a character literal with a quote
          #   inside (`'"'`) desynced the line-by-line `in_string` tracker
          #   for `//`-comments for the rest of the line — a rare but real
          #   source of FALSE positives (commented-out code inside `// ...`
          #   started reading as real if a character literal with `"` came
          #   before the `//` on the same line). Fixed:
          #   `strip_line_comment` now recognizes character literals
          #   (`'x'`, `'\n'`, `'"'`, `'\u{...}'`) as whole units, without
          #   confusing them with lifetimes (`'a`, not closed by a `'`).
          # - The review also proposed treating the finding about
          #   desynchronization after a character literal as a narrower
          #   case — CONFIRMED by our own testing AFTER the fix above: not
          #   via `walk_chain` (which doesn't look at comments at all), but
          #   via a separate, related fix in `strip_line_comment`.
          # - A search of our own for new forms for this round (after the
          #   fix) found TWO forms the scanner still doesn't catch, and they
          #   are LEFT open deliberately, not quietly:
          #   * `match opts.set_x(y) { Ok(()) => { .. }, Err(_) => { .. } }`
          #     with non-empty branches for `Err` that don't read its
          #     content — clippy's `single_match`/`match_single_binding`
          #     catch TRIVIAL forms of this (`Ok(_) => {}, Err(_) => {}` or
          #     `_ => {}`), but not this one. Closing this in general means
          #     parsing the body of `match` arms — beyond the budget of a
          #     regex heuristic; a real parser is needed (`syn` or the
          #     like), which this job deliberately avoids.
          #   * `let (_,) = (opts.set_x(y),);` (and similar tuple
          #     destructurings into `_`) — compiles and is clippy-clean.
          #     Not closed: as far as we can tell, this form does not occur
          #     organically, only as a deliberate workaround for this
          #     specific check — extending the perimeter to every
          #     conceivable destructuring for the sake of one contrived form
          #     is not worth it.
          #   * `let _ = if cond { opts.set_x(y) } else { Ok(()) };` (and
          #     equivalently — a bare block `let _ = { opts.set_x(y) };`) —
          #     found by a SECOND independent search in this same round,
          #     AFTER fixing findings 1 and 2, by planting it into the real
          #     `apply_timeouts` and confirming clippy- and fmt-cleanliness.
          #     Unlike the two forms above, this is ORDINARY, idiomatic
          #     Rust — it won't become rarer as the crate grows, if
          #     anything the opposite. The reason for the miss is
          #     structural, not heuristic: the `.set_x(..)` call sits
          #     INSIDE its own `{ }` (the body of an if/else branch or a
          #     bare block expression), and `stmt_start` finds the NEAREST
          #     `{` before the call — which is the branch's opening brace,
          #     not the start of the statement — so the text `let _ =`
          #     never enters the `prefix` that
          #     LET_UNDERSCORE/DROP_CALL/BARE_UNDERSCORE_ASSIGN check.
          #     Closing this would mean tracking the nesting of block
          #     expressions and what their final (not `;`-terminated) value
          #     is — exactly the same regex-heuristic budget overrun as
          #     above; a real parser is needed. Not closed deliberately, not
          #     because we couldn't find how — recorded here so it doesn't
          #     have to be rediscovered.
          #
          # Checked against twenty-odd forms (twelve violations from
          # round 1+2, seven new violations from round 3 — a combinator
          # before `.ok()`, several combinators in a row,
          # `.unwrap_or_else(..)`, `.map_or(..)`, a combinator before
          # `let _ =`, plus legitimate ones — `?`-propagation including with
          # a named `_`-variable, a `match` that genuinely handles both
          # branches, `if let Err(_e) = call { return Err(_e.into()); }`, a
          # variable named `foo_`, a string containing `//` before a real
          # `?`, a character literal with a quote before a real
          # `//`-comment) in an isolated fixture, in a third byte-for-byte
          # run of the same script as here — zero false positives in either
          # direction, and on the existing tree (`OK`).
          python3 - <<'PYEOF'
          import re, sys, pathlib

          ROOT = pathlib.Path("crates/http-ng-wasi/src")

          # Terminal forms that lose Err — regardless of whether they sit
          # RIGHT AFTER `.set_x(..)` or after an arbitrarily long chain of
          # transparent combinators (`.map(..)`, `.map_err(..)`,
          # `.and_then(..)`, ...) — finding 2 round 3, see `walk_chain`.
          TERMINAL_DISCARD_NO_ARGS = {"ok", "is_ok", "is_err", "unwrap_or_default"}
          TERMINAL_DISCARD_WITH_ARGS = {"unwrap_or", "unwrap_or_else", "map_or"}

          # `(:[^=;{}]*)?` — an optional type annotation between `_<ident>`
          # and `=` (`let _: Result<(), E> = ..`), otherwise it wouldn't match.
          LET_UNDERSCORE = re.compile(r'\blet\s+_\w*\s*(:[^=;{}]*)?=\s*[^;{}]*$')
          DROP_CALL = re.compile(r'\bdrop\s*\([^;{}]*$')
          # A bare `_ = expr;` (destructuring assignment, not `let`). The `\b`
          # before `_` avoids catching the end of an ordinary identifier like
          # `foo_ = ..` (there's no word boundary between `o` and `_` — both
          # are word characters); `(?!>)` avoids catching `_ => ..` (a match
          # arm).
          BARE_UNDERSCORE_ASSIGN = re.compile(r'\b_\s*=(?!>)\s*[^;{}]*$')
          # `if let Err(_e) = ..` — including inside a let-chain (`if let
          # Some(x) = y && let Err(_e) = ..`), where `if` doesn't sit
          # immediately before `let Err` — hence no `\bif\s+` at the start,
          # we look for `let Err(_ident) =` itself anywhere in the prefix.
          # By itself this does not mean a violation — see the empty-block
          # check below (finding 1 round 3).
          IF_LET_ERR_UNDERSCORE = re.compile(r'\blet\s+Err\s*\(\s*_\w*\s*\)\s*=\s*[^;{}]*$')
          BLOCK_COMMENT = re.compile(r'/\*.*?\*/', re.DOTALL)

          def strip_block_comments(text):
              # Replaces the contents of `/* .. */` with spaces, PRESERVING
              # newlines inside — line numbers for everything after don't
              # shift. Doesn't handle nested `/* /* */ */` (Rust allows this)
              # — a deliberately unclosed gap, a rare case for this file.
              def repl(m):
                  return ''.join(c if c == '\n' else ' ' for c in m.group(0))
              return BLOCK_COMMENT.sub(repl, text)

          CHAR_LITERAL = re.compile(r"'(\\u\{[0-9a-fA-F]+\}|\\.|[^'\\])'")

          def strip_line_comment(line):
              # A naive `line.split("//", 1)[0]` would cut the line at `//`
              # INSIDE a string literal too (`"http://x"`), hiding everything
              # further along the same line, including a real discard.
              # `set_path_with_query`/`set_authority` in this crate genuinely
              # accept strings of this shape — not a hypothetical risk.
              in_string = False
              i, n = 0, len(line)
              while i < n:
                  c = line[i]
                  if in_string:
                      if c == '\\' and i + 1 < n:
                          i += 2
                          continue
                      if c == '"':
                          in_string = False
                      i += 1
                      continue
                  if c == '"':
                      in_string = True
                      i += 1
                      continue
                  if c == "'":
                      # Could be a character literal ('x', '\n', '"',
                      # '\u{1F600}') or a lifetime ('a, 'static) — we skip a
                      # character literal whole, so that a `"` inside it
                      # ('"') doesn't desync the string tracker above
                      # (a round 3 finding, found by our own testing, not by
                      # the review — a false positive: without this,
                      # commented-out code after '"' on the same line would
                      # read as real). A lifetime isn't closed by `'`, the
                      # regex won't match, a lone `'` passes through as an
                      # ordinary character.
                      m = CHAR_LITERAL.match(line, i)
                      if m:
                          i = m.end()
                          continue
                      i += 1
                      continue
                  if c == '/' and i + 1 < n and line[i + 1] == '/':
                      return line[:i]
                  i += 1
              return line

          def match_parens(stream, open_paren_pos):
              depth = 0
              i = open_paren_pos
              n = len(stream)
              while i < n:
                  if stream[i] == '(':
                      depth += 1
                  elif stream[i] == ')':
                      depth -= 1
                      if depth == 0:
                          return i
                  i += 1
              return None

          def walk_chain(stream, pos):
              # Starting at `pos` (right after the closing paren of
              # `.set_x(..)`), walks the `.method(args)...` chain until it
              # hits `?` (propagation — nothing further counts) or a
              # non-chain character. Returns (method_names,
              # chain_end_position, propagated).
              methods = []
              i, n = pos, len(stream)
              while i < n:
                  while i < n and stream[i].isspace():
                      i += 1
                  if i < n and stream[i] == '?':
                      return methods, i + 1, True
                  if i < n and stream[i] == '.':
                      j = i + 1
                      name_start = j
                      while j < n and (stream[j].isalnum() or stream[j] == '_'):
                          j += 1
                      name = stream[name_start:j]
                      while j < n and stream[j].isspace():
                          j += 1
                      if j < n and stream[j] == '(':
                          close = match_parens(stream, j)
                          if close is None:
                              return methods, i, False
                          methods.append(name)
                          i = close + 1
                          continue
                      return methods, i, False
                  break
              return methods, i, False

          violations = []

          for path in sorted(ROOT.rglob("*.rs")):
              text = strip_block_comments(path.read_text())
              lines = text.splitlines()
              stream_chars = []
              char_line = []
              for lineno, line in enumerate(lines, start=1):
                  code = strip_line_comment(line)
                  for ch in code:
                      stream_chars.append(ch)
                      char_line.append(lineno)
                  stream_chars.append(' ')
                  char_line.append(lineno)
              stream = ''.join(stream_chars)

              for m in re.finditer(r'\.set_[a-z_]+\(', stream):
                  start = m.start()
                  end = match_parens(stream, m.end() - 1)
                  if end is None:
                      continue
                  line_no = char_line[start]
                  snippet = re.sub(r'\s+', ' ', stream[start:end + 1]).strip()

                  methods, chain_end, propagated = walk_chain(stream, end + 1)

                  discard_method = next(
                      (
                          name
                          for name in methods
                          if name in TERMINAL_DISCARD_NO_ARGS or name in TERMINAL_DISCARD_WITH_ARGS
                      ),
                      None,
                  )
                  if discard_method is not None:
                      chain_text = re.sub(r'\s+', ' ', stream[end + 1:chain_end]).strip()
                      violations.append(
                          (path, line_no, f"{snippet}{chain_text} [terminal: .{discard_method}(..)]")
                      )
                      continue

                  if propagated:
                      continue

                  stmt_start = max(
                      stream.rfind(';', 0, start),
                      stream.rfind('{', 0, start),
                      stream.rfind('}', 0, start),
                  ) + 1
                  prefix = stream[stmt_start:start]

                  matched_prefix = None
                  for pattern in (LET_UNDERSCORE, DROP_CALL, BARE_UNDERSCORE_ASSIGN):
                      if pattern.search(prefix):
                          matched_prefix = pattern
                          break
                  if matched_prefix is not None:
                      p = re.sub(r'\s+', ' ', prefix).strip()
                      violations.append((path, line_no, f"{p[-40:]} {snippet}"))
                      continue

                  # Finding 1 round 3: we search for `{` starting at
                  # `chain_end`, not `end` — so that
                  # `if let Err(_e) = opts.set_x(y).map_err(..) { }` also
                  # finds the CORRECT brace, not one of the braces inside
                  # `map_err`. Flag only if the content between `{` and its
                  # matching `}` is whitespace only: a non-empty block
                  # (`{ return Err(_e.into()); }`) is honest propagation,
                  # `_e` is used, not discarded.
                  if IF_LET_ERR_UNDERSCORE.search(prefix):
                      brace_pos = stream.find('{', chain_end)
                      if brace_pos != -1:
                          depth = 0
                          j = brace_pos
                          close_pos = None
                          while j < len(stream):
                              if stream[j] == '{':
                                  depth += 1
                              elif stream[j] == '}':
                                  depth -= 1
                                  if depth == 0:
                                      close_pos = j
                                      break
                              j += 1
                          if close_pos is not None and stream[brace_pos + 1:close_pos].strip() == '':
                              p = re.sub(r'\s+', ' ', prefix).strip()
                              violations.append((path, line_no, f"{p[-40:]} {snippet} {{ }}"))

          for path, line_no, snippet in violations:
              print(f"{path}:{line_no}: {snippet}")

          if violations:
              print(
                  "::error::found a discarded Result from a wasi:http setter "
                  "(let _ / let _ident / let _: Type / .ok() / .unwrap_or_default() / "
                  ".unwrap_or(..) / .unwrap_or_else(..) / .map_or(..) / .is_ok() / .is_err() "
                  "— at any position in a combinator chain, not only right after the call — "
                  "/ drop(..) / a bare `_ = ..` / `if let Err(_e) = ..` with an empty block — "
                  "on one line or via a rustfmt wrap) — every host refusal must "
                  "become a typed Error, see crates/http-ng-wasi/src/convert.rs"
              )
              sys.exit(1)
          PYEOF

  fuzz-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - run: cargo install cargo-fuzz --locked
      - run: cargo fuzz run sse -- -max_total_time=60
        working-directory: crates/http-ng-proto/fuzz
      - run: cargo fuzz run sse_accounting -- -max_total_time=30 -max_len=256
        working-directory: crates/http-ng-proto/fuzz

  # ── invariants from the spec ────────────────────────────────────────────
  proto-is-sans-io:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: no async deps in http-ng-proto
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -d crates/http-ng-proto ]; then
            echo "::error::http-ng-proto is missing — every crate in this workspace exists, so this is a broken path or a renamed crate, not a not-yet-written one; the check must run, not skip"
            exit 1
          fi
          tree="$(cargo tree -p http-ng-proto -e normal --prefix none)"
          if printf '%s\n' "$tree" | grep -Ei '^(tokio|futures-|async-|smol|compio)'; then
            echo "::error::http-ng-proto picked up an async dependency"
            exit 1
          fi
      - name: no async fn in http-ng-proto
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -d crates/http-ng-proto/src ]; then
            echo "::error::http-ng-proto is missing — every crate in this workspace exists, so this is a broken path or a renamed crate, not a not-yet-written one; the check must run, not skip"
            exit 1
          fi
          if grep -rn "async fn" crates/http-ng-proto/src \
               | grep -vE '^[^:]+:[0-9]+:[[:space:]]*(//|/\*|\*)'; then
            echo "::error::the sans-io crate contains an async fn"
            exit 1
          fi

  # The `idn` feature has to be a real switch in both directions, and the
  # `url` dependency it replaced has to be really gone. Three failure modes
  # this job exists for, all of which look green without it:
  #
  #   1. `url` creeps back into `[dependencies]` — the whole point of
  #      writing RFC 3986 §5.2 out by hand was that one `Url::join` call
  #      pulled `idna` + four ICU data crates into every build of the
  #      sans-io crate, on every target.
  #   2. `--no-default-features` stops removing the Unicode tables, because
  #      somebody depended on `http-ng-proto` with default features
  #      somewhere in the workspace and cargo unioned the feature back on.
  #      That is exactly why `[workspace.dependencies]` carries
  #      `default-features = false` for it, and it is invisible in any
  #      build that happens to want `idn` anyway.
  #   3. The feature switch survives but its OFF path is never compiled or
  #      run: `cargo test --workspace --all-features` turns `idn` ON, so
  #      every `#[cfg(not(feature = "idn"))]` test in the workspace is
  #      dead code as far as the rest of CI is concerned.
  #
  # Fails closed on a broken `cargo tree` invocation, the same way
  # `ambient-has-no-tokio` does: an empty tree would otherwise satisfy
  # every "must not contain" assertion below.
  idn-feature-is-real:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@nextest
      - name: url is gone from http-ng-proto, with the feature either way
        shell: bash
        run: |
          set -euo pipefail
          for flags in "" "--no-default-features"; do
            # shellcheck disable=SC2086
            tree_out="$(cargo tree -p http-ng-proto -e normal --prefix none $flags)" || tree_rc=$?
            tree_rc="${tree_rc:-0}"
            if [ "$tree_rc" -ne 0 ]; then
              echo "::error::cargo tree failed (exit $tree_rc) for http-ng-proto ${flags:-with default features} — a check that cannot run must not pass"
              exit 1
            fi
            if [ -z "$tree_out" ]; then
              echo "::error::cargo tree produced no output for http-ng-proto ${flags:-with default features} — an empty tree satisfies every 'must not contain' below, so this is a failure, not a pass"
              exit 1
            fi
            if printf '%s\n' "$tree_out" | grep -Eq '^(url|form_urlencoded|percent-encoding) '; then
              echo "::error::http-ng-proto ${flags:-with default features} depends on url again — RFC 3986 §5.2 is written out in src/uri.rs precisely so that it does not; url belongs in [dev-dependencies], where it is the oracle for tests/uri_resolution.rs"
              printf '%s\n' "$tree_out" | grep -E '^(url|form_urlencoded|percent-encoding) '
              exit 1
            fi
          done
      - name: without idn there are no Unicode tables at all
        shell: bash
        run: |
          set -euo pipefail
          tree_out="$(cargo tree -p http-ng-proto -e normal --prefix none --no-default-features)"
          if [ -z "$tree_out" ]; then
            echo "::error::cargo tree produced no output — fails closed"
            exit 1
          fi
          if printf '%s\n' "$tree_out" | grep -Eq '^(idna|idna_adapter|icu_)'; then
            echo "::error::--no-default-features still pulls in idna/ICU. This is the entire measurable benefit of the feature (icu_properties_data alone is 1.9 MB of vendored source). Most likely cause: some crate in the workspace depends on http-ng-proto WITH default features, and cargo unioned idn back on — check [workspace.dependencies], which sets default-features = false for exactly this reason."
            printf '%s\n' "$tree_out" | grep -E '^(idna|idna_adapter|icu_)'
            exit 1
          fi
          # And the same for the facade, which is what a consumer actually
          # depends on: `http-ng`'s own `idn` is in its `default`, so this
          # only holds if the forwarding is wired up correctly.
          facade="$(cargo tree -p http-ng -e normal --prefix none --no-default-features)"
          if [ -z "$facade" ]; then
            echo "::error::cargo tree produced no output for http-ng — fails closed"
            exit 1
          fi
          if printf '%s\n' "$facade" | grep -Eq '^(idna|idna_adapter|icu_)'; then
            echo "::error::http-ng --no-default-features still pulls in idna/ICU — the facade's idn feature is not actually forwarding, or something else in its graph turns it on"
            printf '%s\n' "$facade" | grep -E '^(idna|idna_adapter|icu_)'
            exit 1
          fi
      - name: with idn the Unicode tables ARE there
        shell: bash
        run: |
          set -euo pipefail
          # The other direction, and not a formality: if this stops holding,
          # the two "must not contain" checks above pass for the wrong
          # reason and IDN support has silently disappeared.
          tree_out="$(cargo tree -p http-ng-proto -e normal --prefix none)"
          if ! printf '%s\n' "$tree_out" | grep -q '^idna '; then
            echo "::error::the default build of http-ng-proto has no idna — the idn feature is in [features] default, so either it was removed or the dependency is no longer reached; without it the checks above prove nothing"
            exit 1
          fi
      - name: the feature-off path is compiled and run, not merely declared
        shell: bash
        run: |
          set -euo pipefail
          # `cargo test --workspace --all-features` (the `test` job) turns
          # `idn` ON. Every `#[cfg(not(feature = "idn"))]` test — the typed
          # `NonAsciiHost` error and the divergence list that names what a
          # build without Unicode tables gives up — runs only here.
          out="$(cargo nextest run -p http-ng-proto --no-default-features 2>&1)"
          printf '%s\n' "$out"
          if ! printf '%s\n' "$out" | grep -qE '^[[:space:]]*Summary.*tests run'; then
            echo "::error::nextest did not report a summary for http-ng-proto --no-default-features — the run did not happen"
            exit 1
          fi
          out="$(cargo nextest run -p http-ng --no-default-features --features test-util 2>&1)"
          printf '%s\n' "$out"
          if ! printf '%s\n' "$out" | grep -qE '^[[:space:]]*Summary.*tests run'; then
            echo "::error::nextest did not report a summary for http-ng --no-default-features — the run did not happen"
            exit 1
          fi
      - name: clippy is clean with the feature off too
        shell: bash
        run: |
          set -euo pipefail
          cargo clippy -p http-ng-proto --all-targets --no-default-features -- -D warnings
          cargo clippy -p http-ng --all-targets --no-default-features --features test-util -- -D warnings

  no-declared-send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: no Send/Sync bounds declared in core surface
        shell: bash
        run: |
          set -euo pipefail
          # `http-ng-wasi/src` has been in the list since Task 15 (review
          # round 1, Finding 4): the invariant protects consumers from
          # Send/Sync bounds that constrain them, and a transport can leak
          # the same class of bound in its public API no less than the core
          # — leaving it unscanned had been a default, not a deliberate
          # decision that it's out of scope. The `send-bound-exception`
          # marker still allows justified exceptions, so widening the
          # coverage costs nothing wherever the bound is warranted.
          #
          # `http-ng-proto/src` — m3 of the branch's final review. The
          # review seeded `pub trait Probe: Send + Sync {}` into
          # `http-ng-proto/src/redirect.rs` and the check stayed green,
          # whereas the same line in `http-ng/src/client.rs` was caught.
          # Harmless today — proto declares no such bounds and its types
          # don't reach the seam yet; it will stop being harmless once the
          # Alt-Svc cache and the Happy Eyeballs scheduler (spec §5.4, §5.6)
          # show up there and their types start flowing through `Client`.
          # One word added to the list ahead of time, not after.
          #
          # `http-ng-rt/src` — Task 1 of vertical 2. The same class of miss
          # as above with `http-ng-proto/src`: the crate didn't exist when
          # the list was written, so its absence here would be a fact of
          # history, not a decision that bounds in it are out of scope.
          # `Blocking::run` in this crate declares `Send` in the capability
          # trait itself (see `amendment-C5` further down in the filter and
          # in the spec) — exactly the case this check must see and pass via
          # the marker, not miss by oversight.
          #
          # `http-ng-native/src` — Task 13 of vertical 2. The scan is
          # DELIBERATELY NOT the whole workspace (unlike `no-unsafe-code`'s
          # `crates/*/src`): runtime- and backend crates legitimately carry
          # `Send` on CAPABILITIES (bounds on a trait, like `Blocking::run`
          # above) and on impls of concrete types against a concrete foreign
          # API (e.g. `Spawn<F: Send + 'static> for Tokio` in
          # `http-ng-rt-tokio`) — scanning those wholesale would mean
          # requiring a marker on every such impl, of which there are many
          # and which aren't about the invariant "the core doesn't declare
          # Send/Sync". That exclusion is expressed below as a named set
          # subtracted from a glob, NOT as an inclusion list: see the block
          # at the `case` statement for why the inclusion list was wrong in
          # one direction and a bare glob wrong in the other. There used to be no point scanning
          # `http-ng-native` — before Task 13 the crate exported nothing
          # publicly except `testing` (see `#[doc(hidden)] pub mod testing`
          # in `src/lib.rs`). With Task 13 it gained a genuine public type,
          # `Native: Transport`, and it is just as able to leak the same
          # class of `Send` bound in its public API as the core — the same
          # argument that already brought `http-ng-wasi/src` here. Checked
          # before adding (not after): `Native`'s struct,
          # `impl Transport for Native`, and its own public methods declare
          # neither `Send` nor `Sync` anywhere — all the bounds in its
          # where-clause (`R::Stream: 'static`, `T::Stream<R::
          # Stream>: 'static`, etc.) aren't about `Send`/`Sync` at all.
          # Adding this directory required NOT ONE new marker on `Native`
          # itself — exactly what Task 11 already verified for the rest of
          # the crate. The only thing the check found in this crate's
          # `src/` was `body.rs`'s
          # `Inner::Streaming(Box<dyn Body<..> + Unpin + Send>)`, the same
          # C2 bound already marked in `http-ng-core/src/body.rs:59`, and
          # one C3-violating test (`B::Error: .. + Send + Sync` inside
          # `#[cfg(test)] mod tests`), moved into `tests/shape.rs` by the
          # same technique as the analogous tests in
          # `http-ng-core`/`http-ng-wasi`. Neither was an "impl bound" —
          # exactly the condition under which the Task 13 brief asked to
          # reformulate this rule instead of marking the code — that
          # condition didn't apply here: both cases found are exactly the
          # class "declared Send on a data structure / a test" for which
          # the marker and the C3 relocation already exist as the standard
          # answer everywhere in this file.
          #
          # `http-ng-fetch/src` — Task 5 of vertical 3. The same argument a
          # third time: before this task the crate exported `Fetch`
          # (construction/probing only) plus a `#[doc(hidden)] pub mod
          # testing` — no genuine public seam yet. Task 5 gives it one,
          # `impl Transport for Fetch`, so it can leak a `Send`/`Sync`
          # bound in its public API exactly as `Native`/`WasiHttp` could.
          # Checked before adding, not after: `grep -rnE '(:|\+)[[:space:]]*
          # (Send|Sync)\b|MaybeSend' crates/http-ng-fetch/src` (this job's
          # own pattern, run locally) finds four lines, all four inside
          # `///` doc comments in `promise.rs` quoting upstream
          # `wasm-bindgen` source (`unsafe impl Send for JsValue {}` and
          # neighbors) — the existing comment filter below drops every one
          # of them, so adding this directory requires zero new markers,
          # the same clean result Task 13 recorded for `Native`.
          # A GLOB MINUS A NAMED EXCLUSION SET — not a hand-maintained
          # inclusion list, and not a bare `crates/*/src` either. Both of
          # those were tried and both were wrong, in opposite directions.
          #
          # The inclusion list came first: seven directories, each dropped if
          # absent, failing only when ALL seven were gone. Renaming one
          # crate's directory therefore removed it from the scan silently,
          # with the workspace still building, because `cargo` resolves a
          # package by its manifest rather than its path. A reviewer
          # reproduced it: a real `Send` violation planted in
          # `http-ng-fetch` was caught, and the same violation with the
          # directory renamed was not.
          #
          # Replacing it with a bare glob then broke the job on a clean tree
          # — eight violations, all legitimate. The excluded crates were not
          # drift, they were a considered decision recorded above: a runtime
          # backend's `impl<F: Future + Send + 'static> Spawn<F> for Tokio`
          # is a bound on a concrete type against a concrete foreign API, not
          # the invariant this job polices (that the CORE does not declare
          # `Send`/`Sync`). Scanning them wholesale would demand a marker on
          # every such impl, of which there are many and none of which are
          # about the invariant.
          #
          # The exclusion set keeps both properties. A crate added later is
          # scanned by default rather than by remembering to add it. A crate
          # excluded on purpose is one greppable line saying so. And a MOVE
          # of an excluded crate re-enters the scan, because the `case` arm
          # stops matching — so the shape fails closed in the direction the
          # inclusion list failed open.
          shopt -s nullglob
          all=(crates/*/src)
          if [ ${#all[@]} -eq 0 ]; then
            echo "::error::crates/*/src matched no directory — the workspace layout changed or the glob itself is broken; this check must see at least one crate"
            exit 1
          fi
          dirs=()
          for d in "${all[@]}"; do
            case "$d" in
              # Runtime backends: `Spawn`/`Blocking` impls carry `Send` on a
              # concrete type against tokio's and smol's own APIs.
              crates/http-ng-rt-tokio/src|crates/http-ng-rt-smol/src) ;;
              # `Blocking::run`'s signature is `T: Send + 'static, F: FnOnce()
              # -> T + Send + 'static` — the bound the trait itself requires.
              crates/http-ng-dns-system/src) ;;
              *) dirs+=("$d") ;;
            esac
          done
          if [ ${#dirs[@]} -eq 0 ]; then
            echo "::error::every crate directory was excluded — the exclusion set has outgrown the workspace and this check now scans nothing"
            exit 1
          fi
          # We look for DECLARED bounds, not mentions in docs: lines whose
          # content starts with a comment are dropped by the second grep.
          #
          # The third grep subtracts lines carrying the `send-bound-exception`
          # marker — a PER-LINE, not a per-file, exception. Before Task 12
          # fix round 1 this list was per-file (`! -path .../error.rs` and
          # `.../body.rs`): the review found this to be a blind spot for the
          # whole file — for example, `trait FakeSeamTrait: Send + Sync {}`
          # inserted anywhere in such a file would pass CI unnoticed, and
          # `client.rs` was a third such file even before Task 13 started
          # changing it further. The marker narrows the exception to a
          # specific line: only that line is skipped, the rest of the
          # file's text (including new code later tasks will add) is still
          # scanned.
          #
          # The marker is a CLAIM, not a way to silence the check: every
          # marked line must name the amendment (C1, C2, or C5, Latin C)
          # from `docs/superpowers/specs/2026-08-05-http-ng-design.md` that
          # justifies it.
          #
          # A RULE, not a list of specific lines (Task 13 fix round 2): any
          # generic function that wraps a foreign error into `Error::new` —
          # and therefore requires `Send + Sync` from it, because `Error`
          # stores its source as `Arc<dyn Error + Send + Sync>` — must
          # repeat that bound in its own where-clause: Rust does not
          # propagate bounds through a call. The number of markers grows
          # not line-by-line with the crate, but with the number of
          # INDEPENDENT such call chains; today there are four:
          # `Client::execute` (client.rs), `Response::chunk`+`collect`,
          # sharing one bound (response.rs), `RequestBuilder::send`, which
          # calls `Client::execute` and must repeat its bound (request.rs),
          # and `SseStream::next` (Task 14, sse.rs), which calls
          # `Response::chunk` and for the same reason must repeat its bound
          # — plus two original spots outside this chain:
          # `http-ng-core/src/error.rs` (the `source` field and the
          # `Error::new` bound of the type itself) and
          # `http-ng-core/src/body.rs` (`RewindFactory`, the `Streaming`
          # variant, and the `rewindable` bound — C2, about the same
          # auto-trait erasure, but in the `RequestBody` trait objects,
          # not in `Error::new`). The list of specific lines has been
          # manually rewritten twice already, chasing the count (5→6→8),
          # and will drift again just as easily; check the rule, don't
          # recount the markers.
          #
          # The Task 13 review considered and rejected two alternatives to
          # this rule: (1) a shared wrapper helper for `Error::new` —
          # doesn't help, the compiler still requires the bound at the
          # helper's call site, a clean +1 marker for no gain; (2) raise the
          # bound onto the whole `impl` block of `Client<T>` — compiles, but
          # breaks `Client::builder`, `.get`, `.transport`, `.config` for a
          # transport with an honestly `!Send` error — a regression of
          # exactly the property bounds live in separate where-clauses,
          # rather than on the trait, for. A trait alias that hides the
          # bound from grep (a `MaybeSend`-like wrapper) would not narrow
          # the exception but conceal it — the design explicitly rejects
          # this trick.
          #
          # A new marker without a matching amendment in the spec is grounds
          # for review, not for a green CI. The marker filter itself was
          # also narrowed (Task 13 fix round 1): previously
          # `grep -v 'send-bound-exception'` skipped ANY line containing
          # that substring — including a marker with a made-up
          # justification. Now the line must contain
          # `send-bound-exception:` and an actual reference to amendment
          # C1, C2, or C5.
          #
          # Round 2 latinized the amendment token itself (`C1`/`C2`,
          # previously written with U+0421 CYRILLIC CAPITAL LETTER ES in
          # place of the Latin C, so it read as "C1"/"C2" but wasn't): that
          # Cyrillic letter is visually indistinguishable from the Latin
          # `C`, which meant an ASCII search like
          # `grep -rn "amendment-C1" .` found neither the marker nor the
          # heading in the spec that justifies it — a reviewer who
          # conscientiously searched for amendment C1 didn't find it
          # (because the marker used the Cyrillic lookalike, not the ASCII
          # letter) and correctly reported the exception as unjustified.
          # This doesn't close the hole completely (one could still make up
          # "amendment-C1"), but it raises the bar above "any string" and
          # makes every claim findable by an ordinary ASCII search against
          # the two amendments that exist today.
          #
          # Task 1 of vertical 2 widened the filter class from `C[12]` to
          # `C[125]`: `http-ng-rt::Blocking` — the first exception whose
          # bound doesn't come from auto-trait erasure on the
          # `Client -> Transport` path (C1/C2), but from a foreign API
          # (`tokio::task::spawn_blocking`, `blocking::unblock`) that
          # requires `Send + 'static` in its own signature — a new class,
          # hence a new amendment (C5 in the spec), not a reuse of C1/C2.
          # `C3` and `C4` are deliberately not in the filter: they aren't
          # about exceptions to this invariant (C3 is the convention for
          # where `assert_send` tests live, C4 is about
          # `&'static [HeaderName]`) and never appear as a
          # `send-bound-exception` marker in the code.
          if grep -rnE '(:|\+)[[:space:]]*(Send|Sync)\b|MaybeSend' "${dirs[@]}" \
               | grep -vE '^[^:]+:[0-9]+:[[:space:]]*(//|/\*|\*)' \
               | grep -vE 'send-bound-exception:[[:space:]]*amendment-C[125]\b'; then
            echo "::error::the core declares a Send or Sync bound without a send-bound-exception marker"
            exit 1
          fi

  no-unsafe-code:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: no unsafe code regression in any crate
        shell: bash
        run: |
          set -euo pipefail
          # REVISED in Task 6, fix round 1 (see below, after the history).
          #
          # The FIRST and primary line of defense is not this job but the
          # compiler itself: every crate but one carries
          # `#![forbid(unsafe_code)]` (not `#![deny(...)]` — a decision
          # from Task 2, fix round 1), and it is checked on every build of
          # the `test` matrix (linux/macos/windows). The difference
          # between `forbid` and `deny` is not cosmetic — verified by
          # planting a probe right in this tree and reverting via `cp`:
          # with `#![deny(unsafe_code)]` a local `#[allow(unsafe_code)]`
          # next to an `unsafe` block compiled CLEANLY (the compiler
          # stayed silent, `-D warnings` didn't help either — `allow`
          # suppresses a lint rather than turning it into a warning); with
          # `#![forbid(unsafe_code)]` the same file fails with `E0453
          # (allow incompatible with previous forbid)` — `forbid` cannot
          # be overridden from inside a crate, PERIOD. The compiler
          # catches the same thing this job would, but earlier (at compile
          # time, rather than as a separate CI step) and without a single
          # grep pattern that can be defeated by formatting, a string, or
          # an attribute split across two lines.
          #
          # THE ONE EXCEPTION (Task 1 of vertical 3, spec amendment C7):
          # `http-ng-fetch` carries the project's sole legitimate `unsafe`
          # (a `Send` adapter over a JS promise) and therefore
          # `#![deny(unsafe_code)]` instead — `forbid` cannot be locally
          # relaxed for its one justified `#[allow]`, by the same E0453
          # verified above. That crate opts out of `[lints] workspace =
          # true` for exactly this reason (see its `Cargo.toml`). This job
          # still scans it like any other crate — see the marker mechanism
          # below, which is precisely what continues to catch an
          # UNJUSTIFIED `unsafe` there, now that the compiler alone no
          # longer can.
          #
          # THIS job is a second, independent layer, not the first: it
          # catches the CASE WHERE `#![forbid(unsafe_code)]` ITSELF
          # DISAPPEARED FROM THE FILE (erased during a refactor, lost in a
          # merge, a file copied without its header) — at that point the
          # compiler no longer participates at all, and only an external
          # text scan catches the regression. This cause — a line vanishing
          # from a file — has nothing to do with whether the crate does
          # I/O: a file loses the attribute just as easily in the
          # `futures-io` → `hyper::rt` bridge as in a plain trait contract
          # with not a single system call. Hence the scope is every crate in
          # the workspace, `crates/*/src`, not a subset guessed from what
          # each crate could do at the moment this job was written.
          #
          # HISTORY (why the list used to be short, and why that was a
          # scaling mistake, not a decision on the merits). The job began in
          # Task 2 of vertical 2 with one directory (`http-ng-rt/src`, the
          # first crate with the `futures-io` → `hyper::rt` bridge), and
          # each of the next three tasks added its own directory as its own
          # crate appeared: Task 3 — `http-ng-rt-tokio` (its own bridge,
          # `TokioIo` → `hyper::rt`), Task 4 — `http-ng-rt-smol` (doesn't
          # write a bridge again, but has its own non-blocking `connect()`),
          # Task 6 — `http-ng-dns`, added per a direct checklist item of the
          # vertical, DESPITE the fact that it is no longer a bridge and not
          # I/O at all — the first signal that the "runtime bridges" frame
          # was a description of the history of additions, not a deliberate
          # boundary of coverage. This round's review (fix round 1) pointed
          # this out directly: the frame explained WHEN the job was written,
          # not WHAT FOR it exists, and the "what for" — detecting a missing
          # attribute — is true for `http-ng-core` and `http-ng-proto`
          # exactly as much as for `http-ng-rt-smol`, and both were SILENTLY
          # out of scope not by decision but by the oversight of a list that
          # grew one directory per task. A list of directories that has to
          # be remembered at the tenth crate is exactly the class of drift
          # that already broke `sse-complexity-guard` (see its comment) and
          # this very workflow file (see `workflow-yaml-is-valid`) earlier
          # in this repository. The fix is not "remember it an eleventh
          # time" but not leaving forgetting as an option: the
          # `crates/*/src` glob below picks up future crates by itself,
          # with no edit to this file.
          #
          # A one-time manual check (`! grep -rn "unsafe" crates/http-ng-rt/src
          # && echo OK`, the literal Step 5 of task 2's brief) was rejected
          # for two reasons, both found empirically by running it against
          # the real tree, not assumed:
          #
          # 1. It prints `OK` when the directory doesn't exist at all
          #    (`grep -r` on a missing path fails with an error, `!`
          #    inverts that into success) — "passed" and "nothing to check"
          #    become indistinguishable, exactly the class of check that
          #    misleads with a silent green.
          # 2. A bare `grep -rn "unsafe"` on TODAY's code, clean of unsafe,
          #    already finds matches and would have failed: `lib.rs`
          #    declares `#![forbid(unsafe_code)]` (the substring `unsafe`
          #    inside the literal name `unsafe_code`), and doc comments in
          #    some crates (e.g. `http-ng-rt/src/futures_io.rs`) discuss why
          #    zero-copy would require `unsafe`. A plain grep does not
          #    distinguish "the code declares unsafe forbidden" and "the
          #    text mentions unsafe" from an actual `unsafe` block.
          #
          # The filter below solves both: (a) it drops lines whose content
          # starts with a comment — the same trick as in
          # `no-declared-send`; (b) it separately drops
          # `deny(unsafe_code)`/`forbid(unsafe_code)` — that is a
          # DECLARATION of the ban, not a workaround. `allow(unsafe_code)`
          # and `expect(unsafe_code)` are NOT dropped, deliberately — if a
          # crate ever rolls back to `deny` (a regression in itself, but
          # this job doesn't check that separately) or loses the attribute
          # altogether, `allow(unsafe_code)` next to a real `unsafe` block
          # must remain visible to the text scan. Verified on a synthetic
          # fixture outside the tree: `unsafe { … }` and
          # `#[allow(unsafe_code)]` are both caught, `#![deny(unsafe_code)]`
          # is not.
          #
          # And a one-time run only protects the code at the moment it
          # runs: nobody catches the next commit that adds unsafe a month
          # later. Hence a standing job with an explicit `if`/`then`/`exit 1`,
          # rather than a one-line grep trick.
          #
          # `shopt -s nullglob` plus the explicit empty-array check below is
          # the same discipline as all the guard jobs in this file
          # ("passed" and "nothing to check" must not be indistinguishable),
          # but with the opposite default outcome: the other guards in this
          # file print `::notice::` and exit zero while their crate hasn't
          # appeared yet (legitimate in the vertical's early tasks). Here,
          # though, `crates/` is not a future directory but one that has
          # existed since Task 1; if `crates/*/src` matched nothing, that is
          # not "too early" but a broken workspace layout or a broken glob
          # itself, and the job must fail rather than pass quietly.
          # REVISED again in Task 1 of vertical 3 (`http-ng-fetch`). This
          # vertical's Global Constraints put the project's one legitimate
          # `unsafe` right here — a `Send`-compatible promise adapter that
          # mirrors what wasm-bindgen itself does for `JsValue` under
          # `#[cfg(not(target_feature = "atomics"))]` (see spec amendment
          # C7 for the full argument, and `http-ng-fetch/src/promise.rs`
          # for the code). A bare directory exclusion was rejected for the
          # same reason `no-declared-send`'s per-file exclusions were
          # rejected and replaced by a per-line marker (see that job's own
          # comment, Task 12 fix round 1): excluding
          # `crates/http-ng-fetch/src` wholesale would hide any OTHER
          # `unsafe` later added to that crate, not just the one already
          # justified — a crate-shaped hole defeats the point of scanning
          # `crates/*/src` unconditionally in the first place.
          #
          # So this job gets the same mechanism `no-declared-send` already
          # has, under its own token: a line must read
          # `unsafe-code-exception: amendment-C7` to be excused, and ONLY
          # that exact citation — not `send-bound-exception` (a different
          # invariant, a different job) and not some other amendment
          # number. `promise.rs` marks both lines the raw scan would
          # otherwise flag: the `unsafe_code,` inside `#[allow(unsafe_code,
          # reason = "...")]`, and the `unsafe impl<T> Send for
          # SingleThreaded<T> {}` line itself.
          #
          # REVISED, fix round 1: the marker text alone is not enough.
          # `send-bound-exception` legitimately appears across many files
          # and genuinely cannot be scoped to one path — that job's own
          # comment already says the marker is a claim enforced by review,
          # not a forgery-proof mechanism. C7 is a different case: it has
          # exactly ONE legitimate location in the entire project, and
          # that location is knowable ahead of time, in the job itself.
          # A reviewer probe confirmed the gap directly: planting the
          # literal text `unsafe-code-exception: amendment-C7` next to an
          # unrelated `unsafe` block in `http-ng-core/src/lib.rs` (a
          # different crate) passed the job as written before this
          # revision — the grep matched the marker text with no regard for
          # which file it was in. Fixed by requiring the marker to appear
          # on a line whose PATH is exactly
          # `crates/http-ng-fetch/src/promise.rs`; anywhere else, the same
          # marker text no longer excuses anything, and the line falls
          # through to the failure branch like any unmarked `unsafe`.
          #
          # Verified in all four directions, not assumed: (1) the two
          # marked lines in `promise.rs` pass; (2) a synthetic unmarked
          # `unsafe { }` planted in any crate's `src` still fails; (3) a
          # marker citing a nonexistent amendment (`unsafe-code-exception:
          # amendment-C9`) still fails, because the filter below matches
          # `amendment-C7` exactly and nothing else; (4) the exact marker
          # text, correctly citing `amendment-C7`, planted next to an
          # unrelated `unsafe` block in a DIFFERENT crate's `src` still
          # fails, because the filter below also requires the file path.
          #
          # EXTENDED in vertical 3 (`http-ng-dns-system`, spec amendment
          # C8) with a SECOND marked file, and deliberately not by
          # loosening the first one. A system SVCB/HTTPS lookup needs
          # `res_query(3)`: `getaddrinfo` cannot return RR type 65 in
          # principle, and neither `libc` 0.2.189 nor `rustix` 1.1.4
          # declares `res_query` (checked against the vendored sources of
          # both), so the crate declares the foreign function itself. That
          # is `unsafe` by construction, and no amount of care makes it
          # otherwise.
          #
          # The scope is kept as narrow as C7's, by the same mechanism and
          # for the same reason: a per-line marker, `unsafe-code-exception:
          # amendment-C8`, that only excuses a line whose PATH is exactly
          # `crates/http-ng-dns-system/src/sys/res_query.rs` or
          # `.../sys/windows.rs` — the crate's two FFI boundaries, one per
          # platform family, and nothing else in the crate. Both files exist
          # to be small: `res_query.rs` declares one foreign function, calls
          # it into a buffer it sized itself, and returns an owned
          # `Vec<u8>`; `windows.rs` calls `DnsQuery_UTF8` and walks the
          # `DNS_SVCB_DATA` the OS has already parsed, so it reads no DNS
          # bytes at all. Neither interprets a wire format. The decoding
          # (over data an attacker on the network chooses) is
          # `dns-message-parser`'s, and the RFC 9460 client rules are in
          # `svcb.rs`, which carries its own `#![forbid(unsafe_code)]`, as
          # does `sys/unsupported.rs`; only the crate root and `sys/mod.rs`
          # drop to `deny`, because `forbid` propagates into child modules
          # and would make the FFI modules impossible. So an `unsafe` block
          # added anywhere else in that crate — including `sys/mod.rs`, one
          # directory level from the marked file — still fails this job.
          #
          # The two markers do not substitute for each other: each grep
          # below pins one amendment token to one path, so C7's marker in
          # the DNS crate fails and C8's marker in `promise.rs` fails.
          # Verified in six directions on this tree, not assumed: (1) the
          # three real marked lines in `res_query.rs` pass; (2) an unmarked
          # `unsafe` planted in `sys/mod.rs` (same crate, one level up)
          # fails; (3) an unmarked `unsafe` planted in another crate's
          # `src` fails; (4) a C8 marker citing a nonexistent amendment
          # (`amendment-C9`) fails; (5) the exact C8 marker planted next to
          # an `unsafe` block in a DIFFERENT file fails; (6) swapping the
          # two files' tokens — C7's marker in `res_query.rs`, C8's in
          # `promise.rs` — fails both.
          #
          # THE MARKER MOVES UNDER `cargo fmt`, AND THIS JOB HAS TO KNOW
          # THAT. Found while adding C8, and the reason for the `awk` below
          # rather than a plain `grep -rn`. Measured on a probe crate, not
          # reasoned about: rustfmt PRESERVES a trailing comment that
          # follows a complete expression or a comma-terminated list
          # element, and MOVES one that follows the opening brace of a
          # block-bodied item down onto the next line.
          #
          #   #![allow(unsafe_code, // marker      -> preserved
          #   unsafe { getpid() }   // marker      -> preserved
          #   let n = unsafe { … }; // marker      -> preserved
          #   unsafe extern "C" {   // marker      -> MOVED into the block
          #   unsafe fn f() {       // marker      -> MOVED
          #
          # A leading `/* marker */ unsafe extern "C" {` and an inline
          # `unsafe extern "C" { /* marker */` are moved as well, so no
          # placement keeps a marker on such a line. C7 never hit this: its
          # two lines are `#[allow(unsafe_code, …` and `unsafe impl … {}`,
          # both forms rustfmt keeps. C8's FFI needs `unsafe extern "C" {`
          # and `unsafe extern "system" fn f(`, which are exactly the forms
          # it breaks. And `prek` runs `cargo fmt --all`, not `--check`, so
          # a marker written on the right line does not stay there — this
          # job would fail on a tree whose only sin was being formatted.
          #
          # The rule is therefore "on the line, or on the line IMMEDIATELY
          # below it", which is precisely and deterministically where
          # rustfmt puts it, implemented by folding a lone marker line onto
          # its predecessor before the scan. This is NOT a relaxation to
          # per-file: the marker must still be adjacent to the line it
          # excuses, and still in a file its amendment names. A marker two
          # lines away, or anywhere else in the file, excuses nothing.
          #
          # EXACTLY TWO POSITIONS ARE ACCEPTED, and the one people reach for
          # first is not among them:
          #
          #   unsafe { b() } // unsafe-code-exception: amendment-CN   OK
          #
          #   unsafe extern "C" {                                    OK
          #       // unsafe-code-exception: amendment-CN                (rustfmt puts it here)
          #
          #   // unsafe-code-exception: amendment-CN                  NOT OK
          #   unsafe { b() }                                           (excuses the line ABOVE it)
          #
          # The fold attaches a lone marker line to its PREDECESSOR, so a
          # marker written above a construct excuses whatever precedes it —
          # usually a line with no `unsafe` in it — and the construct itself
          # stays flagged. Worth spelling out because Rust attributes are
          # written above the item they apply to, so writing the marker
          # there is the natural first guess. The failure direction is safe
          # (a false red, never a false green), so the fold is not changed
          # to look both ways: looking up as well would let one marker
          # excuse two different `unsafe` lines.
          shopt -s nullglob
          dirs=(crates/*/src)
          if [ ${#dirs[@]} -eq 0 ]; then
            echo "::error::crates/*/src matched no directory — the workspace layout changed or the glob itself is broken; this check must see at least one crate"
            exit 1
          fi
          # Emits `path:lineno:line`, exactly as `grep -rn` would, except
          # that a following line consisting only of an
          # `unsafe-code-exception` comment is appended to the line before
          # it. `find` rather than a glob so the scan reaches `src/sys/*.rs`
          # and any other subdirectory; `-print0` / `read -d ''` so a path
          # containing a space cannot split into two filenames.
          scan() {
            find "${dirs[@]}" -type f -name '*.rs' -print0 |
              while IFS= read -r -d '' file; do
                awk -v f="$file" '
                  { line[NR] = $0 }
                  END {
                    for (i = 1; i <= NR; i++) {
                      out = line[i]
                      if (i < NR && line[i+1] ~ /^[[:space:]]*(\/\/|\/\*)[[:space:]]*unsafe-code-exception:/) {
                        out = out " " line[i+1]
                      }
                      print f ":" i ":" out
                    }
                  }' "$file"
              done
          }
          if scan | grep "unsafe" \
               | grep -vE '^[^:]+:[0-9]+:[[:space:]]*(//|/\*|\*)' \
               | grep -vE '(deny|forbid)\(unsafe_code\)' \
               | grep -vE '^crates/http-ng-fetch/src/promise\.rs:[0-9]+:.*unsafe-code-exception:[[:space:]]*amendment-C7\b' \
               | grep -vE '^crates/http-ng-dns-system/src/sys/(res_query|windows)\.rs:[0-9]+:.*unsafe-code-exception:[[:space:]]*amendment-C8\b'; then
            echo "::error::found unsafe (including a possible #[allow(unsafe_code)]) without a matching unsafe-code-exception marker, across ${#dirs[@]} directories (${dirs[*]}). Every crate must remain safe unless explicitly marked and justified in a spec amendment, in a file that amendment names: crates/http-ng-fetch/src/promise.rs for amendment C7, crates/http-ng-dns-system/src/sys/res_query.rs and crates/http-ng-dns-system/src/sys/windows.rs for amendment C8. WHERE TO PUT THE MARKER: either trailing on the flagged line itself (\`unsafe { b() } // unsafe-code-exception: amendment-C8\`) or alone on the line IMMEDIATELY BELOW it, which is where cargo fmt moves it for block-opening forms such as \`unsafe extern \"C\" {\`. A marker written ABOVE the line does NOT work — it is folded onto the preceding line instead. If the unsafe is not justified by an amendment, it does not belong in this repository."
            exit 1
          fi
          echo "unsafe: not found (outside the three marked, justified exceptions in crates/http-ng-fetch/src/promise.rs and crates/http-ng-dns-system/src/sys/{res_query,windows}.rs) in any of ${#dirs[@]} directories (${dirs[*]})"

  # Task 9. Before this job, CI ran ZERO browser tests — no `wasm-pack
  # test`, no `wasm-bindgen-test-runner`, no driver setup anywhere in this
  # file. `msrv`'s `--target wasm32-unknown-unknown` line (`crates/http-ng-
  # fetch`) and `no-declared-send`'s scan of that crate's `src` both
  # type-check or grep — neither ever EXECUTES a single one of the 65
  # `#[wasm_bindgen_test]`s already in the tree. They were known to pass
  # (`task-9-addendum-measured.md`: 65/65 on both Chrome and Firefox,
  # measured directly on `14091c2`) by someone running `wasm-pack test` by
  # hand, not by the pipeline — this job is what makes that a standing
  # guarantee instead of a one-off fact.
  #
  # NOT for the reason `task-9-brief.md` states. That brief's own bolded
  # rationale — "in Chrome `streaming_request_body == true`, in Firefox
  # `false`, and the same binary must behave correctly in both" — stopped
  # being true at `aa728c0`: `caps.rs` now hardcodes BOTH
  # `streaming_request_body` and `full_duplex` to `false` unconditionally,
  # on every browser, because nothing in this crate builds a request-body
  # `ReadableStream` yet — reporting `true` in Chrome would have been
  # exactly the capability-that-lies this project's `Capabilities` registry
  # exists to prevent. Do not restore the difference to make the brief's
  # rationale true again; the hardcoding is correct, and its own reasoning
  # is written out at length in `caps.rs` itself.
  #
  # The matrix is kept anyway, for what's actually still true: 65 tests run
  # against two independent engine implementations of the Fetch/Promise/
  # setTimeout surface this crate depends on, and one genuinely
  # browser-varying runtime probe that survives —
  # `crates/http-ng-fetch/tests/caps.rs`'s
  # `supports_duplex_reflects_the_prototype_not_a_hardcoded_constant`,
  # which compares against whatever `Request.prototype.duplex` the running
  # browser ACTUALLY has, not against a constant, and must therefore pass
  # identically on both rather than agreeing with either by coincidence.
  #
  # `crates/http-ng` IS in this job. Task 8 gave that crate a browser-target
  # dependency and its own `wasm-bindgen-test` suite
  # (`tests/wasm_default.rs`, 6 tests), and this job runs it. An earlier
  # version of this comment said the crate was deliberately excluded because
  # Task 8 had not landed — written while the two tasks ran concurrently, and
  # left standing after the second one landed.
  browser:
    strategy:
      matrix:
        browser: [chrome, firefox]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: wasm32-unknown-unknown }
      - uses: jetli/wasm-pack-action@v0.4.0
      - name: browser tests
        shell: bash
        run: |
          set -euo pipefail
          # Fails closed on a missing crate, deliberately. An earlier draft
          # of this step skipped with a `::notice::` when the directory was
          # absent, which is the same fail-open shape `ambient-has-no-tokio`
          # and `no-unsafe-code` both refuse: a renamed or moved crate would
          # turn "we ran no browser tests at all" into a green run. Until
          # Task 9 wired this job up, CI executed ZERO browser tests while
          # 65 of them passed locally, so a silent skip here reproduces
          # exactly the gap this job exists to close.
          for crate in crates/http-ng-fetch crates/http-ng; do
            if [ ! -d "$crate" ]; then
              echo "::error::$crate is missing — this job must run browser tests, not skip them"
              exit 1
            fi
          done
          # `wasm-pack test` EXITS 0 ON AN EMPTY RUN. Measured: dropping the
          # feature list from the `http-ng` invocation below prints
          # "no tests to run!" twelve times and the job goes green having
          # executed nothing. That is precisely the state this job exists to
          # end — 65 browser tests present, none run, CI green — so counting
          # them is the guard that matters, not the presence of the crates.
          #
          # The minimums below are the counts as of this commit. Adding tests
          # keeps the job green; REMOVING one turns it red on purpose. If a
          # test is deliberately deleted, lower the number in the same commit
          # — the check is not obligated to silently accept a shrinking suite.
          run_browser_suite() {
            local crate="$1" min="$2" log passed
            shift 2
            log="$(mktemp)"
            if ! wasm-pack test --headless --${{ matrix.browser }} "$crate" "$@" 2>&1 | tee "$log"; then
              echo "::error::browser tests failed for $crate on ${{ matrix.browser }}"
              exit 1
            fi
            passed="$(grep -oE '[0-9]+ passed' "$log" | awk '{s+=$1} END {print s+0}')"
            if [ "$passed" -lt "$min" ]; then
              echo "::error::$crate on ${{ matrix.browser }} ran $passed browser tests, expected at least $min — a renamed test file, a dropped #[wasm_bindgen_test], or a drift between this job's --features and the crate's own cfg gate all produce a green run that tests nothing"
              exit 1
            fi
            echo "$crate on ${{ matrix.browser }}: $passed browser tests passed (minimum $min)"
          }

          run_browser_suite crates/http-ng-fetch 65
          # `http-ng`'s own browser tests: `Client::new()` on the browser
          # target, added in Task 8. The features are `wasm-pack`'s own
          # arguments, not `cargo test --` passthrough — `-- --features ...`
          # is rejected with "unexpected argument '--features'".
          run_browser_suite crates/http-ng 6 --features default-transport,test-util

  # Task 9 (task-9-addendum-measured.md, Defects 1 and 2). `ambient` names
  # the browser build specifically — this job is the wasm32-unknown-unknown
  # sibling of the existing host-only `proto-is-sans-io` job below, not a
  # duplicate of it.
  #
  # Defect 2: both `cargo tree` calls now name `--target
  # wasm32-unknown-unknown` explicitly. Without it, this job described the
  # HOST dependency graph while claiming to police the ambient browser
  # build — a dependency pulled in only under a `[target.'cfg(...)']` table
  # is exactly what this job exists to catch, and exactly what a host-only
  # tree cannot see. Checked directly: the graph is identical on host and
  # on this target today, so this isn't currently hiding a live violation —
  # it was still the wrong target to name.
  #
  # Defect 1: fails closed on a broken `cargo tree` invocation itself.
  # Measured, not assumed: the brief's own `grep ... && exit 1 || true`
  # pipeline reports SUCCESS when `cargo tree` itself fails — empty stdin
  # reaches `grep`, `grep` finds no match, `|| true` fires, green —
  # reproduced directly by substituting a nonexistent package name
  # (`cargo tree -p this-package-does-not-exist ...` passes the brief's own
  # logic). That is exactly the fail-open shape `no-unsafe-code` already
  # refuses, lower in this file (`${#dirs[@]} -eq 0` FAILS the job, does
  # not pass it) — matched here: `cargo tree`'s own exit code and an empty
  # result are both explicit, named failures, never a silent pass. Both
  # directions verified: the broken-package case now fails (`cargo tree`
  # itself exits non-zero, caught), and the real `http-ng-fetch`/
  # `http-ng-proto` checks still pass cleanly on `wasm32-unknown-unknown`.
  ambient-has-no-tokio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: wasm32-unknown-unknown, wasm32-wasip2 }
      - name: fetch build (wasm32-unknown-unknown) must contain neither tokio, hyper, nor h2
        shell: bash
        run: |
          set -uo pipefail
          if [ ! -d crates/http-ng-fetch ]; then
            echo "::error::http-ng-fetch is missing — every crate in this workspace exists, so this is a broken path or a renamed crate, not a not-yet-written one; the check must run, not skip"
            exit 1
          fi
          tree_out="$(cargo tree -p http-ng-fetch -e normal --prefix none --target wasm32-unknown-unknown)"
          tree_rc=$?
          if [ "$tree_rc" -ne 0 ]; then
            echo "::error::cargo tree failed (exit $tree_rc) for http-ng-fetch on wasm32-unknown-unknown — a broken invocation is not a passing check"
            exit 1
          fi
          if [ -z "$tree_out" ]; then
            echo "::error::cargo tree produced no output for http-ng-fetch on wasm32-unknown-unknown — an empty dependency tree means the check did not run, not that it passed"
            exit 1
          fi
          if printf '%s\n' "$tree_out" | grep -E '^(tokio|hyper|h2)'; then
            echo "::error::http-ng-fetch's wasm32-unknown-unknown dependency graph contains tokio, hyper, or h2 — the browser transport must stay free of the native HTTP stack"
            exit 1
          fi
          echo "OK: no tokio/hyper/h2 in http-ng-fetch's wasm32-unknown-unknown dependency graph"
      - name: wasi build (wasm32-wasip2) must contain neither tokio, hyper, nor h2
        shell: bash
        run: |
          set -euo pipefail
          # The README's v0.1 status table prints "no tokio" for BOTH wasm
          # rows and says both are machine-checked. Only the browser one was;
          # the WASI row was asserted. This step is what makes that sentence
          # true — the fact itself was already true when measured by hand,
          # but "we know because CI checks it" was not.
          if [ ! -d crates/http-ng-wasi ]; then
            echo "::error::http-ng-wasi is missing — a renamed or moved crate must fail this check, not remove it"
            exit 1
          fi
          tree_rc=0
          tree_out="$(cargo tree -p http-ng-wasi -e normal --prefix none --target wasm32-wasip2)" || tree_rc=$?
          if [ "$tree_rc" -ne 0 ]; then
            echo "::error::cargo tree failed (exit $tree_rc) for http-ng-wasi on wasm32-wasip2 — a broken invocation is not a passing check"
            exit 1
          fi
          if [ -z "$tree_out" ]; then
            echo "::error::cargo tree produced no output for http-ng-wasi on wasm32-wasip2 — an empty dependency tree means the check did not run, not that it passed"
            exit 1
          fi
          if printf '%s\n' "$tree_out" | grep -qE '^(tokio|hyper|h2) '; then
            echo "::error::http-ng-wasi's wasm32-wasip2 dependency graph contains tokio, hyper, or h2 — the wasi:http transport delegates the exchange to the host and must stay free of the native HTTP stack"
            exit 1
          fi
          echo "http-ng-wasi on wasm32-wasip2: no tokio, hyper or h2"

      - name: proto (wasm32-unknown-unknown) must stay sans-io
        shell: bash
        run: |
          set -uo pipefail
          if [ ! -d crates/http-ng-proto ]; then
            echo "::error::http-ng-proto is missing — every crate in this workspace exists, so this is a broken path or a renamed crate, not a not-yet-written one; the check must run, not skip"
            exit 1
          fi
          tree_out="$(cargo tree -p http-ng-proto -e normal --prefix none --target wasm32-unknown-unknown)"
          tree_rc=$?
          if [ "$tree_rc" -ne 0 ]; then
            echo "::error::cargo tree failed (exit $tree_rc) for http-ng-proto on wasm32-unknown-unknown — a broken invocation is not a passing check"
            exit 1
          fi
          if [ -z "$tree_out" ]; then
            echo "::error::cargo tree produced no output for http-ng-proto on wasm32-unknown-unknown — an empty dependency tree means the check did not run, not that it passed"
            exit 1
          fi
          if printf '%s\n' "$tree_out" | grep -Ei '^(tokio|futures-|async-)'; then
            echo "::error::http-ng-proto's wasm32-unknown-unknown dependency graph contains an async dependency — this crate must stay sans-io on every target, not just the host"
            exit 1
          fi
          echo "OK: http-ng-proto stays sans-io on wasm32-unknown-unknown"

  # Task 9. Not one of task-9-addendum-measured.md's three named defects,
  # but found the same way they were: measured, not assumed, while
  # verifying this exact job before adding it.
  #
  # The brief's own job body checks only the LIB target — `cargo check -p
  # http-ng-fetch --target wasm32-unknown-unknown -Zbuild-std=std,
  # panic_abort`, no `--tests`. Verified directly: this compiles CLEANLY
  # under `-Ctarget-feature=+atomics`, regardless of whether
  # `SingleThreaded<T>`'s `unsafe impl Send` (gated `#[cfg(not(target_
  # feature = "atomics"))]`, `promise.rs`) is present at all. Nothing in
  # the crate's own lib code DECLARES a Send bound anywhere — by design,
  # see `no-declared-send` above — so the auto-trait property this job
  # exists to police is never actually demanded by a bare `cargo check` of
  # the lib alone. As written, the brief's job would report "expected a
  # compile error" and FAIL unconditionally, the moment it's added,
  # regardless of whether the crate is actually correct — a vacuous check
  # in the specific sense that it cannot distinguish a real regression from
  # a healthy build.
  #
  # `--tests` fixes it: it's what actually compiles the `assert_send` calls
  # that require the bound this job means to protect
  # (`tests/promise.rs`'s `future_is_send_on_the_default_target`,
  # `tests/transport.rs`'s two `execute_future_is_send_*`). Verified both
  # directions on this exact form, not just one: under `+atomics`, the
  # build now genuinely fails with a real `E0277` rooted at `tests/
  # transport.rs`'s own `assert_send` call; without `+atomics`, it succeeds
  # cleanly — so this can tell a real regression apart from the ordinary
  # case, which the brief's own version could not.
  fetch-must-fail-under-wasm-threads:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with: { targets: wasm32-unknown-unknown, components: rust-src }
      - name: the unsafe Send must be rejected when atomics are on
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -d crates/http-ng-fetch ]; then
            echo "::error::crates/http-ng-fetch is missing — this check must run, not skip"
            exit 1
          fi
          # This step's only signal used to be "the build failed", with
          # nothing verifying WHY. Measured: one character changed in the
          # package name yields "error: package ID specification did not
          # match any packages" and then "OK: correctly rejected under
          # +atomics", exit 0. A missing rust-src, an unrelated compile
          # error, a nightly change to -Zbuild-std or an interrupted download
          # all passed it the same way — the very fail-open shape the two
          # `cargo tree` jobs above were rewritten to remove.
          #
          # The failure must now be the RIGHT failure: E0277 naming the Send
          # bound. Anything else is a broken check, not a passing one.
          log="$(mktemp)"
          if RUSTFLAGS="-Ctarget-feature=+atomics,+bulk-memory" \
              cargo +nightly check -p http-ng-fetch --tests \
              --target wasm32-unknown-unknown -Zbuild-std=std,panic_abort \
              > "$log" 2>&1; then
            echo "::error::expected a compile error under +atomics — the Send guarantee SingleThreaded<T> exists to provide is not being enforced"
            exit 1
          fi
          if ! grep -q 'error\[E0277\]' "$log" || ! grep -q 'cannot be sent between threads safely' "$log"; then
            echo "::error::the build under +atomics failed, but NOT with the expected Send rejection (E0277 / cannot be sent between threads safely) — this check proves nothing until the failure is the right one; full output follows"
            cat "$log"
            exit 1
          fi
          echo "OK: correctly rejected under +atomics with E0277 on the Send bound"

  # Task 10 of vertical 3 — the acceptance, and the one job in this file
  # that checks a property of the whole library rather than of one crate:
  # `examples/portable.rs` (the port of `act`'s `http-client` component,
  # written against `wasi-fetch` before this library existed) builds for
  # native, WASI and the browser from ONE source with not a single
  # `#[cfg]`. The spec calls that the stop criterion for the `Transport`
  # shape.
  #
  # Both halves are needed, and neither is redundant:
  #
  #   1. Three builds. Without them, the example rots the first time a
  #      signature changes on a path only one target takes.
  #   2. The `#[cfg]` scan. Without it, the three builds stay green forever
  #      by the simplest possible means — someone adds a `#[cfg]` to the
  #      example, the builds pass, and the criterion silently becomes a
  #      statement about nothing. That is precisely the failure mode the
  #      task brief calls out ("a `#[cfg]` quietly inserted to make it
  #      build destroys the result"), so it is checked mechanically rather
  #      than trusted to review.
  #
  # The scan is Python, not `grep -n '#\[cfg'`: the example's own doc
  # comment talks ABOUT `#[cfg]`, and its `main` prints a string containing
  # it. A grep that cannot tell an attribute from prose would either fail
  # on the honest file (and get "fixed" by deleting the explanation) or be
  # weakened until it matched nothing. Comments and string literals are
  # stripped first, then what is left is searched — verified against the
  # real file in both directions: green as written, red once a `#[cfg]`
  # attribute is planted.
  portable-example-three-targets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip2, wasm32-unknown-unknown
      - shell: bash
        run: |
          set -euo pipefail
          if [ ! -f crates/http-ng/examples/portable.rs ]; then
            echo "::error::examples/portable.rs is missing — every crate in this workspace exists, so this is a broken path or a renamed crate, not a not-yet-written one; the check must run, not skip"
            exit 1
          fi
          python3 - <<'PYEOF'
          import re
          import sys
          from pathlib import Path

          src = Path("crates/http-ng/examples/portable.rs").read_text(encoding="utf-8")
          # Comment lines first, then string literals over what is left --
          # in that order, and the string pass over the WHOLE text rather
          # than line by line. The example's `main` prints a string that
          # mentions `#[cfg]` and wraps it across two lines with a trailing
          # backslash, so a per-line pass sees neither of the two quotes
          # paired and leaves the mention standing. `re.S` is what lets
          # `\\.` step over that escaped newline. Measured: without either,
          # this scan goes red on the honest file.
          code = "\n".join(
              line for line in src.splitlines() if not line.lstrip().startswith("//")
          )
          code = re.sub(r'"(?:[^"\\]|\\.)*"', '""', code, flags=re.S)

          hits = [
              m.group(0)
              for m in re.finditer(r"#!?\[\s*cfg[_a-z]*|\bcfg!\s*\(", code)
          ]
          if hits:
              print(
                  "::error file=crates/http-ng/examples/portable.rs::"
                  f"the acceptance example must contain no cfg switch, found: {hits}. "
                  "If it needs one to build, the Transport shape is wrong and that is "
                  "the finding — do not add the cfg."
              )
              sys.exit(1)
          print("OK: no cfg switch in the acceptance example")
          PYEOF
          cargo build -p http-ng --example portable
          cargo build -p http-ng --example portable --target wasm32-wasip2
          cargo build -p http-ng --example portable --target wasm32-unknown-unknown
