[workspace]
resolver = "3"
members = ["crates/*"]

# Every publishable crate carries `[package.metadata.docs.rs] all-features =
# true`, and the reason is stated here rather than 29 times. docs.rs builds
# `default` features only; in this workspace `default` is empty or
# near-empty by design, because every backend, coding, proxy and knob is a
# feature — a build should carry nothing it did not ask for. Without the
# setting, the published page for a crate whose whole story is its features
# would show almost none of it. Verified buildable rather than assumed:
# `cargo doc --workspace --all-features --no-deps` is green on x86-64 Linux,
# the target docs.rs uses, and `just docs` keeps it that way on every push.

[workspace.package]
version      = "0.1.0-alpha.2"
edition      = "2024"
rust-version = "1.98"
license      = "MIT OR Apache-2.0"
repository   = "https://github.com/GamePad64/hclient"

[workspace.dependencies]
http           = "1.5"
http-body      = "1.1"
http-body-util = "0.1"
bytes          = "1.12"
futures-core   = { version = "0.3", default-features = false, features = ["alloc"] }
futures-sink   = { version = "0.3", default-features = false }
url            = "2.5"
proptest       = "1"
# Dev-only, and it costs no crate: `assert_impl_all!`/`assert_not_impl_all!`
# replace the `fn assert_send<T: Send>() {}` helper this workspace had
# written 25 times. The macro is what makes it more than tidying — a
# hand-written helper can be weakened to `fn assert_send<T>()` and the
# test then passes vacuously, which is why the ones that mattered needed a
# `compile_fail` control in another file.
static_assertions = "1.1"
bitflags       = "2.13"

# `default-features = false` on both, and it is the whole reason they are
# affordable in a sans-io leaf. jiff's default pulls `tz-system`, which
# reaches for the platform's local timezone; `alloc` alone leaves the
# proleptic Gregorian calendar, which is all either date parser wants —
# neither asks jiff to parse. Measured: `jiff` + `jiff-core`, `winnow`
# alone, no build script among the three, and every one of them builds for
# `wasm32-unknown-unknown` and `wasm32-wasip2`.
jiff           = { version = "0.2", default-features = false, features = ["alloc"] }
# Hex *printing*, which two places here had hand-rolled — a digest response
# and a multipart boundary. `alloc` alone, no build script, and both wasm
# targets. It is deliberately not asked to do percent-encoding: `%XX` is
# hex interleaved with literal bytes rather than a hex string, and
# `hclient-proto`'s `encode` keeps its own table for that.
const-hex      = { version = "1", default-features = false, features = ["alloc"] }
# RFC 4648 §4, encode only. Already in the graph of any build that does DNS
# with a codec (`dns-message-parser` pulls it), so it is free there and one
# crate for a bare `hclient-proto`. `alloc` alone, no build script.
base64         = { version = "0.23", default-features = false, features = ["alloc"] }
# The other two encodings, and **not** `url`: `form_urlencoded` is its own
# crate depending on `percent-encoding` alone, so the WHATWG serialiser
# costs two crates and brings no `idna` and no ICU. This workspace recorded
# the opposite for two verticals and it was never measured — see
# `hclient-proto`'s `encode` module doc.
form_urlencoded = "1"
percent-encoding = "2"
# `ascii` implies `parser`, which is what gates `combinator` and `token` —
# winnow 1.0 split those out, so this is a smaller build than 0.7's `alloc`
# alone rather than a wider one. `std` and `binary` are deliberately off:
# nothing here parses a length-prefixed wire format through winnow.
winnow         = { version = "1.0", default-features = false, features = ["alloc", "ascii"] }

# `default-features = false`: `hclient-proto`'s own default is `idn`, and
# cargo forbids a member from overriding a workspace dependency's
# `default-features` back to false. Consumers opt in by name instead —
# `hclient` forwards it as its own `idn` feature, which is where a consumer
# of the facade can switch it off. Building `hclient-proto` on its own
# still gets `idn`, since that is its own default.
hclient-proto = { path = "crates/hclient-proto", version = "0.1.0-alpha.2", default-features = false }
hclient-core  = { path = "crates/hclient-core",  version = "0.1.0-alpha.2" }
hclient-mock  = { path = "crates/hclient-mock",  version = "0.1.0-alpha.2" }
# Default features left ON, and the opposite of `hclient-proto` above:
# this crate's default is `platform`, which is
# not a choice a consumer makes but a fact about the target — the bundled
# `idna` tables on Linux and wasm, `icuuc.dll` on Windows, Foundation on
# Apple, resolved in its `build.rs`. Turning it off leaves the crate with
# no backend at all, which its own `compile_error!` refuses. The switch a
# consumer actually wants is one level up: `hclient-proto`'s `idn`, which
# decides whether this crate is in the graph at all.
hclient-idn   = { path = "crates/hclient-idn",   version = "0.1.0-alpha.2" }
thiserror     = "2"
rstest        = { version = "0.26", default-features = false }
hclient       = { path = "crates/hclient",       version = "0.1.0-alpha.2" }

[workspace.lints.rust]
unsafe_code       = "forbid"
missing_debug_implementations = "warn"
unexpected_cfgs   = { level = "warn", check-cfg = [] }

# ── Releasing: `cargo release <level>` ──────────────────────────────────
#
# What this tool is here for is the **bump**, and only that. Publishing is
# `cargo publish --workspace`, which cargo 1.98 does natively — measured on
# this workspace, which it packages, verifies and orders itself, arriving at
# the same order `docs/publishing.md` derives independently.
#
# What has no other owner is the version: `[workspace.package].version` is
# one number, and beside it are dozens of literal `version = "..."`
# requirements that must move with it. Cargo offers no way to write
# `version.workspace = true` inside a dependency requirement, so the
# repetition is forced, and nothing checked that the copies agreed — so
# they did not. After the alpha.2 release every one of them still read
# `alpha.1`. `just versions-agree` derives the count from the manifests
# and compares each requirement against the workspace version, so the
# figure is not written here: a number in prose is the drift this file
# already removed once for the version itself.
#
# An unknown key here is a hard parse error rather than a silent no-op —
# checked on purpose before writing this block, because a release
# configuration that quietly ignores a typo is the shape this project
# refuses everywhere else.
[workspace.metadata.release]
# **A named group rather than `true`, and the name is what allows an
# exception without inventing a mechanism for one.** `shared-version`
# takes a bool or a string, and a string makes a *subset* that versions
# together — so this is still "one version for the whole family", said in
# a way that lets `system-resolver` say a different one. Everything
# inheriting `version.workspace = true` is in this group by naming it;
# nothing opts out by accident, because a crate leaves only by writing
# its own literal version and its own group, which is two deliberate
# lines rather than a missing one.
shared-version = "hclient"
# **`upgrade`, and `fix` was here for a policy this workspace does not
# have.** `fix` touches a dependent's requirement only when the new
# version stops satisfying it, which keeps `hclient` asking for
# `^0.1.0-alpha.1` for ever, so an already-published neighbour keeps
# satisfying it and only the crates that changed need publishing. Every
# word of that is true and its subject is `cargo release -p <crate>` —
# which the policy three lines up forbids: **every crate is published on
# every release**, so there is no neighbour to spare a publish.
#
# What it cost is a requirement that lies, and it was measured on the
# published crates rather than reasoned about. `hclient` 0.1.0-alpha.2
# asks `^0.1.0-alpha.1` of `hclient-core`, and a caller who pins
# `hclient-core = "=0.1.0-alpha.1"` gets a resolution cargo accepts and
# rustc refuses: `cannot find Reduced in hclient_core`, because
# `Reduced` arrived in alpha.2. A pre-release promises nothing between
# alphas — that is what this file says a pre-release is *for* — so a
# requirement spanning two of them claims a compatibility that was never
# offered.
#
# `^0.1.0-alpha.2` excludes alpha.1 outright, so `upgrade` closes it with
# no need for `=` pins. The 61 literal requirements move with the version
# now, and `just versions-agree` is what says they did — because they had
# already drifted once, silently, which is how this was found.
dependent-version = "upgrade"
# One commit for the bump, not thirty.
consolidate-commits = true
# Releases come off `main` and nowhere else. The default is every branch
# except `HEAD`, which would let a release happen from a feature branch.
allow-branch = ["main"]
# The default messages are `chore: Release …`, and this repository does not
# write conventional commits — nought of the last twenty-five subjects are
# in that form, and its commit messages are the record of *why*. A release
# commit has no argument to make, so it says what it did and stops.
pre-release-commit-message = "Release {{version}}"
tag-name = "v{{version}}"
tag-message = "hclient {{version}}"
