[workspace]
resolver = "3"
members = ["crates/*"]

# Every publishable crate carries `[package.metadata.docs.rs] all-features =
# true`, and the reason is stated here rather than 29 times. docs.rs builds
# `default` features only; in this workspace `default` is empty or
# near-empty by design, because every backend, coding, proxy and knob is a
# feature — a build should carry nothing it did not ask for. Without the
# setting, the published page for a crate whose whole story is its features
# would show almost none of it. Verified buildable rather than assumed:
# `cargo doc --workspace --all-features --no-deps` is green on x86-64 Linux,
# the target docs.rs uses, and `just docs` keeps it that way on every push.

[workspace.package]
version      = "0.1.0"
edition      = "2024"
rust-version = "1.98"
license      = "MIT OR Apache-2.0"
repository   = "https://github.com/GamePad64/hclient"

[workspace.dependencies]
http           = "1.5"
http-body      = "1.1"
http-body-util = "0.1"
bytes          = "1.12"
futures-core   = { version = "0.3", default-features = false }
futures-sink   = { version = "0.3", default-features = false }
url            = "2.5"
proptest       = "1"

# `default-features = false`: `hclient-proto`'s own default is `idn`, and
# cargo forbids a member from overriding a workspace dependency's
# `default-features` back to false. Consumers opt in by name instead —
# `hclient` forwards it as its own `idn` feature, which is where a consumer
# of the facade can switch it off. Building `hclient-proto` on its own
# still gets `idn`, since that is its own default.
hclient-proto = { path = "crates/hclient-proto", version = "0.1.0", default-features = false }
hclient-core  = { path = "crates/hclient-core",  version = "0.1.0" }
hclient-mock  = { path = "crates/hclient-mock",  version = "0.1.0" }
# Default features left ON, unlike `hclient-proto` above: that crate's
# default (`idn`) is what `hclient` forwards as a feature of its own, while
# this one's (`public-suffix`) is what makes `Domain=co.uk` a refusal
# rather than a cookie shared across every registrant under `.uk`. Turning
# it off does not make the jar smaller in any way a consumer of `hclient`
# asked for — it makes it host-only, which is a different jar, not a
# cheaper one. A consumer who wants that build takes `hclient-cookie`
# directly.
hclient-cookie = { path = "crates/hclient-cookie", version = "0.1.0" }
# No features at all, default or otherwise: unlike the jar, whose default
# is the public suffix list that makes `Domain=co.uk` a refusal, there is
# nothing in this crate a build could sensibly do without. The store is a
# seam rather than a feature (`CacheStore`), so "a smaller cache" is a
# different `S`, not a thinner build.
hclient-cache = { path = "crates/hclient-cache", version = "0.1.0" }
# Default features left ON, for the same reason as `hclient-cookie` and the
# opposite of `hclient-proto`: this crate's default is `platform`, which is
# not a choice a consumer makes but a fact about the target — the bundled
# `idna` tables on Linux and wasm, `icuuc.dll` on Windows, Foundation on
# Apple, resolved in its `build.rs`. Turning it off leaves the crate with
# no backend at all, which its own `compile_error!` refuses. The switch a
# consumer actually wants is one level up: `hclient-proto`'s `idn`, which
# decides whether this crate is in the graph at all.
hclient-idn   = { path = "crates/hclient-idn",   version = "0.1.0" }
thiserror     = "2"
rstest        = { version = "0.26", default-features = false }
assert_matches = "1.5"
hclient       = { path = "crates/hclient",       version = "0.1.0" }

[workspace.lints.rust]
unsafe_code       = "forbid"
missing_debug_implementations = "warn"
unexpected_cfgs   = { level = "warn", check-cfg = [] }
