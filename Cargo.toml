[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition      = "2024"
rust-version = "1.97"
license      = "MIT OR Apache-2.0"
repository   = "https://github.com/actcore/http-ng"

[workspace.dependencies]
http           = "1.5"
http-body      = "1.1"
http-body-util = "0.1"
bytes          = "1.12"
futures-core   = { version = "0.3", default-features = false }
url            = "2.5"
proptest       = "1"

# `default-features = false`: `http-ng-proto`'s own default is `idn`, and
# cargo forbids a member from overriding a workspace dependency's
# `default-features` back to false. Consumers opt in by name instead —
# `http-ng` forwards it as its own `idn` feature, which is where a consumer
# of the facade can switch it off. Building `http-ng-proto` on its own
# still gets `idn`, since that is its own default.
http-ng-proto = { path = "crates/http-ng-proto", version = "0.1.0", default-features = false }
http-ng-core  = { path = "crates/http-ng-core",  version = "0.1.0" }
http-ng-mock  = { path = "crates/http-ng-mock",  version = "0.1.0" }
# Default features left ON, unlike `http-ng-proto` above: that crate's
# default (`idn`) is what `http-ng` forwards as a feature of its own, while
# this one's (`public-suffix`) is what makes `Domain=co.uk` a refusal
# rather than a cookie shared across every registrant under `.uk`. Turning
# it off does not make the jar smaller in any way a consumer of `http-ng`
# asked for — it makes it host-only, which is a different jar, not a
# cheaper one. A consumer who wants that build takes `http-ng-cookie`
# directly.
http-ng-cookie = { path = "crates/http-ng-cookie", version = "0.1.0" }
thiserror     = "2"
rstest        = { version = "0.26", default-features = false }
assert_matches = "1.5"
http-ng       = { path = "crates/http-ng",       version = "0.1.0" }

[workspace.lints.rust]
unsafe_code       = "forbid"
missing_debug_implementations = "warn"
unexpected_cfgs   = { level = "warn", check-cfg = [] }
