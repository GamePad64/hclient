[workspace]
resolver = "3"
members = ["crates/*"]

# Every publishable crate carries `[package.metadata.docs.rs] all-features =
# true`, and the reason is stated here rather than 29 times. docs.rs builds
# `default` features only; in this workspace `default` is empty or
# near-empty by design, because every backend, coding, proxy and knob is a
# feature — a build should carry nothing it did not ask for. Without the
# setting, the published page for a crate whose whole story is its features
# would show almost none of it. Verified buildable rather than assumed:
# `cargo doc --workspace --all-features --no-deps` is green on x86-64 Linux,
# the target docs.rs uses, and `just docs` keeps it that way on every push.

[workspace.package]
# **There is no shared `version` here any more, and its absence is the
# release policy.** It read `version = "0.1.0-alpha.3"` and every crate
# inherited it with `version.workspace = true`, which is what made
# "publish every crate on every release" the only expressible policy: one
# number for 28 crates cannot advance for some of them.
#
# That was a good mechanism for the policy it served — thirty copies were
# thirty chances to drift, and one statement removed the drift. What ended
# it is a decision to publish only what changed, which needs the opposite:
# a crate's version has to be its own before it can move on its own.
# `hclient-idn` and `system-resolver` had already left for their own
# reasons and are the shape the rest now follow.
#
# What replaces the guarantee is not a second copy of it.
# `just versions-agree` resolves every in-workspace requirement to the
# crate it names and compares against **that** crate's version — which it
# has done since `system-resolver` left, so it needed no change here. The
# drift a shared version made impossible is now a thing a gate catches
# rather than a thing the layout forbids, and that is the honest cost of
# the trade.
edition      = "2024"
rust-version = "1.98"
license      = "MIT OR Apache-2.0"
repository   = "https://github.com/GamePad64/hclient"

[workspace.dependencies]
# **One declaration, because two crates ask for the same thing for the
# same reason.** `hclient-winhttp` binds WinHTTP's `LPCWSTR` parameters
# and `system-resolver` the wide name `DnsQueryRaw` takes; both want
# `HSTRING`, whose allocation **reserves the terminating null**, so
# `as_ptr()` is an `LPCWSTR` by construction rather than by a crate
# remembering to chain a zero — which is the two-line helper this
# replaced, and the kind of thing nothing catches losing.
#
# `default-features = false` on both, and it stays here: the default
# pulls `std`, and these are FFI string types either way.
#
# It costs one crate: `windows-strings` depends on `windows-link` alone,
# already present under `windows-sys`.
windows-strings = { version = "0.100", default-features = false }
# **The version here and the features at each call site**, which is the
# shape a `workspace.dependencies` entry has to take when consumers want
# different parts of one crate. Three crates ask for `windows-sys` and no
# two want the same features — `Win32_Networking_WinHttp` for the
# transport, `Win32_NetworkManagement_Dns` for the resolver,
# `Win32_Globalization` for the IDN backend — and features are additive,
# so naming them here would hand every consumer the union of all three.
# What was being repeated is the *number*, which is what this removes.
windows-sys = { version = "0.61" }
http           = "1.5"
http-body      = "1.1"
http-body-util = "0.1"
bytes          = "1.12"
futures-core   = { version = "0.3", default-features = false, features = ["alloc"] }
futures-sink   = { version = "0.3", default-features = false }
url            = "2.5"
proptest       = "1"
# Dev-only, and it costs no crate: `assert_impl_all!`/`assert_not_impl_all!`
# replace the `fn assert_send<T: Send>() {}` helper this workspace had
# written 25 times. The macro is what makes it more than tidying — a
# hand-written helper can be weakened to `fn assert_send<T>()` and the
# test then passes vacuously, which is why the ones that mattered needed a
# `compile_fail` control in another file.
static_assertions = "1.1"
bitflags       = "2.13"

# `default-features = false` on both, and it is the whole reason they are
# affordable in a sans-io leaf. jiff's default pulls `tz-system`, which
# reaches for the platform's local timezone; `alloc` alone leaves the
# proleptic Gregorian calendar, which is all either date parser wants —
# neither asks jiff to parse. Measured: `jiff` + `jiff-core`, `winnow`
# alone, no build script among the three, and every one of them builds for
# `wasm32-unknown-unknown` and `wasm32-wasip2`.
jiff           = { version = "0.2", default-features = false, features = ["alloc"] }
# Hex *printing*, which two places here had hand-rolled — a digest response
# and a multipart boundary. `alloc` alone, no build script, and both wasm
# targets. It is deliberately not asked to do percent-encoding: `%XX` is
# hex interleaved with literal bytes rather than a hex string, and
# `hclient-proto`'s `encode` keeps its own table for that.
const-hex      = { version = "1", default-features = false, features = ["alloc"] }
# RFC 4648 §4, encode only. Already in the graph of any build that does DNS
# with a codec (`dns-message-parser` pulls it), so it is free there and one
# crate for a bare `hclient-proto`. `alloc` alone, no build script.
base64         = { version = "0.23", default-features = false, features = ["alloc"] }
# The other two encodings, and **not** `url`: `form_urlencoded` is its own
# crate depending on `percent-encoding` alone, so the WHATWG serialiser
# costs two crates and brings no `idna` and no ICU. This workspace recorded
# the opposite for two verticals and it was never measured — see
# `hclient-proto`'s `encode` module doc.
form_urlencoded = "1"
percent-encoding = "2"
# `ascii` implies `parser`, which is what gates `combinator` and `token` —
# winnow 1.0 split those out, so this is a smaller build than 0.7's `alloc`
# alone rather than a wider one. `std` and `binary` are deliberately off:
# nothing here parses a length-prefixed wire format through winnow.
winnow         = { version = "1.0", default-features = false, features = ["alloc", "ascii"] }

# `default-features = false`: `hclient-proto`'s own default is `idn`, and
# cargo forbids a member from overriding a workspace dependency's
# `default-features` back to false. Consumers opt in by name instead —
# `hclient` forwards it as its own `idn` feature, which is where a consumer
# of the facade can switch it off. Building `hclient-proto` on its own
# still gets `idn`, since that is its own default.
hclient-proto = { path = "crates/hclient-proto", version = "0.1.0-alpha.5", default-features = false }
hclient-core  = { path = "crates/hclient-core", version = "0.1.0-alpha.7" }
hclient-mock  = { path = "crates/hclient-mock", version = "0.1.0-alpha.7" }
# Default features left ON, and the opposite of `hclient-proto` above:
# this crate's default is `platform`, which is
# not a choice a consumer makes but a fact about the target — the bundled
# `idna` tables on Linux and wasm, `icuuc.dll` on Windows, Foundation on
# Apple, resolved in its `build.rs`. Turning it off leaves the crate with
# no backend at all, which its own `compile_error!` refuses. The switch a
# consumer actually wants is one level up: `hclient-proto`'s `idn`, which
# decides whether this crate is in the graph at all.
hclient-idn   = { path = "crates/hclient-idn", version = "0.2.2" }
thiserror     = "2"
# **A generated `const` builder, for a `#[non_exhaustive]` struct that has
# to stay writable from outside.** `hclient_core::req::Timeouts` takes the
# attribute so a fifth bound is not a major version for every consumer,
# and the attribute closes the struct literal and the
# `..Default::default()` form to them — `E0639` for both. `bon`'s
# `#[builder(const)]` reopens it, `const` included, which is what
# `hclient-dns-doh`'s `DEFAULT_TIMEOUTS` needs: `Default::default()` is
# not a `const fn`, so no functional-update form exists there at all.
#
# It is used by `TimeoutSupport` too, and there the generated builder does
# the opposite job: `bon` makes a non-`Option` member **required**, so a
# field added to that struct is `Unset` at every transport rather than a
# silent `false`. Same crate, opposite property, because absence means the
# opposite thing in the two types.
#
# `default-features = false`, which drops `std`: the runtime crate is
# `no_std`-capable and `hclient-core` is the sans-io leaf — and both wasm
# targets still build, which is the check that matters for that leaf.
#
# **The cost, counted both ways.** `cargo tree -e normal` for
# `hclient-core` goes 16 -> 21, and that is the figure `just graph` style
# checks would see. Excluding proc-macros it is **9**: only `bon` itself
# links, 215 lines and `no_std`-capable, MSRV 1.88 against this
# workspace's floor of latest-stable. The other crates — `syn`, `darling`,
# `prettyplease`, `quote` — are build-time and reach no binary.
bon           = { version = "3.10", default-features = false }
rstest        = { version = "0.26", default-features = false }
hclient       = { path = "crates/hclient", version = "0.1.0-alpha.7" }

[workspace.lints.rust]
unsafe_code       = "forbid"
missing_debug_implementations = "warn"
unexpected_cfgs   = { level = "warn", check-cfg = [] }

# ── Releasing: `release-plz` ────────────────────────────────────────────
#
# **cargo-release configuration used to live here and is gone**; the tool
# is `release-plz` now and its configuration is `release-plz.toml` at the
# repository root. What changed is the policy rather than the vendor:
# cargo-release published every crate on every release, and this publishes
# the crates that changed.
#
# The reason cargo-release could not do the new thing is worth keeping,
# because it is a fact about this workspace and not about that tool:
# **it has no change detection at all**. Measured, with a tag one commit
# back, a plain `cargo release patch` still planned all 23 uploads. Its
# `-p` flag selects, which is knowing-which-crates-changed by hand — the
# step the old policy existed to remove.
#
# What this workspace had to change to make per-crate releases possible is
# recorded at `[workspace.package]` above: the shared `version` is gone
# and every crate carries its own.
